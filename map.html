// ═══════════════════════════════════════════════════════════
//  KÖPPEN OVERLAY
// ═══════════════════════════════════════════════════════════

function koppenCodeFromProps(props) {
  return props.CODE || props.code || props.Cls || props.GRIDCODE || props.Koppen || null;
}

// Hoisted so applyLegendFilters can pass it to koppenLayer.updateColors()
// after the selectedKoppenCodes set changes. Closes over the live set so a
// single function reference reflects current filter state on each evaluation.
//
// When a filter is active, non-selected zones return a UNIFORM dim grey
// (not their own dimmed colour) — this avoids visible tile-edge artifacts
// from per-pixel rgba blending and prevents the original Köppen colours
// from clashing visually with the selected ones. Selected zones render in
// full saturation so they stand out clearly against the dim background.
function koppenColorFn(values) {
  const v = values[0];
  if (!v || v < 1 || v > 30) return null;
  const c = BECK_COLORS[v];
  if (!c) return null;
  if (selectedKoppenCodes.size === 0 || selectedKoppenCodes.has(v)) {
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }
  // Uniform dark grey for ALL non-selected zones. Matches the dark basemap
  // tone so non-selected areas read as "muted background" without colour
  // information that could distract from the selection.
  return 'rgb(38,42,48)';
}

async function loadKoppen() {
  const PATH_01 = './koppen_geiger_tif/1991_2020/koppen_geiger_0p1.tif';
  try {
    const buf = await fetch(PATH_01).then(r => r.ok ? r.arrayBuffer() : null).catch(() => null);
    if (!buf) return;
    koppenGeoRaster = await parseGeoraster(buf);
    koppenLayer = new GeoRasterLayer({
      georaster: koppenGeoRaster, pane: 'koppenPane',
      opacity: satelliteActive ? 0.35 : 0.55,
      resolution: 64, pixelValuesToColorFn: koppenColorFn
    });
    if (koppenVisible) koppenLayer.addTo(map);
    updateKoppenBlur();
  } catch { /* overlay unavailable */ }
}

// Decide if a species lives "in the tropics" — used to hide the seasonal-shift
// toggle, since equatorial species have weak seasons and shifting by 6 months
// produces a near-identical chart. Definition: median |latitude| < 23.5°
// (Tropic of Cancer / Capricorn). Result is cached per taxon name for the
// session. Falls back to FALSE (show the toggle) if obs data isn't loaded yet.
function isSpeciesTropical(taxonName) {
  if (speciesTropicalCache.has(taxonName)) return speciesTropicalCache.get(taxonName);
  if (!inatObs.length || !inatTaxa.length) return false;
  const absLats = [];
  for (const o of inatObs) {
    if (inatTaxa[o[OBS_TI]]?.[1] === taxonName) {
      absLats.push(Math.abs(o[OBS_LAT]));
    }
  }
  if (!absLats.length) {
    // No obs found — don't cache, so a later load can re-evaluate
    return false;
  }
  absLats.sort((a, b) => a - b);
  const median = absLats[Math.floor(absLats.length / 2)];
  const tropical = median < 23.5;
  speciesTropicalCache.set(taxonName, tropical);
  return tropical;
}

function getKoppenAt(lat, lng) {
  const g = koppenGeoRaster;
  if (!g || !g.values || !g.values[0]) return 0;
  const col = Math.floor((lng - g.xmin) / g.pixelWidth);
  const row = Math.floor((g.ymax - lat) / g.pixelHeight);
  if (row < 0 || row >= g.height || col < 0 || col >= g.width) return 0;
  return g.values[0][row][col];
}

function showKoppenPopup(latlng) {
  const v = getKoppenAt(latlng.lat, latlng.lng);
  if (!v || v < 1 || v > 30) return;
  const zone = BECK_ZONES[v];
  const [r, g, b] = BECK_COLORS[v];
  L.popup({ maxWidth: 240 })
    .setLatLng(latlng)
    .setContent(
      `<div class="kp-popup">` +
      `<div class="kp-popup-head"><span class="kp-swatch" style="background:rgb(${r},${g},${b})"></span><span class="kp-code">${zone.code}</span></div>` +
      `<div class="kp-desc">${zone.desc}</div>` +
      `<div class="kp-group">${zone.group}</div>` +
      `<button class="kp-climate-btn" onclick="openClimateAt(${latlng.lat},${latlng.lng})">↓ Load climate data</button>` +
      `</div>`
    )
    .openOn(map);
}

// ═══════════════════════════════════════════════════════════
//  PIN RENDERING
// ═══════════════════════════════════════════════════════════

function renderPins(taxa) {
  // Skip addTo when the gallery toggle is off — saves N add+remove Leaflet ops
  // at startup (default is off). The toggle handler calls applyFilters() which
  // will addTo on demand.
  taxa.forEach(taxon => {
    const { lat, lng, rangeRadiusKm, coordinatePrecision } = taxon.mapPin;
    const color = genusColor(taxon.genus);

    const marker = L.marker([lat, lng], { icon: makeIcon(taxon), zIndexOffset: 100 });
    marker.bindTooltip(taxon.displayName, { direction: 'top' });
    marker.on('click', e => { L.DomEvent.stopPropagation(e); handlePinClick(e, taxon); });
    if (gallerySpeciesVisible) marker.addTo(map);

    let circle = null;
    if (rangeRadiusKm) {
      circle = L.circle([lat, lng], {
        radius:      rangeRadiusKm * 1000,
        color,
        fillColor:   color,
        fillOpacity: 0.07,
        weight:      1,
        opacity:     0.28,
        interactive: false
      });
      if (gallerySpeciesVisible) circle.addTo(map);
    }

    markerStore.set(taxon.id, { marker, circle, taxon });
  });
}

// ═══════════════════════════════════════════════════════════
//  OVERLAP DETECTION
// ═══════════════════════════════════════════════════════════

function handlePinClick(e, taxon) {
  const clickPt = map.latLngToContainerPoint(e.latlng);
  const nearby  = [];

  markerStore.forEach(({ marker, taxon: t }) => {
    if (!map.hasLayer(marker)) return;
    const pt = map.latLngToContainerPoint(marker.getLatLng());
    const dx = pt.x - clickPt.x, dy = pt.y - clickPt.y;
    if (Math.sqrt(dx*dx + dy*dy) < 14) nearby.push(t);
  });

  if (nearby.length > 1) {
    showOverlapPopup(e.latlng, nearby);
  } else {
    openPanel(taxon);
    flyToTaxon(taxon);
  }
}

function showOverlapPopup(latlng, taxa) {
  const items = taxa.map(t =>
    `<div class="overlap-item" data-id="${esc(t.id)}">
      <div class="overlap-dot" style="background:${genusColor(t.genus)}"></div>
      ${esc(t.displayName)}
    </div>`
  ).join('');

  const popup = L.popup({ className: '', closeButton: false, offset: [0, -5] })
    .setLatLng(latlng)
    .setContent(`<div class="overlap-popup">
      <div class="overlap-popup-title">${taxa.length} species at this location</div>
      ${items}
    </div>`)
    .openOn(map);

  setTimeout(() => {
    document.querySelectorAll('.overlap-item').forEach(el => {
      el.addEventListener('click', () => {
        map.closePopup(popup);
        const t = taxa.find(x => x.id === el.dataset.id);
        if (t) { openPanel(t); flyToTaxon(t); }
      });
    });
  }, 0);
}

function flyToTaxon(taxon) {
  const prec = taxon.mapPin?.coordinatePrecision || 'exact';
  const zoom = FLY_ZOOM[prec] || 9;
  map.flyTo([taxon.mapPin.lat, taxon.mapPin.lng], zoom, { duration: 0.8 });
}

// ═══════════════════════════════════════════════════════════
//  REGION HIGHLIGHT
// ═══════════════════════════════════════════════════════════

function clearRegionHighlight() {
  if (regionHighlight) { map.removeLayer(regionHighlight); regionHighlight = null; }
}

async function highlightRegion(taxon) {
  clearRegionHighlight();
  const prec  = taxon.mapPin?.coordinatePrecision;
  const color = genusColor(taxon.genus);

  if (prec === 'regional' && taxon.mapPin?.regionCode) {
    if (!statesGeoJSON) {
      try {
        const r = await fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_1_states_provinces.geojson');
        statesGeoJSON = await r.json();
      } catch { return; }
    }
    const code = taxon.mapPin.regionCode;
    const feat = statesGeoJSON.features.find(f =>
      f.properties.iso_3166_2 === code || f.properties.adm1_code === code
    );
    if (feat) regionHighlight = L.geoJSON(feat, {
      style: { fillColor: color, fillOpacity: 0.15, color, weight: 2, dashArray: '6,4', interactive: false }
    }).addTo(map);
  }

  if (prec === 'country' && taxon.mapPin?.countryCode) {
    if (!countriesGeoJSON) {
      try {
        const r = await fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson');
        countriesGeoJSON = await r.json();
      } catch { return; }
    }
    const code = taxon.mapPin.countryCode;
    const feat = countriesGeoJSON.features.find(f =>
      f.properties.ISO_A2 === code || f.properties.ADM0_A3 === code
    );
    if (feat) regionHighlight = L.geoJSON(feat, {
      style: { fillColor: color, fillOpacity: 0.15, color, weight: 2, dashArray: '6,4', interactive: false }
    }).addTo(map);
  }
}

// ═══════════════════════════════════════════════════════════
//  SIDE PANEL — OPEN / CLOSE
// ═══════════════════════════════════════════════════════════

function openPanel(taxon) {
  if (searchPanelOpen) closeLocationPanel();
  // Deselect previous marker
  if (selectedId && markerStore.has(selectedId)) {
    const { marker, taxon: prev } = markerStore.get(selectedId);
    marker.setIcon(makeIcon(prev, false));
  }
  selectedId = taxon.id;
  markerStore.get(taxon.id).marker.setIcon(makeIcon(taxon, true));

  renderPanel(taxon);
  document.getElementById('side-panel').classList.add('open');
  highlightRegion(taxon);
  setDeepLink('taxon', taxon.id);
}

function closePanel() {
  closeGalleryLightbox();   // never leave a lightbox floating over a closed panel
  if (searchPanelOpen) { closeLocationPanel(); return; }
  if (selectedId && markerStore.has(selectedId)) {
    const { marker, taxon } = markerStore.get(selectedId);
    marker.setIcon(makeIcon(taxon, false));
  }
  selectedId = null;
  document.getElementById('side-panel').classList.remove('open');
  clearRegionHighlight();
  setDeepLink(null);   // drop any deep-link param (taxon/sp/obs/at)
  if (climateChart) { climateChart.destroy(); climateChart = null; }
  navClear();   // dropping the panel discards back-history
}

// ═══════════════════════════════════════════════════════════
//  SIDE PANEL — RENDER
// ═══════════════════════════════════════════════════════════

function renderPanel(taxon) {
  const pin = taxon.mapPin || {};
  const cn  = taxon.climateNormals;

  // Location string
  const locParts = [];
  if (taxon.country) locParts.push(taxon.country);
  if (pin.elevationM != null) locParts.push(pin.elevationM + 'm');
  const locStr = locParts.join(' · ');

  const coordStr = (pin.lat != null && pin.lng != null)
    ? `${pin.lat.toFixed(2)}, ${pin.lng.toFixed(2)}`
    : '';

  // Badges
  let koppenBadge = '';
  if (taxon.koppenZone) {
    const zc = KOPPEN_COLORS[taxon.koppenZone] || '#888';
    koppenBadge = `<span class="badge badge-koppen" style="color:${zc};border-color:${zc}50;background:${zc}1a">
      ${esc(taxon.koppenZone)} · ${esc(taxon.koppenLabel || KOPPEN_LABELS[taxon.koppenZone] || '')}
    </span>`;
  }

  const elev = getElevBand(taxon);
  const elevBadge = elev
    ? `<span class="badge badge-muted">${esc(elev.charAt(0).toUpperCase()+elev.slice(1))}</span>` : '';

  const habitatName = taxon.habitatId
    ? (habitatsMap[taxon.habitatId] || taxon.habitatId.replace(/_/g,' ')) : '';
  const habitatBadge = habitatName
    ? `<span class="badge badge-muted">${esc(habitatName)}</span>` : '';

  const entryBadge = `<span class="badge badge-muted">${esc(ENTRY_LABELS[taxon.entryType] || taxon.entryType)}</span>`;

  // Climate section
  let climateHtml = '';
  if (cn && (cn.tempMax || cn.tempMin) && cn.precipMm) {
    const peakHigh    = cn.tempMax ? Math.max(...cn.tempMax) : null;
    const peakLow     = cn.tempMin ? Math.min(...cn.tempMin) : null;
    const annualPrecip = Math.round(cn.precipMm.reduce((a,b)=>a+b,0));
    const meanTemp    = cn.tempMean ? cn.tempMean.reduce((a,b)=>a+b,0)/12 : null;

    climateHtml = `
      <div class="climate-grid" id="climate-grid">
        <div class="climate-stat">
          <div class="climate-stat-label">Peak High</div>
          <div class="climate-stat-value" data-celsius="${peakHigh}">${toDisplay(peakHigh, tempUnit)}</div>
        </div>
        <div class="climate-stat">
          <div class="climate-stat-label">Peak Low</div>
          <div class="climate-stat-value" data-celsius="${peakLow}">${toDisplay(peakLow, tempUnit)}</div>
        </div>
        <div class="climate-stat">
          <div class="climate-stat-label">Annual Precip</div>
          <div class="climate-stat-value">${annualPrecip}<span class="climate-stat-unit">mm</span></div>
        </div>
        ${meanTemp != null ? `<div class="climate-stat">
          <div class="climate-stat-label">Mean Temp</div>
          <div class="climate-stat-value" data-celsius="${meanTemp}">${toDisplay(meanTemp, tempUnit)}</div>
        </div>` : ''}
      </div>
      <button class="expand-btn" id="expand-btn">↓ Monthly Climate Data</button>
      <div id="climate-expanded">
        <div class="section-divider"></div>
        <div class="chart-wrap"><canvas id="climate-chart"></canvas></div>
        ${buildClimateTable(cn)}
      </div>`;
  } else {
    climateHtml = `<div class="climate-pending">Climate data not yet recorded for this taxon</div>`;
  }

  document.getElementById('panel-content').innerHTML = `
    <div class="p-species-name">${esc(taxon.displayName)}</div>
    ${taxon.commonName ? `<div class="p-common-name">${esc(taxon.commonName)}</div>` : ''}
    ${locStr ? `<div class="p-location">${esc(locStr)}</div>` : ''}
    ${coordStr ? `<div class="p-location" style="margin-top:-8px;opacity:0.55">${coordStr}</div>` : ''}

    <div class="badge-row">${koppenBadge}${elevBadge}${habitatBadge}${entryBadge}</div>

    ${taxon.nativeRange ? `
      <div class="section-label">Native Range</div>
      <div class="description-text">${esc(taxon.nativeRange)}</div>` : ''}

    ${taxon.nativeHabitat ? `
      <div class="section-label">Habitat</div>
      <div class="description-text">${esc(taxon.nativeHabitat)}</div>` : ''}

    <div class="section-divider"></div>
    <div class="section-label">Climate</div>
    ${climateHtml}

    <a class="gallery-link" href="${GALLERY_BASE}${esc(taxon.slug)}" target="_blank">
      View in Bogman Gallery →
    </a>
  `;

  // Wire expand button
  const expandBtn = document.getElementById('expand-btn');
  if (expandBtn && cn) {
    expandBtn.addEventListener('click', () => {
      const expanded = document.getElementById('climate-expanded');
      const opening  = expanded.classList.toggle('open');
      expandBtn.textContent = opening ? '↑ Hide Climate Data' : '↓ Monthly Climate Data';
      if (opening && !climateChart) buildClimateChart(cn);
    });
  }
}

// The "Extreme High/Low" stat boxes = peak/trough of the monthly extreme band:
// the hottest month's p90 daily high and the coldest month's p10 daily low.
// Defined here so the boxes, the chart band, and the table's Annual row all
// use one source and never disagree.
function extremeBoxVals(cn) {
  const hi = (cn.tempMaxHi || []).filter(v => v != null);
  const lo = (cn.tempMinLo || []).filter(v => v != null);
  return {
    extHigh: hi.length ? Math.max(...hi) : null,
    extLow:  lo.length ? Math.min(...lo) : null,
  };
}

// Collapsible "how these numbers are calculated" block, shared by the
// observation-detail and clicked-location climate panels (both use the same
// live NASA POWER computation).
function climateMethodologyHtml() {
  return `<details class="climate-method">
    <summary>How these numbers are calculated</summary>
    <div class="climate-method-body">
      <p><strong>Source:</strong> NASA POWER (MERRA-2 reanalysis), daily max/min 2&nbsp;m air temperature, 2014–2023 (10&nbsp;years). Daily values are grouped by calendar month.</p>
      <ul>
        <li><strong>High / Low</strong> (each month) — the <em>average</em> of that month's daily highs / lows.</li>
        <li><strong>Ext High / Ext Low</strong> (each month) — the <em>p90</em> of daily highs and <em>p10</em> of daily lows (a hot/cold day that month, beaten by ~10% of days).</li>
        <li><strong>Avg High / Avg Low</strong> boxes — the hottest month's average high and the coldest month's average low.</li>
        <li><strong>Extreme High / Extreme Low</strong> boxes — the hottest month's p90 high and the coldest month's p10 low (the peak/trough of the dashed band on the chart, so box and chart always agree).</li>
      </ul>
      <p><strong>Elevation correction:</strong> NASA's grid sits at a smoothed model elevation. Temperatures are shifted to the actual ground elevation using a <em>humidity-aware lapse rate</em> — dry air cools faster with height (~9.8&nbsp;°C/km), humid air slower (~4–6&nbsp;°C/km), so each month's rate is blended by its relative humidity (typically ~5.5–8&nbsp;°C/km). This is a physically-based estimate; it can't capture local inversions or cold-air pooling.</p>
      <p><strong>Obscured sightings:</strong> the exact location is hidden by iNaturalist within a ~22&nbsp;km box, so the elevation (and therefore temperature) is given as a range across that box.</p>
    </div>
  </details>`;
}

// Species-sidebar explainer. The species envelope is built by aggregating per
// 0.5° grid cell (one climate sample per cell) across everywhere the species is
// observed, so most numbers have two levels: a statistic within each cell's
// daily data, then a statistic across cells.
function speciesMethodologyHtml(entry) {
  const n = entry?.sample_count;
  return `<details class="climate-method">
    <summary>How these numbers are calculated</summary>
    <div class="climate-method-body">
      <p><strong>Source:</strong> NASA POWER (MERRA-2), 2019–2023. The species' observations are grouped into 0.5° (~55&nbsp;km) grid cells${n ? ` (${n.toLocaleString()} occupied cells here)` : ''}; one climate sample is taken per cell and elevation-corrected with the same humidity-aware lapse rate used elsewhere.</p>
      <p>Within each cell: <em>avg high/low</em> = hottest/coldest month's mean daily high/low; <em>hot/cold extreme</em> = hottest month's p90 daily high and coldest month's p10 daily low. Then across the species' cells:</p>
      <ul>
        <li><strong>Avg High / Avg Low</strong> — the <em>mean</em> across cells (a typical site in the range).</li>
        <li><strong>Typical Hot / Cold Extreme</strong> — the <em>mean</em> across cells of each cell's hot/cold extreme.</li>
        <li><strong>Heat Limit / Cold Limit</strong> — the <em>p90 / p10 across cells</em> of those extremes: the hot/cold edge of the range. (p90/p10 rather than the absolute max/min so a single bad cell can't define the limit, while genuine extremes are still kept.)</li>
      </ul>
      <p><strong>Chart:</strong> the shaded band is the p25–p75 spread of monthly averages <em>across sites</em> (how conditions vary place to place); the dashed lines are the daily hot/cold extremes (median across sites). <strong>Elevation range</strong> is the 10th–90th percentile of occupied-cell elevations.</p>
    </div>
  </details>`;
}

function buildClimateTable(cn) {
  const hasMean    = !!(cn.tempMean && cn.tempMean.length);
  const hasExtHi   = !!(cn.tempMaxHi && cn.tempMaxHi.some(v => v != null));
  const hasExtLo   = !!(cn.tempMinLo && cn.tempMinLo.some(v => v != null));
  const hasRH      = !!(cn.rhMean && cn.rhMean.some(v => v != null));

  const rows = MONTHS.map((m, i) => {
    const hi    = cn.tempMax   ? cn.tempMax[i]   : null;
    const lo    = cn.tempMin   ? cn.tempMin[i]   : null;
    const exHi  = hasExtHi     ? cn.tempMaxHi[i] : null;
    const exLo  = hasExtLo     ? cn.tempMinLo[i] : null;
    const mean  = hasMean      ? cn.tempMean[i]  : null;
    const rhAvg = hasRH        ? cn.rhMean[i]    : null;
    const prec  = cn.precipMm  ? cn.precipMm[i]  : null;
    return `<tr>
      <td>${m}</td>
      <td data-celsius="${hi}">${toDisplay(hi, tempUnit)}</td>
      ${hasExtHi ? `<td data-celsius="${exHi}">${toDisplay(exHi, tempUnit)}</td>` : ''}
      <td data-celsius="${lo}">${toDisplay(lo, tempUnit)}</td>
      ${hasExtLo ? `<td data-celsius="${exLo}">${toDisplay(exLo, tempUnit)}</td>` : ''}
      ${hasMean ? `<td data-celsius="${mean}">${toDisplay(mean, tempUnit)}</td>` : ''}
      ${hasRH   ? `<td>${rhAvg != null ? Math.round(rhAvg) + '%' : '—'}</td>` : ''}
      <td>${prec != null ? Math.round(prec)+'mm' : '—'}</td>
    </tr>`;
  }).join('');

  const annHi   = cn.tempMax  ? Math.max(...cn.tempMax)              : null;
  const annLo   = cn.tempMin  ? Math.min(...cn.tempMin)              : null;
  // Annual extreme = peak/trough of the monthly extreme band: the hottest
  // month's p90 daily high and the coldest month's p10 daily low. This is the
  // same value shown in the "Extreme High/Low" stat boxes, so they always agree.
  const annExHi = hasExtHi ? Math.max(...cn.tempMaxHi.filter(v => v != null)) : null;
  const annExLo = hasExtLo ? Math.min(...cn.tempMinLo.filter(v => v != null)) : null;
  const annPrec = cn.precipMm ? Math.round(cn.precipMm.reduce((a,b)=>a+b,0)) : null;
  const validRH = hasRH ? cn.rhMean.filter(v => v != null) : [];
  const annRH   = validRH.length ? validRH.reduce((a,b)=>a+b,0) / validRH.length : null;

  return `<table class="climate-table">
    <thead><tr>
      <th>Month</th>
      <th>High</th>
      ${hasExtHi ? '<th title="Typical monthly heat extreme (p90 of daily highs)">Ext High</th>' : ''}
      <th>Low</th>
      ${hasExtLo ? '<th title="Typical monthly cold extreme (p10 of daily lows)">Ext Low</th>' : ''}
      ${hasMean ? '<th>Mean</th>' : ''}
      ${hasRH   ? '<th title="Mean relative humidity">RH Avg</th>' : ''}
      <th>Precip</th>
    </tr></thead>
    <tbody>
      ${rows}
      <tr class="annual-row">
        <td>Annual</td>
        <td data-celsius="${annHi}">${toDisplay(annHi, tempUnit)}</td>
        ${hasExtHi ? `<td data-celsius="${annExHi}">${annExHi != null ? toDisplay(annExHi, tempUnit) : '—'}</td>` : ''}
        <td data-celsius="${annLo}">${toDisplay(annLo, tempUnit)}</td>
        ${hasExtLo ? `<td data-celsius="${annExLo}">${annExLo != null ? toDisplay(annExLo, tempUnit) : '—'}</td>` : ''}
        ${hasMean ? '<td>—</td>' : ''}
        ${hasRH   ? `<td>${annRH != null ? Math.round(annRH) + '%' : '—'}</td>` : ''}
        <td>${annPrec != null ? annPrec+'mm' : '—'}</td>
      </tr>
    </tbody>
  </table>`;
}

            fill: false,
            tension: 0.4,

function buildLightTable(cn) {
  const hasPPFD = cn.ppfd && cn.ppfd.some(v => v != null);

  // RH Avg used to live here, but it's been moved to buildClimateTable so that
  // temperature / precipitation / humidity all live in one table. This table
  // now strictly covers light & atmosphere (daylight, DLI, PPFD).
  const rows = MONTHS.map((mon, i) => {
    const dl   = cn.daylightHrs?.[i];
    const dli  = cn.dli?.[i];
    const ppfd = cn.ppfd?.[i];
    return `<tr>
      <td>${mon}</td>
      <td>${dl  != null ? dl.toFixed(1) + 'h' : '—'}</td>

  return `<div style="overflow-x:auto;margin-bottom:16px">
    <table class="climate-table">
      <thead><tr>
        <th>Month</th>

        <th title="Daily Light Integral (mol photons/m²/day)">DLI</th>
        ${hasPPFD ? '<th title="Avg PPFD during daylight (μmol/m²/s)">PPFD</th>' : ''}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function setTempUnit(unit) {
  tempUnit = unit;
  localStorage.setItem('bmg_temp_unit', unit);
  document.getElementById('unit-f').classList.toggle('active', unit === 'F');
  document.getElementById('unit-c').classList.toggle('active', unit === 'C');

  // Update all visible temperature values
  document.querySelectorAll('[data-celsius]').forEach(el => {
    const c = parseFloat(el.dataset.celsius);
    if (!isNaN(c)) el.textContent = toDisplay(c, unit);
  });
  // Temperature ranges (obscured-cell boxes): data-celsius-range="loC,hiC"
  document.querySelectorAll('[data-celsius-range]').forEach(el => {
    const [lo, hi] = el.dataset.celsiusRange.split(',').map(parseFloat);
    if (!isNaN(lo) && !isNaN(hi)) el.textContent = toDisplayRange(lo, hi, unit);
  });

  // Rebuild chart with new unit
  if (climateChart && selectedId) {
    const entry = markerStore.get(selectedId);
    if (entry?.taxon?.climateNormals) buildClimateChart(entry.taxon.climateNormals);
  } else if (climateChart && searchPanelOpen && searchState?.normals) {
    buildClimateChart(searchState.normals);
  }
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function nominatimZoom(result) {
  const rank = parseInt(result.place_rank) || 20;
  if (rank <= 4)  return 4;
  if (rank <= 8)  return 5;
  if (rank <= 12) return 7;
  if (rank <= 16) return 9;
  if (rank <= 22) return 11;
  return 13;
}

async function fetchNominatim(query) {
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=5&addressdetails=1`;
  try {
    const r = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    return r.ok ? r.json() : [];
  } catch { return []; }
}

// Astronomical monthly average daylight hours from latitude (no API call needed).
// Computed for the 15th of each month using standard solar declination formula.
// Returns 12 monthly values. Handles polar day (24) and polar night (0).
function computeMonthlyDaylightHours(lat) {
  const monthMidDoys = [15, 46, 75, 106, 136, 167, 197, 228, 259, 289, 320, 350];
  const latRad = lat * Math.PI / 180;
  return monthMidDoys.map(doy => {
    const decl  = 23.45 * Math.sin(2 * Math.PI * (284 + doy) / 365) * Math.PI / 180;
    const arg   = -Math.tan(latRad) * Math.tan(decl);
    if (arg >=  1) return 0;     // polar night
    if (arg <= -1) return 24;    // polar day
    return 24 / Math.PI * Math.acos(arg);
  });
}

async function fetchSearchClimateNormals(lat, lng) {
  // 10-year window: smaller payload than 30yr, still statistically solid for normals.
  // Switched from Open-Meteo to NASA POWER (MERRA-2) in 2026-05 after Open-Meteo's
  // 10k/day per-IP cap caused live queries to fail from throttled residential IPs.
  // POWER has no documented per-IP cap and returns temp + precip + RH + radiation
  // in a single request.
  const url = `https://power.larc.nasa.gov/api/temporal/daily/point` +
    `?parameters=T2M_MAX,T2M_MIN,PRECTOTCORR,RH2M,ALLSKY_SFC_SW_DWN` +
    `&community=AG&latitude=${lat.toFixed(4)}&longitude=${lng.toFixed(4)}` +
    `&start=20140101&end=20231231&format=JSON`;
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    const d = await r.json();
    const params = d?.properties?.parameter;
    if (!params || !params.T2M_MAX) return null;

    const FILL    = -999;
    const isValid = v => v != null && v !== FILL && isFinite(v);

    // Per-month buckets of DAILY values (not just sums). We need the full
    // distribution to compute extreme percentiles (p10 of daily mins, p90 of
    // daily maxes) for the "typical cold snap / heat wave" display. Means
    // are computed from these buckets at the end so we don't double-iterate.
    const tmaxByMonth = Array.from({ length: 12 }, () => []);
    const tminByMonth = Array.from({ length: 12 }, () => []);
    const yearlyMin   = {};   // year → minimum daily temp (for USDA zone)
    // Precip/RH/radiation only need monthly sums + counts.
    const precSum = new Array(12).fill(0);
    const precYrs = Array.from({ length: 12 }, () => new Set());
    const rhSum   = new Array(12).fill(0), rhCnt   = new Array(12).fill(0);
    const radSum  = new Array(12).fill(0), radCnt  = new Array(12).fill(0);

    for (const dateKey of Object.keys(params.T2M_MAX)) {
      const m = parseInt(dateKey.substring(4, 6), 10) - 1;   // YYYYMMDD → month
      const y = dateKey.substring(0, 4);

      const tmax = params.T2M_MAX[dateKey];
      if (isValid(tmax)) tmaxByMonth[m].push(tmax);
      const tmin = params.T2M_MIN[dateKey];
      if (isValid(tmin)) {
        tminByMonth[m].push(tmin);
        if (yearlyMin[y] == null || tmin < yearlyMin[y]) yearlyMin[y] = tmin;
      }
      const p = params.PRECTOTCORR?.[dateKey];
      if (isValid(p))    { precSum[m] += p;    precYrs[m].add(y); }
      const rh = params.RH2M?.[dateKey];
      if (isValid(rh))   { rhSum[m]   += rh;   rhCnt[m]++; }
      const rad = params.ALLSKY_SFC_SW_DWN?.[dateKey];
      if (isValid(rad))  { radSum[m]  += rad;  radCnt[m]++; }
    }

    // Inline percentile helper (used several times below). Linear-interpolated
    // percentile on a sorted array. p in 0–100.
    const percentile = (arr, p) => {
      if (!arr.length) return null;
      const s = [...arr].sort((a, b) => a - b);
      const i = (p / 100) * (s.length - 1);
      const lo = Math.floor(i), hi = Math.ceil(i);
      return lo === hi ? s[lo] : s[lo] + (s[hi] - s[lo]) * (i - lo);
    };

    // Monthly averages of daily highs/lows (the existing visualisation lines)
    const tempMax = tmaxByMonth.map(arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null);
    const tempMin = tminByMonth.map(arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null);
    // Monthly extreme bands: p90 of daily highs (typical hot extreme that
    // month), p10 of daily lows (typical cold extreme that month). These
    // shade the band on the chart.
    const tempMaxHi = tmaxByMonth.map(arr => percentile(arr, 90));
    const tempMinLo = tminByMonth.map(arr => percentile(arr,  10));

    // Annual extreme stats (computed across ALL daily values in the window)
    const allTmaxs = tmaxByMonth.flat();
    const allTmins = tminByMonth.flat();
    const typicalHottestDay = percentile(allTmaxs, 95);   // 95th percentile of daily highs
    const typicalColdestDay = percentile(allTmins,  5);   // 5th percentile of daily lows
    // Days below freezing per year (averaged over the years in the dataset)
    const years = Object.keys(yearlyMin).length || 1;
    const daysBelowFreezing = Math.round(allTmins.filter(v => v < 0).length / years);
    // USDA hardiness zone computed from average annual min (mean of yearly
    // coldest daily temps).
    const yearlyMins = Object.values(yearlyMin);
    const avgAnnualMin = yearlyMins.length
      ? yearlyMins.reduce((a, b) => a + b, 0) / yearlyMins.length
      : null;
    const usdaZone = avgAnnualMin != null ? toUSDAZone(avgAnnualMin) : null;

    // Astronomical daylight hours per month (no API needed — POWER doesn't return this).
    const daylightHrs = computeMonthlyDaylightHours(lat);
    // Monthly avg shortwave radiation MJ/m²/day (same units as Open-Meteo's
    // shortwave_radiation_sum, so DLI/PPFD conversion factors carry over unchanged).
    const radiation = radSum.map((s, m) => radCnt[m] ? s / radCnt[m] : null);
    // DLI mol/m²/day = radiation × 2.02 (PAR fraction × photon conversion)
    const dli = radiation.map(r => r != null ? r * 2.02 : null);
    // Avg PPFD μmol/m²/s = (radiation MJ/m² × 1e6 J) / daylight_seconds × 2.02
    const ppfd = radiation.map((r, m) => {
      const dlSec = daylightHrs[m] != null ? daylightHrs[m] * 3600 : null;
      return (r != null && dlSec) ? (r * 1e6 / dlSec) * 2.02 : null;
    });

    return {
      // POWER returns [lng, lat, elev_m] — modelElev is the MERRA-2 grid elevation,
      // used for lapse-rate correction against terrain elevation.
      modelElev:  d.geometry?.coordinates?.[2] ?? null,
      tempMax,
      tempMin,
      tempMaxHi,        // NEW: p90 of daily highs per month (typical heat-wave high)
      tempMinLo,        // NEW: p10 of daily lows per month (typical cold-snap low)
      precipMm:   precSum.map((s, m) => precYrs[m].size ? s / precYrs[m].size : null),
      daylightHrs, dli, ppfd,
      // POWER /daily returns only daily-mean RH (no diurnal max/min). The old
      // Open-Meteo hourly path used to compute rhHigh/rhLow; those fields have
      // been removed since no UI surfaces them anymore.
      rhMean:     rhSum.map((s, m) => rhCnt[m] ? s / rhCnt[m] : null),
      // Annual extreme summary stats (computed across all daily values in the 10-yr window)
      typicalHottestDay,        // 95th percentile of all daily highs
      typicalColdestDay,        // 5th  percentile of all daily lows
      daysBelowFreezing,        // average # of frost days per year
      avgAnnualMin,             // mean of yearly coldest temps (drives USDA zone)
      usdaZone,                 // string like "7a" or null
    };
  } catch { return null; }
}

// ── USDA hardiness zone ──────────────────────────────────────────────
// Map average annual minimum temperature (°C) to USDA zone code (e.g. "7a").
// Each zone is 5°F wide, with 'a' and 'b' subzones 2.5°F apart. Table from
// USDA Agricultural Research Service (2023 update).
const USDA_ZONES = [
  { min: -Infinity, max: -51.1, code: '1a' },
  { min: -51.1,     max: -48.3, code: '1b' },
  { min: -48.3,     max: -45.6, code: '2a' },
  { min: -45.6,     max: -42.8, code: '2b' },
  { min: -42.8,     max: -40.0, code: '3a' },
  { min: -40.0,     max: -37.2, code: '3b' },
  { min: -37.2,     max: -34.4, code: '4a' },
  { min: -34.4,     max: -31.7, code: '4b' },
  { min: -31.7,     max: -28.9, code: '5a' },
  { min: -28.9,     max: -26.1, code: '5b' },
  { min: -26.1,     max: -23.3, code: '6a' },
  { min: -23.3,     max: -20.6, code: '6b' },
  { min: -20.6,     max: -17.8, code: '7a' },
  { min: -17.8,     max: -15.0, code: '7b' },
  { min: -15.0,     max: -12.2, code: '8a' },
  { min: -12.2,     max: -9.4,  code: '8b' },
  { min:  -9.4,     max: -6.7,  code: '9a' },
  { min:  -6.7,     max: -3.9,  code: '9b' },
  { min:  -3.9,     max: -1.1,  code: '10a' },
  { min:  -1.1,     max:  1.7,  code: '10b' },
  { min:   1.7,     max:  4.4,  code: '11a' },
  { min:   4.4,     max:  7.2,  code: '11b' },
  { min:   7.2,     max: 10.0,  code: '12a' },
  { min:  10.0,     max: 12.8,  code: '12b' },
  { min:  12.8,     max: 15.6,  code: '13a' },
  { min:  15.6,     max: Infinity, code: '13b' },
];
function toUSDAZone(avgAnnualMinC) {
  const z = USDA_ZONES.find(z => avgAnnualMinC >= z.min && avgAnnualMinC < z.max);
  return z?.code || null;
}

async function _retired_fetchRHNormals_oldOpenMeteo(lat, lng) {
  // Retained as reference. The old hourly Open-Meteo path computed rhHigh / rhLow
  // from per-day max/min of hourly relative_humidity_2m values. Replaced because
  // (a) Open-Meteo throttles aggressively at 10k/day per IP and (b) downstream
  // species rendering only ever read rhMean.
  const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat.toFixed(4)}&longitude=${lng.toFixed(4)}&start_date=2019-01-01&end_date=2023-12-31&hourly=relative_humidity_2m&timezone=UTC`;
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    const d = await r.json();
    const raw = d.hourly;
    if (!raw || !raw.time) return null;

    // Roll up hourly → daily stats
    const daily = {}; // "YYYY-MM-DD" → {max, min, sum, cnt}
    raw.time.forEach((dt, i) => {
      const date = dt.substring(0, 10);
      const v = raw.relative_humidity_2m[i];
      if (v == null) return;
      if (!daily[date]) daily[date] = { max: -Infinity, min: Infinity, sum: 0, cnt: 0 };
      const s = daily[date];
      if (v > s.max) s.max = v;
      if (v < s.min) s.min = v;
      s.sum += v; s.cnt++;
    });

    // Roll up daily → monthly averages of high/mean/low
    const hiSum  = new Array(12).fill(0), hiCnt  = new Array(12).fill(0);
    const loSum  = new Array(12).fill(0), loCnt  = new Array(12).fill(0);
    const avgSum = new Array(12).fill(0), avgCnt = new Array(12).fill(0);
    Object.entries(daily).forEach(([date, s]) => {
      const m = parseInt(date.substring(5, 7)) - 1;
      if (s.max > -Infinity) { hiSum[m]  += s.max;         hiCnt[m]++; }
      if (s.min <  Infinity) { loSum[m]  += s.min;         loCnt[m]++; }
      if (s.cnt > 0)         { avgSum[m] += s.sum / s.cnt; avgCnt[m]++; }
    });

    return {
      rhHigh: hiSum.map((s, m)  => hiCnt[m]  ? s / hiCnt[m]  : null),
      rhLow:  loSum.map((s, m)  => loCnt[m]  ? s / loCnt[m]  : null),
      rhMean: avgSum.map((s, m) => avgCnt[m] ? s / avgCnt[m] : null)
    };
  } catch { return null; }
}

async function fetchTerrainElevation(lat, lng) {
  // Open-Meteo Elevation (Copernicus GLO-90, ~90 m) — CORS-enabled & keyless.
  // (OpenTopoData, used by the Node pipeline, can't be called from the browser
  // because it sends no CORS headers.)
  const r = await fetchElevationBatch([[lat, lng]]);
  return (r && r[0] != null) ? r[0] : null;
}

// ── Humidity/temperature-aware lapse rate ────────────────────────────
// Returns the local lapse rate in °C per km for the given monthly mean
// temperature, relative humidity, and elevation. Instead of a flat 6.5°C/km,
// we blend the dry adiabatic rate (~9.77°C/km, dry air cools fast) toward the
// moist adiabatic rate (~4–6°C/km, latent-heat release slows cooling in humid
// air) by relative humidity. So a humid summer bog gets a shallow rate and a
// dry/cold month gets a steep one — the seasonal/spatial variation a flat
// constant ignores. This is a physically-motivated proxy for the environmental
// lapse rate, not a measured value (it can't see inversions or cold-air
// pooling), but it uses only data we already have (T from T2M_MAX/MIN, RH from
// RH2M) and brackets the 6.5 standard at moderate conditions.
function lapseRateCkm(tempC, rhPct, elevM) {
  const g = 9.81, cpd = 1004.6, Hv = 2.501e6, Rsd = 287.05, eps = 0.622;
  const T = tempC + 273.15;
  // Surface pressure from elevation (barometric formula), hPa
  const P  = 1013.25 * Math.pow(1 - 2.25577e-5 * (elevM || 0), 5.25588);
  // Saturation vapour pressure (Tetens), hPa → saturation mixing ratio, kg/kg
  const es = 6.112 * Math.exp(17.67 * tempC / (tempC + 243.5));
  const rs = eps * es / Math.max(P - es, 1e-3);
  // Moist (saturated) adiabatic lapse rate, K/m → K/km
  const gMoist = g * (1 + Hv * rs / (Rsd * T)) /
                 (cpd + Hv * Hv * rs * eps / (Rsd * T * T)) * 1000;
  const gDry = g / cpd * 1000;   // ≈ 9.77 °C/km
  const rh = Math.max(0, Math.min(100, rhPct == null ? 55 : rhPct));
  const gamma = gDry - (gDry - gMoist) * (rh / 100);
  return Math.max(4.0, Math.min(9.8, gamma));
}

// Apply a per-month, humidity-aware lapse correction to every temperature
// field, moving from the climate model's grid elevation to a target elevation.
// Each month uses its own mean T and RH to pick the rate.
function applyHumidityLapse(normals, targetElevM) {
  const modelElev = normals.modelElev;
  if (targetElevM == null || modelElev == null) return normals;
  const dzKm = (targetElevM - modelElev) / 1000;
  const out = { ...normals };
  for (const f of ['tempMax', 'tempMin', 'tempMaxHi', 'tempMinLo']) {
    if (!Array.isArray(normals[f])) continue;
    out[f] = normals[f].map((v, m) => {
      if (v == null) return null;
      const meanT = (normals.tempMax?.[m] != null && normals.tempMin?.[m] != null)
        ? (normals.tempMax[m] + normals.tempMin[m]) / 2 : v;
      const rate = lapseRateCkm(meanT, normals.rhMean?.[m], modelElev);
      return Math.round((v - rate * dzKm) * 10) / 10;
    });
  }
  return out;
}

// Mean monthly lapse rate (°C/km) for a set of normals — used for the obscured
// cell's "temperatures may vary by ~X°C" caveat.
function meanLapseRate(normals, elevM) {
  const rates = [];
  for (let m = 0; m < 12; m++) {
    const hi = normals.tempMax?.[m], lo = normals.tempMin?.[m];
    if (hi == null || lo == null) continue;
    rates.push(lapseRateCkm((hi + lo) / 2, normals.rhMean?.[m], elevM));
  }
  return rates.length ? rates.reduce((a, b) => a + b, 0) / rates.length : 6.5;
}

// Backwards-compatible wrapper: exact-point elevation correction (used by the
// search/click path). Delegates to the humidity-aware per-month correction.
function applyLapseRateCorrection(normals, terrainElev) {
  return applyHumidityLapse(normals, terrainElev);
}

// ── Batch elevation + obscured-cell elevation range ──────────────────
// Open-Meteo Elevation API (Copernicus GLO-90, ~90 m): CORS-enabled and
// keyless, up to 100 coordinates per request. We use it instead of OpenTopoData
// because OpenTopoData's public API doesn't send CORS headers, so it can't be
// called from the browser (the Node data pipeline still uses OpenTopoData).
async function fetchElevationBatch(points) {
  if (!points.length) return [];
  const lats = points.map(p => p[0].toFixed(5)).join(',');
  const lngs = points.map(p => p[1].toFixed(5)).join(',');
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lats}&longitude=${lngs}`);
    if (!r.ok) return null;
    const d = await r.json();
    return Array.isArray(d.elevation) ? d.elevation.map(v => (v != null && isFinite(v)) ? v : null) : null;
  } catch { return null; }
}

// Adaptive 2-pass min/max/median elevation across an obscured 0.2° cell.
// Pass 1: a coarse 9×9 grid (~2.4 km). Pass 2: a fine 5×5 grid (~0.5 km) around
// the coarse min and max points. Cached per cell (in-memory + sessionStorage).
const _cellElevCache = new Map();
async function sampleCellElevationRange(swLat, swLng, sizeDeg = 0.2) {
  const key = `${swLat.toFixed(4)},${swLng.toFixed(4)}`;
  if (_cellElevCache.has(key)) return _cellElevCache.get(key);
  try {
    const ss = sessionStorage.getItem('bmg_cellelev_' + key);
    if (ss) { const v = JSON.parse(ss); _cellElevCache.set(key, v); return v; }
  } catch {}

  const N = 9, coarse = [];
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++)
    coarse.push([swLat + (i + 0.5) / N * sizeDeg, swLng + (j + 0.5) / N * sizeDeg]);
  const e1 = await fetchElevationBatch(coarse);
  if (!e1) return null;

  const all = [];
  let minPt = null, maxPt = null, minV = Infinity, maxV = -Infinity;
  e1.forEach((e, idx) => {
    if (e == null) return;
    all.push(e);
    if (e < minV) { minV = e; minPt = coarse[idx]; }
    if (e > maxV) { maxV = e; maxPt = coarse[idx]; }
  });

  // Pass 2: refine ±1 coarse-cell around min and max points.
  const step = sizeDeg / N, M = 5;
  const refine = (ctr) => {
    const pts = [];
    for (let i = 0; i < M; i++) for (let j = 0; j < M; j++)
      pts.push([ctr[0] - step + (i / (M - 1)) * 2 * step,
                ctr[1] - step + (j / (M - 1)) * 2 * step]);
    return pts;
  };
  let refinePts = [];
  if (minPt) refinePts = refinePts.concat(refine(minPt));
  if (maxPt) refinePts = refinePts.concat(refine(maxPt));
  if (refinePts.length) {
    const e2 = await fetchElevationBatch(refinePts);
    if (e2) e2.forEach(e => { if (e != null) all.push(e); });
  }

  if (!all.length) return null;
  all.sort((a, b) => a - b);
  const res = {
    min:    Math.round(all[0]),
    max:    Math.round(all[all.length - 1]),
    median: Math.round(all[Math.floor(all.length / 2)]),
  };
  _cellElevCache.set(key, res);
  try { sessionStorage.setItem('bmg_cellelev_' + key, JSON.stringify(res)); } catch {}
  return res;
}

// ─── Climate-match feature ─────────────────────────────────────────────
// "Find species that grow in a similar native climate to this location."
// Given the user's location normals and Köppen zone, score every species in
// inatSpeciesData against the user's climate using:
//   - Cold survival (critical): user's coldest-month mean min vs species'
//     annual-min p10 (the cold extreme of the species' observed range).
//     Strict mode: PASS if user >= p10; MARGINAL within 2°C; FAIL otherwise.
//   - Heat tolerance (important): user's hottest-month mean max vs species'
//     annual-max p90 (high tail). PASS if user <= p90 + 5°C; MARGINAL otherwise.
//   - Köppen overlap (bonus): if user's Köppen zone is ≥5% of the species'
//     occupied cells, treat as a strong "this just grows here" signal.
//   - Envelope distance (ranking): |user_cold - species_p50| + |user_hot -
//     species_p50|, normalized by 10°C.
//
// Tier assignment:
//   excellent  — passes cold AND heat AND (Köppen match OR low distance)
//   possible   — passes cold AND heat
//   marginal   — marginal on cold OR heat
//   unsuitable — fails cold (won't survive winter)
//
// Hemisphere is irrelevant for annual stats (coldest/hottest seasonal extreme
// is the same idea regardless of which calendar months they fall in).
function matchSpeciesToLocation(userNormals, userKoppen) {
  if (!inatSpeciesData) return [];
  const userTmin = userNormals.tempMin?.filter(v => v != null) || [];
  const userTmax = userNormals.tempMax?.filter(v => v != null) || [];
  if (!userTmin.length || !userTmax.length) return [];
  const userColdMonth = Math.min(...userTmin);
  const userHotMonth  = Math.max(...userTmax);

  const results = [];
  for (const [taxonIdStr, species] of Object.entries(inatSpeciesData)) {
    const stats = species.stats;
    if (!stats?.tempMin || !stats?.tempMax) continue;
    const spColdP10 = stats.tempMin.p10;
    const spColdP50 = stats.tempMin.p50;
    const spHotP90  = stats.tempMax.p90;
    const spHotP50  = stats.tempMax.p50;
    if (spColdP10 == null || spHotP90 == null) continue;

    // Cold survival check (strict: p10 of cold extreme + 2°C tolerance band)
    let coldTier;
    if      (userColdMonth >= spColdP10)        coldTier = 'pass';
    else if (userColdMonth >= spColdP10 - 2)    coldTier = 'marginal';
    else                                         coldTier = 'fail';

    // Heat tolerance check (5°C buffer above p90)
    const heatTier = userHotMonth <= spHotP90 + 5 ? 'pass' : 'marginal';

    // Köppen overlap
    const koppenList  = species.koppen || [];
    const koppenTotal = koppenList.reduce((s, [, c]) => s + c, 0);
    const found       = userKoppen ? koppenList.find(([z]) => z === userKoppen) : null;
    const userKoppenPct = (found && koppenTotal) ? found[1] / koppenTotal : 0;
    const koppenMatch   = userKoppenPct >= 0.05;

    // Envelope distance (lower = better — used to rank within tiers)
    const score = Math.abs(userColdMonth - spColdP50) / 10
                + Math.abs(userHotMonth  - spHotP50)  / 10;

    let tier;
    if      (coldTier === 'fail')                                   tier = 'unsuitable';
    else if (coldTier === 'marginal' || heatTier === 'marginal')    tier = 'marginal';
    else if (koppenMatch || score < 1.0)                            tier = 'excellent';
    else                                                             tier = 'possible';

    // Concise reason (1-2 chips per card)
    const reasonParts = [];
    if (coldTier === 'fail') {
      reasonParts.push(`Too cold for outdoors: native limit ${spColdP10.toFixed(0)}°C, you reach ${userColdMonth.toFixed(0)}°C`);
    } else if (coldTier === 'marginal') {
      reasonParts.push(`Cold-marginal: provide winter protection`);
    }
    if (heatTier === 'marginal') {
      reasonParts.push(`Heat-marginal: summer ${userHotMonth.toFixed(0)}°C exceeds ${spHotP90.toFixed(0)}°C native`);
    }
    if (koppenMatch && coldTier !== 'fail') {
      reasonParts.push(`Same climate zone (${Math.round(userKoppenPct * 100)}% of native range)`);
    }
    if (!reasonParts.length && tier === 'excellent') {
      reasonParts.push(`Climate matches native range (${spColdP50.toFixed(0)}–${spHotP50.toFixed(0)}°C typical)`);
    } else if (!reasonParts.length && tier === 'possible') {
      reasonParts.push(`Within climate envelope; not the typical range`);
    }

    results.push({
      taxonId: +taxonIdStr,
      species,
      tier,
      score,
      reasonParts,
    });
  }

  const tierOrder = { excellent: 0, possible: 1, marginal: 2, unsuitable: 3 };
  results.sort((a, b) => (tierOrder[a.tier] - tierOrder[b.tier]) || (a.score - b.score));
  return results;
}

// Render the match results in the side panel. Replaces the location panel
// content. Includes a back button to return to the location view, and each
// species card opens its own sidebar on click.
function renderSpeciesMatchPanel(state, matches) {
  const { result, lat, lng } = state;
  const locName = result._name || result.display_name.split(',')[0];

  const groups = {
    excellent:  { label: 'Excellent fit',         items: [] },
    possible:   { label: 'Possible',              items: [] },
    marginal:   { label: 'Marginal',              items: [] },
    unsuitable: { label: "Won't survive outdoors", items: [] },
  };
  for (const m of matches) groups[m.tier].items.push(m);

  const cardHtml = (m) => {
    const s = m.species;
    const photo = s.photo_url || '';
    const common = s.common_name ? esc(s.common_name) : '';
    const reason = m.reasonParts.length ? esc(m.reasonParts[0]) : '';
    return `
      <div class="match-card" data-taxon-id="${m.taxonId}" data-taxon-name="${esc(s.scientific_name)}">
        ${photo ? `<img class="match-card-photo" src="${esc(photo)}" loading="lazy" onerror="this.style.background='var(--bg-elevated)';this.src='';">` : '<div class="match-card-photo"></div>'}
        <div class="match-card-body">
          <div class="match-card-name">${esc(s.scientific_name)}</div>
          ${common ? `<div class="match-card-common">${common}</div>` : ''}
          ${reason ? `<div class="match-card-reason">${reason}</div>` : ''}
        </div>
      </div>`;
  };

  // Group items by genus within each tier; render genus subgroups
  // collapsible so long lists are easy to scan.
  const genusSubgroupHtml = (genus, items) => `
    <details class="match-genus-group" open>
      <summary>
        <span class="match-genus-name">${esc(genus)}</span>
        <span class="match-genus-count">${items.length}</span>
      </summary>
      <div class="match-card-list">${items.map(cardHtml).join('')}</div>
    </details>`;

  const groupHtml = (key, group, isOpen) => {
    if (!group.items.length) return '';
    // Bucket by genus (preserve within-genus score ordering — items are
    // already sorted by score from matchSpeciesToLocation)
    const byGenus = new Map();
    for (const it of group.items) {
      const g = it.species.genus || 'Unknown';
      if (!byGenus.has(g)) byGenus.set(g, []);
      byGenus.get(g).push(it);
    }
    // Sort genera alphabetically
    const sortedGenera = [...byGenus.keys()].sort();
    const subgroups = sortedGenera.map(g => genusSubgroupHtml(g, byGenus.get(g))).join('');
    return `
      <details class="match-tier-group match-tier-${key}"${isOpen ? ' open' : ''}>
        <summary>
          <span class="match-tier-dot"></span>
          <span>${group.label}</span>
          <span class="match-tier-count">${group.items.length}</span>
        </summary>
        <div class="match-genus-list">${subgroups}</div>
      </details>`;
  };

  document.getElementById('panel-content').innerHTML = `
    ${navBackBtnHtml()}
    <div class="match-panel-header">
      <div class="p-species-name">Species matched to ${esc(locName)}</div>
      <div class="match-panel-subtitle">
        ${matches.length} species ranked by climate suitability for year-round outdoor cultivation.
        Cold-tolerance is the critical filter — heat is secondary.
      </div>
    </div>
    <div class="match-dormancy-note">
      Temperate species may require winter dormancy, which can be provided artificially
      (e.g. refrigeration) without directly matching the native climate.
    </div>
    ${groupHtml('excellent',  groups.excellent,  true)}
    ${groupHtml('possible',   groups.possible,   true)}
    ${groupHtml('marginal',   groups.marginal,   false)}
    ${groupHtml('unsuitable', groups.unsuitable, false)}
  `;

  // Wire interactions
  wireNavBackBtn();
  document.querySelectorAll('.match-card').forEach(card => {
    card.addEventListener('click', () => {
      const tid  = +card.dataset.taxonId;
      const name = card.dataset.taxonName;
      if (!tid || !name) return;
      // Push the match panel as the back target so the species sidebar
      // gets a "← Climate matches" back button.
      navPush({
        label:   'Climate matches',
        restore: () => renderSpeciesMatchPanel(state, matches),
      });
      openSpeciesSidebar(tid, name);
    });
  });
}

// Button click handler. Loads species data if needed, runs matching, renders.
// Pushes the location panel onto the nav stack so the match results show a
// "← {locName}" back button that returns to the climate display.
async function runSpeciesMatch(state) {
  const panel = document.getElementById('panel-content');
  if (!panel) return;
  const locLabel = state.result?._name || state.result?.display_name?.split(',')[0] || 'Location';
  navPush({
    label:   locLabel,
    restore: () => buildLocationPanel(state),
  });
  // Loading state
  panel.innerHTML = `
    <div class="climate-pending" style="margin-top:18px">Loading species data and matching to your climate…</div>
  `;
  const data = await loadSpeciesData();
  if (!data) {
    panel.innerHTML = `<div class="climate-pending" style="margin-top:18px">Species climate data not available. Run the monthly data refresh workflow to generate it.</div>`;
    return;
  }
  const userKoppen = getKoppenAt(state.lat, state.lng);
  const matches    = matchSpeciesToLocation(state.normals, userKoppen);
  renderSpeciesMatchPanel(state, matches);
}

function buildLocationPanel(state) {
  const { result, lat, lng, normals, loading, elevInfo } = state;
  const name = result._name || result.display_name.split(',')[0];
  const a = result.address || {};
  const subLabel = [a.state, a.country].filter(Boolean).join(', ');

  const v = getKoppenAt(lat, lng);
  let koppenBadgeHtml = '';
  if (v >= 1 && v <= 30) {
    const zone = BECK_ZONES[v];
    const [cr, cg, cb] = BECK_COLORS[v];
    koppenBadgeHtml = `<div class="badge-row"><span class="badge badge-koppen" style="color:rgb(${cr},${cg},${cb});border-color:rgba(${cr},${cg},${cb},0.3);background:rgba(${cr},${cg},${cb},0.1)">${esc(zone.code)} · ${esc(zone.desc)}</span></div>`;
  }

  // Destroy any stale charts before re-rendering panel content
  if (climateChart) { climateChart.destroy(); climateChart = null; }
  if (lightChart)   { lightChart.destroy();   lightChart   = null; }

  let climateHtml;
  if (loading) {
    climateHtml = `<div class="climate-pending">Loading climate data…</div>`;
  } else if (normals && normals.tempMax && normals.tempMin && normals.precipMm) {
    const validMax = normals.tempMax.filter(x => x != null);
    const validMin = normals.tempMin.filter(x => x != null);
    const peakHigh = validMax.length ? Math.max(...validMax) : null;
    const peakLow  = validMin.length ? Math.min(...validMin) : null;
    const annPrec  = Math.round(normals.precipMm.reduce((a, b) => a + (b || 0), 0));

    const validRH = normals.rhMean ? normals.rhMean.filter(v => v != null) : [];
    const annRHAvg = validRH.length ? validRH.reduce((a, b) => a + b, 0) / validRH.length : null;

    // USDA hardiness zone only shown for US locations — outside the US the
    // zoning system has different meaning / different names in use.
    const inUS = (a.country_code || '').toLowerCase() === 'us';
    const { extHigh: hotEx, extLow: coldEx } = extremeBoxVals(normals);
    const freezeDays = normals.daysBelowFreezing;

    climateHtml = `
      <div class="climate-grid">
        <div class="climate-stat" title="Hottest month's average daily high">
          <div class="climate-stat-label">Avg High</div>
          <div class="climate-stat-value" data-celsius="${peakHigh}">${toDisplay(peakHigh, tempUnit)}</div></div>
        <div class="climate-stat" title="Coldest month's average daily low">
          <div class="climate-stat-label">Avg Low</div>
          <div class="climate-stat-value" data-celsius="${peakLow}">${toDisplay(peakLow, tempUnit)}</div></div>
        ${hotEx != null ? `<div class="climate-stat" title="Hottest month's p90 daily high — a hot day in the warmest part of the year (exceeded ~10% of that month's days)">
          <div class="climate-stat-label">Extreme High</div>
          <div class="climate-stat-value" data-celsius="${hotEx}">${toDisplay(hotEx, tempUnit)}</div></div>` : ''}
        ${coldEx != null ? `<div class="climate-stat" title="Coldest month's p10 daily low — a cold day in the coldest part of the year (below this ~10% of that month's days)">
          <div class="climate-stat-label">Extreme Low</div>
          <div class="climate-stat-value" data-celsius="${coldEx}">${toDisplay(coldEx, tempUnit)}</div></div>` : ''}
        ${freezeDays != null ? `<div class="climate-stat" title="Average number of days per year with daily minimum below 0°C">
          <div class="climate-stat-label">Freeze Days/yr</div>
          <div class="climate-stat-value">${freezeDays}</div></div>` : ''}
        ${inUS && normals.usdaZone ? `<div class="climate-stat" title="USDA Plant Hardiness Zone based on mean annual minimum (${toDisplay(normals.avgAnnualMin, tempUnit)})">
          <div class="climate-stat-label">USDA Zone</div>
          <div class="climate-stat-value">${normals.usdaZone}</div></div>` : ''}
        <div class="climate-stat"><div class="climate-stat-label">Annual Precip</div>
          <div class="climate-stat-value">${annPrec}<span class="climate-stat-unit">mm</span></div></div>
        ${annRHAvg != null ? `<div class="climate-stat"><div class="climate-stat-label">Avg RH</div>
          <div class="climate-stat-value">${Math.round(annRHAvg)}<span class="climate-stat-unit">%</span></div></div>` : ''}
        ${elevInfo ? `<div class="climate-stat"><div class="climate-stat-label">Elevation</div>
          <div class="climate-stat-value">${elevInfo.terrainElev.toLocaleString()}<span class="climate-stat-unit">m</span></div></div>` : ''}
      </div>
      ${elevInfo ? (() => {
        const diff    = elevInfo.elevDiff;
        const diffAbs = Math.abs(diff);
        const dir     = diff > 0 ? 'higher' : 'lower';
        const sign    = diff > 0 ? '−' : '+';  // higher → cooler → negative adjustment
        const adj     = Math.abs(elevInfo.tempDelta).toFixed(1);
        return `<div class="sp-chart-note">Climate-model grid elevation: ${elevInfo.modelElev.toLocaleString()} m. ` +
               `This location is ${diffAbs.toLocaleString()} m ${dir} (${elevInfo.terrainElev.toLocaleString()} m), ` +
               `so temperatures are adjusted ~${sign}${adj}°C using a humidity-aware lapse rate ` +
               `(~${elevInfo.lapseRate}°C/1000 m here, applied per month).</div>`;
      })() : ''}
      <button class="expand-btn" id="expand-btn">↓ Monthly Climate Data</button>
      <div id="climate-expanded">
        <div class="section-divider"></div>
        <div class="section-label">Temperature &amp; Precipitation</div>
        <div class="chart-wrap"><canvas id="climate-chart"></canvas></div>
        ${buildClimateTable(normals)}
        ${normals.daylightHrs ? `
          <div class="section-divider"></div>
          <div class="section-label">Light &amp; Atmosphere</div>
          <div class="chart-wrap"><canvas id="light-chart"></canvas></div>
          ${buildLightTable(normals)}
        ` : ''}
        ${climateMethodologyHtml()}
      </div>`;
  } else {
    climateHtml = `<div class="climate-pending">Climate data unavailable for this location</div>`;
  }

  // "Find matching species" is only meaningful once climate is loaded — we
  // need normals to run the algorithm. Hidden during loading; shown when
  // both climate normals and a valid location are available.
  const findSpeciesBtnHtml = (!loading && normals && normals.tempMax && normals.tempMin)
    ? `<button class="find-species-btn" id="find-species-btn" title="Find Calochortus species that grow in a similar climate to this location">
         <span class="find-species-icon">${BMG_ICONS.leaf}</span>
         Find species suited to this climate
       </button>`
    : '';

  document.getElementById('panel-content').innerHTML = `
    <div class="p-species-name">${esc(name)}</div>
    ${subLabel ? `<div class="p-common-name">${esc(subLabel)}</div>` : ''}
    <div class="p-location">${lat.toFixed(4)}, ${lng.toFixed(4)}</div>
    ${copyLinkBtnHtml('at', `${lat.toFixed(4)},${lng.toFixed(4)},${Math.round(map.getZoom())}`, 'loc-copy-link')}
    ${koppenBadgeHtml}
    <div class="section-divider"></div>
    <div class="section-label">Climate (2014–2023 avg)</div>
    ${climateHtml}
    ${findSpeciesBtnHtml}
  `;

  document.getElementById('side-panel').classList.add('open');
  wireCopyLinkButtons(document.getElementById('panel-content'));
  if (!loading) setDeepLink('at', `${lat.toFixed(4)},${lng.toFixed(4)},${Math.round(map.getZoom())}`);

  // Wire the climate-match button (only present when climate has loaded)
  document.getElementById('find-species-btn')?.addEventListener('click', () => runSpeciesMatch(state));


  const expandBtn = document.getElementById('expand-btn');
  if (expandBtn && normals && !loading) {
    expandBtn.addEventListener('click', () => {
      const expanded = document.getElementById('climate-expanded');
      const opening = expanded.classList.toggle('open');
      expandBtn.textContent = opening ? '↑ Hide Climate Data' : '↓ Monthly Climate Data';
      if (opening && !climateChart) buildClimateChart(normals);
      if (opening && !lightChart && normals.daylightHrs) buildLightChart(normals);
    });
  }
}

window.openClimateAt = async function(lat, lng) {
  map.closePopup();

  if (selectedId) {
    if (markerStore.has(selectedId)) {
      const { marker, taxon } = markerStore.get(selectedId);
      marker.setIcon(makeIcon(taxon, false));
    }
    selectedId = null;
    clearRegionHighlight();
    setUrlParam('taxon', null);
    if (climateChart) { climateChart.destroy(); climateChart = null; }
  }
  if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }

  // Clear search bar since this is a raw map click, not a search result
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').classList.remove('visible');
  document.getElementById('search-suggestions').classList.remove('open');
  searchCurrentSuggestions = [];

  searchMarker = L.circleMarker([lat, lng], {
    radius: 8, color: '#ffffff', fillColor: '#3fb950', weight: 2, fillOpacity: 0.9
  }).addTo(map);
  searchMarker.on('click', e => { L.DomEvent.stopPropagation(e); });

  const coordName = `${Math.abs(lat).toFixed(4)}° ${lat >= 0 ? 'N' : 'S'}, ${Math.abs(lng).toFixed(4)}° ${lng >= 0 ? 'E' : 'W'}`;
  const token = {};
  const fakeResult = { _name: coordName, display_name: coordName, lat: String(lat), lon: String(lng), place_rank: 30, address: {} };

  navClear();   // fresh location — drop any back-history from a prior view
  searchState = { result: fakeResult, lat, lng, normals: null, loading: true, token };
  searchPanelOpen = true;
  buildLocationPanel(searchState);

  const [geocode, normals, rh, terrainElev] = await Promise.all([
    fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat.toFixed(4)}&lon=${lng.toFixed(4)}&format=json`, { headers: { 'Accept-Language': 'en' } })
      .then(r => r.ok ? r.json() : null).catch(() => null),
    fetchSearchClimateNormals(lat, lng),
    fetchRHNormals(lat, lng),
    fetchTerrainElevation(lat, lng)
  ]);

  if (!searchPanelOpen || !searchState || searchState.token !== token) return;

  if (geocode && geocode.display_name) {
    searchState.result = {
      _name: geocode.display_name.split(',')[0],
      display_name: geocode.display_name,
      lat: String(lat), lon: String(lng),
      place_rank: 30,
      address: geocode.address || {}
    };
  }

  let mergedNormals = normals ? { ...normals, ...(rh || {}) } : null;
  let elevInfo = null;
  if (mergedNormals && terrainElev != null && mergedNormals.modelElev != null) {
    const modelElev = mergedNormals.modelElev;
    const elevDiff  = terrainElev - modelElev;
    // Humidity/temperature-aware mean lapse rate for the explanatory note
    // (the actual correction applied below is per-month, not this average).
    const rate      = meanLapseRate(mergedNormals, modelElev);
    const tempDelta = (rate / 1000) * elevDiff;  // °C subtracted from raw temps
    mergedNormals   = applyHumidityLapse(mergedNormals, terrainElev);
    elevInfo = {
      terrainElev: Math.round(terrainElev),
      modelElev:   Math.round(modelElev),
      elevDiff:    Math.round(elevDiff),
      lapseRate:   Math.round(rate * 10) / 10,
      tempDelta:   Math.round(tempDelta * 10) / 10,
    };
  }

  searchState.normals  = mergedNormals;
  searchState.elevInfo = elevInfo;
  searchState.loading  = false;
  buildLocationPanel(searchState);
};

let searchCurrentSuggestions = [];
let searchHighlightedIdx = -1;

function renderSuggestions(results) {
  searchCurrentSuggestions = results;
  searchHighlightedIdx = -1;
  const el = document.getElementById('search-suggestions');
  if (!results.length) { el.classList.remove('open'); return; }

  const taxa   = results.filter(r => r._type === 'inat-taxon');
  const locs   = results.filter(r => r._type !== 'inat-taxon');
  const showSep = taxa.length > 0 && locs.length > 0;

  const taxaHtml = taxa.map((r, _) => {
    const i = results.indexOf(r);
    const dot   = `<span class="search-suggestion-genus-dot" style="background:${INAT_GENUS_COLORS[r.genus] || '#aaa'}"></span>`;
    const count = r.count > 0 ? `<span style="color:var(--text-muted);font-size:11px;font-style:normal">${r.count.toLocaleString()} sightings</span>` : '';
    const sub   = [r.commonName, r.genus].filter(Boolean);
    return `<div class="search-suggestion" data-idx="${i}">
      <div class="search-suggestion-taxon-row">${dot}<div class="search-suggestion-taxon-name">${esc(r.taxonName)}</div>${count}</div>
      ${sub.length ? `<div class="search-suggestion-sub">${esc(sub.join(' · '))}</div>` : ''}
    </div>`;
  }).join('');

  const locsHtml = locs.map(r => {
    const i = results.indexOf(r);
    const name = r.display_name.split(',')[0];
    const a = r.address || {};
    const sub = [a.state, a.country].filter(Boolean).join(', ') || (r.type || '').replace(/_/g, ' ');
    const region = isAdminRegionResult(r)
      ? `<span style="color:var(--accent);font-size:10px;font-style:normal;margin-left:6px">▦ filter region</span>` : '';
    return `<div class="search-suggestion" data-idx="${i}">
      <div class="search-suggestion-name">${esc(name)}${region}</div>
      ${sub ? `<div class="search-suggestion-sub">${esc(sub)}</div>` : ''}
    </div>`;
  }).join('');

  el.innerHTML =
    (taxa.length ? `<div class="search-suggestion-sep">Species</div>${taxaHtml}` : '') +
    (showSep     ? `<div class="search-suggestion-sep">Locations</div>` : '') +
    locsHtml;

  el.classList.add('open');
}

// Nominatim "class"/"type" combos that represent an administrative area we can
// filter observations within (state, province, county, country, island, etc.).
function isAdminRegionResult(r) {
  if (r._type === 'inat-taxon') return false;
  if (r.class === 'boundary' && r.type === 'administrative') return true;
  if (r.class === 'place' && ['state','region','province','county','island','archipelago','country'].includes(r.type)) return true;
  return false;
}

function selectSearchResult(result) {
  if (result._type === 'inat-taxon') { selectInatTaxon(result); return; }
  if (isAdminRegionResult(result)) { selectRegionResult(result); return; }
  // Clear any active species filter when a location is chosen
  if (inatSpeciesFilter) { inatSpeciesFilter = null; rebuildInatIndex(); }
  // A plain place pick clears any active region filter.
  if (inatRegionFilter) clearRegionFilter(false);
  const lat = parseFloat(result.lat);
  const lng = parseFloat(result.lon);
  const zoom = nominatimZoom(result);
  const name = result.display_name.split(',')[0];

  document.getElementById('search-input').value = name;
  document.getElementById('search-clear').classList.add('visible');
  document.getElementById('search-suggestions').classList.remove('open');
  searchCurrentSuggestions = [];

  // Close taxon panel if open
  if (selectedId) {
    if (markerStore.has(selectedId)) {
      const { marker, taxon } = markerStore.get(selectedId);
      marker.setIcon(makeIcon(taxon, false));
    }
    selectedId = null;
    clearRegionHighlight();
    setUrlParam('taxon', null);
    if (climateChart) { climateChart.destroy(); climateChart = null; }
  }

  if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }

  map.flyTo([lat, lng], zoom, { duration: 1.0 });

  searchMarker = L.circleMarker([lat, lng], {
    radius: 8, color: '#ffffff', fillColor: '#3fb950',
    weight: 2, fillOpacity: 0.9
  }).addTo(map);
  searchMarker.on('click', e => { L.DomEvent.stopPropagation(e); });

  navClear();   // fresh location search — drop any back-history from a prior view
  searchState = { result, lat, lng, normals: null, loading: true };
  searchPanelOpen = true;
  buildLocationPanel(searchState);

  Promise.all([fetchSearchClimateNormals(lat, lng), fetchRHNormals(lat, lng)])
    .then(([normals, rh]) => {
      if (!searchPanelOpen || !searchState || searchState.result !== result) return;
      searchState.normals = normals ? { ...normals, ...(rh || {}) } : null;
      searchState.loading = false;
      buildLocationPanel(searchState);
    });
}

function searchInatTaxa(q) {
  if (!inatTaxa.length) return [];
  const ql = q.toLowerCase();

  // Lazy taxon count map
  if (!searchInatTaxa._counts) {
    const counts = new Map();
    for (const o of inatObs) counts.set(o[OBS_TI], (counts.get(o[OBS_TI]) || 0) + 1);
    searchInatTaxa._counts = counts;
  }
  const counts = searchInatTaxa._counts;

  const seen = new Set();
  const top = [], rest = [];

  for (let ti = 0; ti < inatTaxa.length; ti++) {
    const [taxonId, taxonName, genus, commonName] = inatTaxa[ti];
    if (seen.has(taxonName)) continue;
    const sciL  = taxonName.toLowerCase();
    const comL  = (commonName || '').toLowerCase();
    const matchSci = sciL.includes(ql);
    const matchCom = comL.includes(ql);
    if (!matchSci && !matchCom) continue;
    seen.add(taxonName);
    const entry = { _type: 'inat-taxon', taxonId, taxonName, genus, commonName, count: counts.get(ti) || 0 };
    (sciL.startsWith(ql) || comL.startsWith(ql) ? top : rest).push(entry);
    if (top.length + rest.length >= 12) break;
  }

  return [...top, ...rest].slice(0, 7);
}

function loadSpeciesData() {
  if (!inatSpeciesDataPromise) {
    inatSpeciesDataPromise = fetch('./inat/species-data.json')
      .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
      .then(d => { inatSpeciesData = d.species; return d.species; })
      .catch(err => {
        console.error('Failed to load species-data.json:', err);
        inatSpeciesDataPromise = null; // allow retry
        return null;
      });
  }
  return inatSpeciesDataPromise;
}
