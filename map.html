};

const INAT_KOPPEN_GROUPS = [
  { group: 'A', label: 'Tropical',   zones: [{v:1,c:'Af'},{v:2,c:'Am'},{v:3,c:'Aw'}] },
  { group: 'B', label: 'Arid',       zones: [{v:4,c:'BWh'},{v:5,c:'BWk'},{v:6,c:'BSh'},{v:7,c:'BSk'}] },
  { group: 'C', label: 'Temperate',  zones: [{v:8,c:'Csa'},{v:9,c:'Csb'},{v:10,c:'Csc'},{v:11,c:'Cwa'},{v:12,c:'Cwb'},{v:13,c:'Cwc'},{v:14,c:'Cfa'},{v:15,c:'Cfb'},{v:16,c:'Cfc'}] },
  { group: 'D', label: 'Cold',       zones: [{v:17,c:'Dsa'},{v:18,c:'Dsb'},{v:19,c:'Dsc'},{v:20,c:'Dsd'},{v:21,c:'Dwa'},{v:22,c:'Dwb'},{v:23,c:'Dwc'},{v:24,c:'Dwd'},{v:25,c:'Dfa'},{v:26,c:'Dfb'},{v:27,c:'Dfc'},{v:28,c:'Dfd'}] },
  { group: 'E', label: 'Polar',      zones: [{v:29,c:'ET'},{v:30,c:'EF'}] },
];

const INAT_PHOTO_BASE = 'https://inaturalist-open-data.s3.amazonaws.com/photos/';
const INAT_OBS_URL    = 'https://www.inaturalist.org/observations/';
const INAT_API_OBS    = 'https://api.inaturalist.org/v1/observations/';

// We only store the numeric photo_id in the obs data (to keep it compact), but
// iNat photos vary by extension (.jpg/.jpeg/.png) AND host (open-data S3 vs
// static.inaturalist.org). A single hardcoded URL only resolves the subset that
// happen to match — so we build a candidate list and fall through on error.
// Order is by observed frequency: open-data .jpg is by far the most common.
const INAT_PHOTO_HOSTS = [
  'https://inaturalist-open-data.s3.amazonaws.com/photos/',
  'https://static.inaturalist.org/photos/',
];
const INAT_PHOTO_EXTS = ['jpg', 'jpeg', 'png'];
function inatPhotoCandidates(photoId, size = 'square') {
  const urls = [];
  for (const ext of INAT_PHOTO_EXTS)
    for (const host of INAT_PHOTO_HOSTS)
      urls.push(`${host}${photoId}/${size}.${ext}`);
  return urls;
}
// Build an <img> that walks the candidate URLs on error, then hides if none work.
// The candidate list is JSON-encoded into a data attribute; a single delegated
// 'error' listener (added once) advances to the next candidate.
function inatThumbImg(photoId, cls, size = 'square', extraAttrs = '') {
  const cands = inatPhotoCandidates(photoId, size);
  return `<img class="${cls}" src="${cands[0]}" loading="lazy" ` +
         `data-fallbacks='${JSON.stringify(cands.slice(1))}' ${extraAttrs}>`;
}
// One global handler advances any iNat thumb to its next candidate URL.
// Capture phase so it catches <img> error events (which don't bubble).
document.addEventListener('error', e => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.dataset.fallbacks) return;
  let list;
  try { list = JSON.parse(img.dataset.fallbacks); } catch { list = []; }
  if (list.length) {
    img.src = list.shift();
    img.dataset.fallbacks = JSON.stringify(list);
  } else {
    img.dataset.fallbacks = '';
    img.style.display = 'none';   // exhausted — hide gracefully
  }
}, true);

// ── iNat state ────────────────────────────────────────────

let inatVisible       = false;
let inatWorker        = null;
let inatWorkerReady   = false;
let inatLoadedGenera  = new Set();  // which genus files are loaded
let inatAllLoaded     = false;      // whether all.json is loaded
let inatTaxa          = [];         // merged taxa lookup [[id,name,genus,common],...]
let inatObs           = [];         // merged obs arrays [[id,lat,lng,ti,date,flags,photoId,koppen],...]
let inatSpeciesFilter  = null;       // taxon_name string when a species is selected via search
let inatRegionFilter   = null;       // { name, bbox:[s,n,w,e], rings:[[[lng,lat],...],...], osmRef } admin-region filter
let inatDetailGen      = 0;          // incremented each time an obs panel opens; stale fetches are discarded
let inatSpeciesDataPromise = null;   // singleton fetch promise for species-data.json
let inatSpeciesData        = null;   // species data keyed by taxon_id (number)
let inatSpeciesSidebarId   = null;   // taxon_id currently shown in species sidebar
let speciesHemi            = 'nh';   // 'nh' | 'sh' for the species monthly chart
// When true, the displayed monthly data is rotated by +6 months ("Hemisphere
// Swap"): it views the data on the opposite hemisphere's seasonal calendar.
// Always defaults OFF and is NOT persisted — it must be manually re-applied per
// species, so a stale swap can never silently misrepresent a species' seasons.
let speciesShiftSH         = false;
// Cache of per-species tropical classification (median |lat| < 23.5°). Computed
// lazily from inatObs on first lookup; ~344k obs is one linear scan per species
// (~10ms) and the result is stable for the session.
const speciesTropicalCache = new Map();
let speciesClimateChart    = null;   // Chart.js instance for species sidebar chart
let speciesPhenoChart      = null;   // Chart.js instance for the phenology histogram
let speciesPhenoMetric     = 'flowering';  // 'flowering' | 'budding' | 'fruiting'
let inatClusterGroup  = null;       // L.layerGroup
let inatRectGroup     = null;       // L.layerGroup for obscured rectangles

// Navigation state
let inatNav = {
  mode:             null,   // 'species-sidebar'|'species-list'|'obs-list'|'obs-detail'
  clusterLeaves:    null,   // all leaves in current cluster
  clusterLatlng:    null,
  speciesName:      null,   // currently drilled species within a cluster
  obsFeature:       null,   // currently viewed obs
  speciesTaxonId:   null,   // taxonId of species filter sidebar (for back nav)
  speciesTaxonName: null,
};

const inatFilters = {
  // All genera selected by default on every device. Observations are the map's
  // primary utility, so we show them on load (mobile included — heavier, but
  // intentional; perf to be evaluated on-device).
  genera:  new Set(INAT_GENERA),
  needsId: false,
  koppen:  new Set(Array.from({ length: 30 }, (_, i) => i + 1)),
  // Date Observed filter. The day window (dayStart/dayEnd as 'MM-DD') is what
  // activates the filter; the year range narrows which years count (or allYears
  // ignores it). Setting a day window + allYears is the cross-year "bloom
  // window" comparison: every observation in that calendar window, all years.
  dayStart: null, dayEnd: null,   // 'MM-DD' strings, or null = no day filter
  yearStart: null, yearEnd: null, // integers, or null
  allYears: false,
};

// True if an observation's date passes the Date-Observed filter. The day window
// wraps across year-end when dayStart > dayEnd (e.g. Dec 20 → Jan 5). Undated
// observations are excluded once a window is set.
function obsPassesDate(o) {
  const ds = inatFilters.dayStart, de = inatFilters.dayEnd;
  if (!ds || !de) return true;                 // no day window → filter inactive
  const date = o[OBS_DATE];
  if (!date || date.length < 10) return false;
  const md = date.slice(5);                     // 'MM-DD'
  const inWindow = ds <= de ? (md >= ds && md <= de) : (md >= ds || md <= de);
  if (!inWindow) return false;
  if (!inatFilters.allYears) {
    const y = +date.slice(0, 4);
    if (inatFilters.yearStart && y < inatFilters.yearStart) return false;
    if (inatFilters.yearEnd   && y > inatFilters.yearEnd)   return false;
  }
  return true;
}

// ── Reverse-geocode cache for obs detail panel ────────────
// Nominatim asks for ≤1 req/sec/IP, so cache results aggressively per cell.
// In-memory Map for fast hits; sessionStorage backing so the cache survives
// re-opens within a tab session without a network hop.
const obsLocationCache = new Map();
const OBS_LOC_SS_KEY   = 'bmg_obs_loc_cache_v1';
try {
  const raw = sessionStorage.getItem(OBS_LOC_SS_KEY);
  if (raw) {
    const obj = JSON.parse(raw);
    for (const [k, v] of Object.entries(obj)) obsLocationCache.set(k, v);
  }
} catch {}

// Trailing-edge debounce: a burst of geocode resolutions (e.g. user scrolling
// through obs detail panels) only flushes once after the burst settles, which
// keeps the main thread from re-serialising the whole cache on every fetch.
let _obsLocPersistTimer = null;
function _persistObsLocCache() {
  if (_obsLocPersistTimer) return;
  _obsLocPersistTimer = setTimeout(() => {
    _obsLocPersistTimer = null;
    try {
      sessionStorage.setItem(OBS_LOC_SS_KEY,
        JSON.stringify(Object.fromEntries(obsLocationCache)));
    } catch {}
  }, 500);
}

// Build a friendly "Town, Region, Country" label from a Nominatim address obj.
// Picks the most-specific populated-place tag available, then state, then country.
function _formatObsLocation(addr) {
  if (!addr) return null;
  const local = addr.city || addr.town || addr.village || addr.hamlet
             || addr.suburb || addr.municipality || addr.county;
  const region = addr.state || addr.region || addr.province;
  return [local, region, addr.country].filter(Boolean).join(', ') || null;
}

// Returns a place-name string for (lat,lng), or null on failure.
// Coordinates are quantised to the obs cache cell (~obscured == ~0.01°, else
// ~0.001°) so nearby observations share a cache entry.
async function fetchObsLocationName(lat, lng, obscured) {
  const q   = obscured ? 2 : 3;   // decimal places for cache key
  const key = `${lat.toFixed(q)},${lng.toFixed(q)}`;
  if (obsLocationCache.has(key)) return obsLocationCache.get(key);

  try {
    const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat.toFixed(4)}&lon=${lng.toFixed(4)}&format=json&zoom=10&addressdetails=1`;
    const r = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    if (!r.ok) { obsLocationCache.set(key, null); _persistObsLocCache(); return null; }
    const data = await r.json();
    const name = _formatObsLocation(data?.address) || data?.display_name || null;
    obsLocationCache.set(key, name);
    _persistObsLocCache();
    return name;
  } catch {
    obsLocationCache.set(key, null);
    _persistObsLocCache();
    return null;
  }
}

// ── Inline worker (Supercluster runs off main thread) ─────

const INAT_WORKER_SRC = `
importScripts('https://cdn.jsdelivr.net/npm/supercluster@8.0.1/dist/supercluster.min.js');
let sc = null;
self.onmessage = function(e) {
  const { type } = e.data;
  if (type === 'load') {
    sc = new Supercluster({ radius: 120, maxZoom: 16, minPoints: 3 });
    sc.load(e.data.features);
    self.postMessage({ type: 'loaded', count: e.data.features.length });
  }
  if (type === 'getClusters') {
    const clusters = sc ? sc.getClusters(e.data.bbox, e.data.zoom) : [];
    self.postMessage({ type: 'clusters', clusters, zoom: e.data.zoom });
  }
  if (type === 'getLeaves') {
    const leaves = sc ? sc.getLeaves(e.data.clusterId, e.data.limit || Infinity, e.data.offset || 0) : [];
    self.postMessage({ type: 'leaves', leaves, clusterId: e.data.clusterId });
  }
};`;

function initInatWorker() {
  if (inatWorker) inatWorker.terminate();
  const blob = new Blob([INAT_WORKER_SRC], { type: 'application/javascript' });
  inatWorker = new Worker(URL.createObjectURL(blob));
  inatWorkerReady = false;
  inatWorker.onmessage = handleWorkerMessage;
  inatWorker.onerror   = err => console.error('iNat worker error:', err);
}

function handleWorkerMessage(e) {
  const { type } = e.data;
  if (type === 'loaded') {
    inatWorkerReady = true;
    setInatStatus('');
    renderInatClusters();
  }
  if (type === 'clusters') {
    drawInatClusters(e.data.clusters, e.data.zoom);
  }
  if (type === 'leaves') {
    const { leaves, clusterId } = e.data;
    navClear();   // fresh cluster — drop any back-history from a prior view
    inatNav.clusterLeaves = leaves;
    openSidePanelForInat();
    renderInatSpeciesList(leaves);
  }
}

// ── Data loading ──────────────────────────────────────────

function inatDataUrl(genus) {
  return genus === 'all' ? './inat/all.json' : `./inat/${genus.toLowerCase()}.json`;
}

async function loadInatAll() {
  setInatStatus('Loading observations…', true);
  try {
    const res  = await fetch(inatDataUrl('all'));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    inatTaxa     = data.taxa;
    inatObs      = data.obs;
    inatAllLoaded = true;
    INAT_GENERA.forEach(g => inatLoadedGenera.add(g));
    rebuildInatIndex();
  } catch (err) {
    console.error('Failed to load inat/all.json:', err);
    setInatStatus('Data unavailable — run the fetch script first');
  }
}

async function loadInatGenus(genus) {
  if (inatLoadedGenera.has(genus) || inatAllLoaded) return;
  setInatStatus(`Loading ${genus}…`, true);
  try {
    const res  = await fetch(inatDataUrl(genus));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    // Merge taxa — remap indices
    const offset = inatTaxa.length;
    inatTaxa.push(...data.taxa);
    for (const o of data.obs) {
      inatObs.push([o[0], o[1], o[2], o[3] + offset, o[4], o[5], o[6], o[7]]);
    }
    inatLoadedGenera.add(genus);
    setInatStatus('');
    rebuildInatIndex();
  } catch (err) {
    console.error(`Failed to load inat/${genus}.json:`, err);
    setInatStatus(`Could not load ${genus} data`);
  }
}

// ── Feature building ──────────────────────────────────────

// obs layout: [id, lat, lng, taxon_idx, date, flags, photo_id, koppen]
const OBS_ID=0, OBS_LAT=1, OBS_LNG=2, OBS_TI=3, OBS_DATE=4, OBS_FLAGS=5, OBS_PHOTO=6, OBS_KOP=7;
const F_NEEDSID=1, F_OBSCURED=2, F_PHOTO=4;

// Obscured observations are kept OUT of the cluster engine. iNaturalist snaps
// each to a ~0.2° (~22 km) grid cell, so we bucket them by cell and always draw
// one box per cell (with a count) at every zoom — no morphing circles ↔ boxes.
// Map<cellKey, { swLat, swLng, feats: [] }>. Rebuilt whenever filters change.
let inatObscuredCells = new Map();

// Ray-casting point-in-polygon. `rings` is an array of linear rings, each an
// array of [lng, lat]. A point inside an odd number of rings is "in" (handles
// multipolygons + holes well enough for an admin-boundary mask).
function pointInRings(lng, lat, rings) {
  let inside = false;
  for (const ring of rings) {
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const xi = ring[i][0], yi = ring[i][1];
      const xj = ring[j][0], yj = ring[j][1];
      if (((yi > lat) !== (yj > lat)) &&
          (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
    }
  }
  return inside;
}

// True when an obs at (lat,lng) passes the active region filter (bbox fast-path
// then precise polygon test). No filter → always true.
function passesRegionFilter(lat, lng) {
  const rf = inatRegionFilter;
  if (!rf) return true;
  const [s, n, w, e] = rf.bbox;
  if (lat < s || lat > n || lng < w || lng > e) return false;
  return rf.rings ? pointInRings(lng, lat, rf.rings) : true;
}

function buildInatFeatures() {
  const features = [];          // exact (non-obscured) points → supercluster
  inatObscuredCells = new Map();
  for (const o of inatObs) {
    const taxon  = inatTaxa[o[OBS_TI]];
    if (!taxon) continue;
    const genus  = taxon[2];
    const flags  = o[OBS_FLAGS];
    const koppen = o[OBS_KOP];
    // Filter
    if (inatSpeciesFilter ? taxon[1] !== inatSpeciesFilter : !inatFilters.genera.has(genus)) continue;
    if (inatRegionFilter && !passesRegionFilter(o[OBS_LAT], o[OBS_LNG])) continue;
    if ((flags & F_NEEDSID) && !inatFilters.needsId) continue;
    if (!inatFilters.koppen.has(koppen) && koppen !== 0) continue;
    // Köppen legend filter — AND-ed with the iNat-panel filters above.
    // Empty selectedKoppenCodes set = no filter.
    if (selectedKoppenCodes.size > 0 && !selectedKoppenCodes.has(koppen)) continue;
    if (!obsPassesDate(o)) continue;
    const feat = {
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [o[OBS_LNG], o[OBS_LAT]] },
      properties: {
        obs_id:      o[OBS_ID],
        lat:         o[OBS_LAT],
        lng:         o[OBS_LNG],
        taxon_idx:   o[OBS_TI],
        date:        o[OBS_DATE],
        flags,
        photo_id:    o[OBS_PHOTO],
        koppen,
        genus,
        taxon_name:  taxon[1],
        common_name: taxon[3],
      }
    };
    if (flags & F_OBSCURED) {
      const swLat = Math.floor(o[OBS_LAT] / 0.2) * 0.2;
      const swLng = Math.floor(o[OBS_LNG] / 0.2) * 0.2;
      const key   = `${swLat.toFixed(4)},${swLng.toFixed(4)}`;
      let cell = inatObscuredCells.get(key);
      if (!cell) { cell = { swLat, swLng, feats: [] }; inatObscuredCells.set(key, cell); }
      cell.feats.push(feat);
    } else {
      features.push(feat);
    }
  }
  return features;
}

function rebuildInatIndex() {
  if (!inatWorker) return;
  setInatStatus('Indexing…', true);
  const features = buildInatFeatures();   // also rebuilds inatObscuredCells
  inatWorker.postMessage({ type: 'load', features });
  drawObscuredBoxes();                     // obscured layer is client-side, redraw now
  let obscured = 0;
  inatObscuredCells.forEach(c => { obscured += c.feats.length; });
  updateDateCount(features.length + obscured);
}

// Show how many observations match while a day window is active (feedback for
// the cross-year bloom-window comparison). Hidden when no day window is set.
function updateDateCount(n) {
  const el = document.getElementById('inat-date-count');
  if (!el) return;
  const active = inatFilters.dayStart && inatFilters.dayEnd;
  el.textContent = active ? `${n.toLocaleString()} observation${n === 1 ? '' : 's'} match` : '';
}

// ── Rendering ─────────────────────────────────────────────

function renderInatClusters() {
  if (!inatWorkerReady || !inatVisible) return;
  const bounds = map.getBounds();
  const bbox   = [bounds.getWest(), bounds.getSouth(), bounds.getEast(), bounds.getNorth()];
  const zoom   = Math.floor(map.getZoom());
  inatWorker.postMessage({ type: 'getClusters', bbox, zoom });
  drawObscuredBoxes();   // obscured layer is client-side, independent of the worker
}

// Exact (non-obscured) observations only — obscured ones are drawn as boxes by
// drawObscuredBoxes(), so this only ever sees precise points + clusters.
function drawInatClusters(clusters, zoom) {
  inatClusterGroup.clearLayers();

  for (const f of clusters) {
    const props = f.properties;

    if (props.cluster) {
      // ── Cluster circle ──────────────────────────────
      const count = props.point_count;
      const size  = Math.max(28, Math.min(60, 20 + Math.log2(count) * 7));
      const hue   = Math.max(0, 120 - count / 50);  // green → orange → red
      const icon  = L.divIcon({
        className: '',
        html: `<div class="inat-cluster-icon" style="width:${size}px;height:${size}px;background:hsl(${hue},70%,40%);font-size:${size < 36 ? 10 : 12}px">${count > 999 ? Math.round(count/1000)+'k' : count}</div>`,
        iconSize: [size, size],
        iconAnchor: [size/2, size/2],
      });
      const marker = L.marker([f.geometry.coordinates[1], f.geometry.coordinates[0]], { icon, zIndexOffset: 50 });
      marker.on('click', e => {
        L.DomEvent.stopPropagation(e);
        inatNav.clusterLatlng = e.latlng;
        inatWorker.postMessage({ type: 'getLeaves', clusterId: props.cluster_id });
      });
      inatClusterGroup.addLayer(marker);

    } else {
      // ── Individual (exact) observation ───────────────
      const { lat, lng, genus } = props;
      const color  = INAT_GENUS_COLORS[genus] || '#aaa';
      const marker = L.circleMarker([lat, lng], {
        radius:      5,
        color:       '#fff',
        fillColor:   color,
        weight:      1.5,
        fillOpacity: 0.85,
        opacity:     0.9,
        interactive: true,
      });
      marker.on('click', e => { L.DomEvent.stopPropagation(e); openInatObsPanel(f); });
      inatClusterGroup.addLayer(marker);
    }
  }
}

// ── Obscured observations: always 0.2° boxes with a count, never clusters ───
const OBSC_MIN_ZOOM   = 4;    // below this the boxes are sub-pixel noise → hide
const OBSC_LABEL_ZOOM = 6;    // show the count badge at/above this zoom
const OBSC_MAX_BOXES  = 600;  // perf cap on boxes drawn at once (densest first)

function openObscuredCell(cell) {
  if (cell.feats.length === 1) { openInatObsPanel(cell.feats[0]); return; }
  // Same flow as expanding a cluster: list the species in this cell.
  navClear();
  inatNav.clusterLatlng = L.latLng(cell.swLat + 0.1, cell.swLng + 0.1);
  inatNav.clusterLeaves = cell.feats;
  openSidePanelForInat();
  renderInatSpeciesList(cell.feats);
}

function drawObscuredBoxes() {
  if (!inatRectGroup) return;
  inatRectGroup.clearLayers();
  if (!inatVisible || !inatObscuredCells.size) return;
  const z = map.getZoom();
  if (z < OBSC_MIN_ZOOM) return;

  const b = map.getBounds();
  const inView = [];
  inatObscuredCells.forEach(cell => {
    if (cell.swLat + 0.2 < b.getSouth() || cell.swLat > b.getNorth()) return;
    if (cell.swLng + 0.2 < b.getWest()  || cell.swLng > b.getEast())  return;
    inView.push(cell);
  });
  // Densest cells first so the cap keeps the most significant boxes.
  inView.sort((a, c) => c.feats.length - a.feats.length);
  const showLabel = z >= OBSC_LABEL_ZOOM;

  for (const cell of inView.slice(0, OBSC_MAX_BOXES)) {
    const color = INAT_GENUS_COLORS[cell.feats[0].properties.genus] || '#aaa';
    const rect  = L.rectangle([[cell.swLat, cell.swLng], [cell.swLat + 0.2, cell.swLng + 0.2]], {
      className:   'inat-obscured-rect',
      color,
      fillColor:   color,
      fillOpacity: 0.10,
      weight:      1.5,
      dashArray:   '5,4',
      interactive: true,
    });
    const onClick = e => { L.DomEvent.stopPropagation(e); openObscuredCell(cell); };
    rect.on('click', onClick);
    if (!showLabel) {
      rect.bindTooltip(`${cell.feats.length} obscured sighting${cell.feats.length > 1 ? 's' : ''}`, { direction: 'top', sticky: true });
    }
    inatRectGroup.addLayer(rect);

    if (showLabel) {
      const badge = L.marker([cell.swLat + 0.1, cell.swLng + 0.1], {
        icon: L.divIcon({
          className: '',
          html: `<div class="inat-obsc-badge" title="${cell.feats.length} obscured sighting${cell.feats.length > 1 ? 's' : ''} — approximate location">${cell.feats.length}</div>`,
          iconSize: [22, 16], iconAnchor: [11, 8],
        }),
        zIndexOffset: 40, interactive: true,
      });
      badge.on('click', onClick);
      inatRectGroup.addLayer(badge);
    }
  }
}

// ── Side panel — species list ─────────────────────────────

function openSidePanelForInat() {
  // Close species panel if open, preserve search panel logic
  if (selectedId) {
    if (markerStore.has(selectedId)) {
      const { marker, taxon } = markerStore.get(selectedId);
      marker.setIcon(makeIcon(taxon, false));
    }
    selectedId = null;
    clearRegionHighlight();
    setUrlParam('taxon', null);
    if (climateChart) { climateChart.destroy(); climateChart = null; }
    if (lightChart)   { lightChart.destroy();   lightChart   = null; }
  }
  if (searchPanelOpen) {
    searchPanelOpen = false;
    searchState = null;
    if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }
  }
  document.getElementById('side-panel').classList.add('open');
}

function renderInatSpeciesList(leaves) {
  inatNav.mode = 'species-list';
  if (speciesClimateChart) { speciesClimateChart.destroy(); speciesClimateChart = null; }
  if (speciesPhenoChart)   { speciesPhenoChart.destroy();   speciesPhenoChart   = null; }
  openSidePanelForInat();

  // Count by taxon name
  const counts = {};
  for (const lf of leaves) {
    const name = lf.properties.taxon_name || 'Unknown';
    counts[name] = (counts[name] || 0) + 1;
  }
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

  const coord = inatNav.clusterLatlng
    ? `${Math.abs(inatNav.clusterLatlng.lat).toFixed(2)}°${inatNav.clusterLatlng.lat>=0?'N':'S'}, ${Math.abs(inatNav.clusterLatlng.lng).toFixed(2)}°${inatNav.clusterLatlng.lng>=0?'E':'W'}`
    : '';

  const rows = sorted.map(([name, cnt]) => {
    const sample = leaves.find(lf => lf.properties.taxon_name === name);
    const genus  = sample?.properties.genus || '';
    const color  = INAT_GENUS_COLORS[genus] || '#aaa';
    return `<div class="inat-species-row" data-species="${esc(name)}">
      <div class="inat-species-name">
        <span class="inat-genus-dot" style="background:${color}"></span>
        ${esc(name)}
      </div>
      <span class="inat-species-count">${cnt}</span>
    </div>`;
  }).join('');

  document.getElementById('panel-content').innerHTML = `
    ${navBackBtnHtml()}
    <div class="inat-cluster-title">${leaves.length.toLocaleString()} iNat sightings</div>
    <div class="inat-cluster-sub">${coord} · ${sorted.length} species</div>
    <div class="inat-species-list">${rows}</div>
  `;
  wireNavBackBtn();

  document.querySelectorAll('.inat-species-row').forEach(el => {
    el.addEventListener('click', () => {
      inatNav.speciesName = el.dataset.species;
      // Push the species list as the back target so the obs list can come
      // back here.
      navPush({
        label:   'Species at location',
        restore: () => renderInatSpeciesList(inatNav.clusterLeaves),
      });
      renderInatObsList(inatNav.clusterLeaves.filter(lf => lf.properties.taxon_name === el.dataset.species));
    });
  });
}

// ═══════════════════════════════════════════════════════════
//  PHOTO GALLERY (grid + browsable lightbox)
// ═══════════════════════════════════════════════════════════
// Opened from any observation list. Shows EVERY photo from EVERY observation in
// the list (our obs data only stores one photo id each, so we batch-fetch each
// observation's full photo set from the iNat API). Each grid cell → a browsable
// lightbox with species / location / date + a link to the in-app obs detail.

const GALLERY_FETCH_CHUNK = 30;   // obs per iNat API request
const GALLERY_MAX_OBS     = 300;  // cap obs we fetch photos for (perf / API politeness)
let galleryPhotos = [];           // [{ photoId, obsId, taxonName, commonName, lat, lng, obscured, date }]
let galleryLightboxIdx = -1;

// Normalise either a feature (from cluster leaves) or a raw obs array (species
// list) into a plain descriptor the gallery can use.
function galleryDescFromFeature(lf) {
  const p = lf.properties;
  return { obsId: p.obs_id, taxonName: p.taxon_name, commonName: p.common_name || null,
           lat: p.lat, lng: p.lng, obscured: !!(p.flags & F_OBSCURED), date: p.date || null,
           hasPhoto: !!(p.flags & F_PHOTO) };
}
function galleryDescFromObs(o) {
  const t = inatTaxa[o[OBS_TI]] || [];
  return { obsId: o[OBS_ID], taxonName: t[1] || '—', commonName: t[3] || null,
           lat: o[OBS_LAT], lng: o[OBS_LNG], obscured: !!(o[OBS_FLAGS] & F_OBSCURED),
           date: o[OBS_DATE] || null, hasPhoto: !!(o[OBS_FLAGS] & F_PHOTO) };
}

// Count obs with photos in a descriptor list (for the button label).
function galleryPhotoObsCount(descs) {
  return descs.filter(d => d.hasPhoto).length;
}

// Remaining photo-bearing observation descriptors not yet fetched, plus the
// number of obs already pulled — drives the "Load more photos" button.
let galleryPending = [];   // descriptors with photos, awaiting fetch
let galleryObsLoaded = 0;  // obs whose photos have been fetched so far
let galleryGen = 0;        // guards stale fetches / load-more clicks

// Entry point. `descs` = normalised descriptors; `title` heads the view;
// `backEntry` is the nav-stack entry to return to.
async function openPhotoGallery(descs, title, backEntry) {
  inatNav.mode = 'gallery';
  if (backEntry) navPush(backEntry);

  galleryPending = descs.filter(d => d.hasPhoto);
  galleryPhotos = [];
  galleryObsLoaded = 0;
  galleryGen++;

  document.getElementById('panel-content').innerHTML = `
    ${navBackBtnHtml()}
    <div class="inat-cluster-title">${esc(title)}</div>
    <div class="inat-cluster-sub">${galleryPending.length.toLocaleString()} observation${galleryPending.length === 1 ? '' : 's'} with photos</div>
    <div class="gallery-grid" id="gallery-grid"></div>
    <div class="gallery-status" id="gallery-status">Loading photos…</div>
    <div id="gallery-more-wrap"></div>
  `;
  wireNavBackBtn();
  document.getElementById('panel-scroll')?.scrollTo(0, 0);

  await loadMoreGalleryPhotos();
}

// Fetch the next batch (up to GALLERY_MAX_OBS observations) of photos, append to
// the grid, and show a "Load more" button while observations remain.
async function loadMoreGalleryPhotos() {
  const myGen = galleryGen;
  const statusEl = document.getElementById('gallery-status');
  const moreWrap = document.getElementById('gallery-more-wrap');
  if (moreWrap) moreWrap.innerHTML = '';   // remove the button while loading

  const batch = galleryPending.slice(galleryObsLoaded, galleryObsLoaded + GALLERY_MAX_OBS);
  const byId  = new Map(batch.map(d => [String(d.obsId), d]));
  const ids   = batch.map(d => d.obsId);

  for (let i = 0; i < ids.length; i += GALLERY_FETCH_CHUNK) {
    if (myGen !== galleryGen) return;   // navigated away or restarted
    const chunk = ids.slice(i, i + GALLERY_FETCH_CHUNK);
    let results = [];
    try {
      const res = await fetch(`${INAT_API_OBS}?id=${chunk.join(',')}&per_page=${GALLERY_FETCH_CHUNK}&photos=true`);
      if (res.ok) results = (await res.json()).results || [];
    } catch { /* skip this chunk */ }
    if (myGen !== galleryGen) return;

    for (const obs of results) {
      const d = byId.get(String(obs.id));
      if (!d || !obs.photos?.length) continue;
      for (const ph of obs.photos) {
        galleryPhotos.push({
          url:        (ph.url || '').replace('square', 'medium'),
          full:       (ph.url || '').replace('square', 'large'),
          attribution: ph.attribution || '',
          obsId: d.obsId, taxonName: d.taxonName, commonName: d.commonName,
          lat: d.lat, lng: d.lng, obscured: d.obscured, date: d.date,
        });
      }
    }
    renderGalleryGrid();   // fill in as chunks arrive
    if (statusEl) statusEl.textContent = `${galleryPhotos.length.toLocaleString()} photos · loading…`;
  }
  if (myGen !== galleryGen) return;

  galleryObsLoaded += batch.length;
  const remaining = galleryPending.length - galleryObsLoaded;

  if (statusEl) {
    statusEl.textContent = `${galleryPhotos.length.toLocaleString()} photo${galleryPhotos.length === 1 ? '' : 's'} from ` +
      `${galleryObsLoaded.toLocaleString()} observation${galleryObsLoaded === 1 ? '' : 's'}` +
      (remaining > 0 ? ` (${remaining.toLocaleString()} more available)` : '');
    if (!galleryPhotos.length) statusEl.textContent = 'No photos available for these observations.';
  }

  const moreWrap2 = document.getElementById('gallery-more-wrap');
  if (moreWrap2 && remaining > 0) {
    moreWrap2.innerHTML = `<button class="inat-load-more" id="gallery-more-btn">Load more photos (${remaining.toLocaleString()} observations remaining)</button>`;
    document.getElementById('gallery-more-btn').addEventListener('click', loadMoreGalleryPhotos);
  }
}

function renderGalleryGrid() {
  const grid = document.getElementById('gallery-grid');
  if (!grid) return;
  // Only append cells that aren't rendered yet (preserves scroll + avoids
  // re-binding existing cells on each incremental render).
  const existing = grid.children.length;
  if (existing > galleryPhotos.length) { grid.innerHTML = ''; }   // safety: list shrank
  for (let i = grid.children.length; i < galleryPhotos.length; i++) {
    const ph = galleryPhotos[i];
    const cell = document.createElement('div');
    cell.className = 'gallery-cell';
    cell.dataset.idx = i;
    cell.innerHTML = `<img src="${ph.url}" loading="lazy" alt="${esc(ph.taxonName)}" onerror="this.parentElement.style.display='none'">`;
    cell.addEventListener('click', () => openGalleryLightbox(i));
    grid.appendChild(cell);
  }
}

// ── Lightbox ──────────────────────────────────────────────
function openGalleryLightbox(idx) {
  galleryLightboxIdx = idx;
  const lb = document.getElementById('gallery-lightbox');
  lb.classList.add('open');
  renderGalleryLightbox();
}
function closeGalleryLightbox() {
  document.getElementById('gallery-lightbox').classList.remove('open');
  galleryLightboxIdx = -1;
}
function galleryStep(delta) {
  if (!galleryPhotos.length) return;
  galleryLightboxIdx = (galleryLightboxIdx + delta + galleryPhotos.length) % galleryPhotos.length;
  renderGalleryLightbox();
}
function renderGalleryLightbox() {
  const ph = galleryPhotos[galleryLightboxIdx];
  if (!ph) return;
  const img = document.getElementById('glb-img');
  img.src = ph.url;
  const cap = document.getElementById('glb-caption');
  const coordStr = ph.obscured
    ? `~${Math.abs(ph.lat).toFixed(2)}°${ph.lat>=0?'N':'S'}, ${Math.abs(ph.lng).toFixed(2)}°${ph.lng>=0?'E':'W'} (approx.)`
    : `${Math.abs(ph.lat).toFixed(3)}°${ph.lat>=0?'N':'S'}, ${Math.abs(ph.lng).toFixed(3)}°${ph.lng>=0?'E':'W'}`;
  cap.innerHTML = `
    <div class="glb-counter">${galleryLightboxIdx + 1} / ${galleryPhotos.length}</div>
    <div class="glb-species">${esc(ph.taxonName)}</div>
    ${ph.commonName ? `<div class="glb-common">${esc(ph.commonName)}</div>` : ''}
    <div class="glb-meta">
      <span id="glb-loc" title="${esc(coordStr)}">${esc(coordStr)}</span>${ph.date ? ` · ${esc(ph.date)}` : ''}
      ${ph.attribution ? `<br><span style="opacity:0.7;font-size:11px">${esc(ph.attribution)}</span>` : ''}
    </div>
    <div class="glb-actions">
      <button class="glb-btn primary" id="glb-view-details">${BMG_ICONS.eye} View observation details</button>
      <a class="glb-btn" href="${INAT_OBS_URL}${ph.obsId}" target="_blank" rel="noopener">${BMG_ICONS.link} iNaturalist ↗</a>
    </div>`;
  // Reverse-geocode the location (cached); refine the coord string to a place name.
  fetchObsLocationName(ph.lat, ph.lng, ph.obscured).then(name => {
    if (galleryPhotos[galleryLightboxIdx] !== ph) return;   // moved on
    const el = document.getElementById('glb-loc');
    if (el && name) { const disp = ph.obscured ? `${name} (approx.)` : name; el.textContent = disp; el.title = disp; }
  });
  document.getElementById('glb-view-details').onclick = () => {
    closeGalleryLightbox();
    openObsById(ph.obsId);   // opens the in-app obs detail (resolves via iNat API)
  };
}

// Lightbox controls: wired once at init.
function initGalleryLightbox() {
  document.getElementById('glb-close')?.addEventListener('click', closeGalleryLightbox);
  document.getElementById('glb-prev')?.addEventListener('click', () => galleryStep(-1));
  document.getElementById('glb-next')?.addEventListener('click', () => galleryStep(1));
  document.getElementById('gallery-lightbox')?.addEventListener('click', e => {
    if (e.target.id === 'gallery-lightbox') closeGalleryLightbox();   // click backdrop to close
  });
  document.addEventListener('keydown', e => {
    if (!document.getElementById('gallery-lightbox')?.classList.contains('open')) return;
    if (e.key === 'Escape') closeGalleryLightbox();
    else if (e.key === 'ArrowLeft')  galleryStep(-1);
    else if (e.key === 'ArrowRight') galleryStep(1);
  });
  // Swipe left/right on the stage to navigate (mobile).
  const stage = document.querySelector('#gallery-lightbox .glb-stage');
  if (stage) {
    let x0 = 0, y0 = 0, tracking = false;
    stage.addEventListener('touchstart', e => { if (e.touches.length===1){ x0=e.touches[0].clientX; y0=e.touches[0].clientY; tracking=true; } }, { passive: true });
    stage.addEventListener('touchend', e => {
      if (!tracking) return; tracking = false;
      const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) galleryStep(dx < 0 ? 1 : -1);
    }, { passive: true });
  }
}

const INAT_OBS_PAGE = 20;

function renderInatObsList(leaves, offset = 0) {
  inatNav.mode = 'obs-list';
  if (speciesClimateChart) { speciesClimateChart.destroy(); speciesClimateChart = null; }
  if (speciesPhenoChart)   { speciesPhenoChart.destroy();   speciesPhenoChart   = null; }

  const page    = leaves.slice(offset, offset + INAT_OBS_PAGE);
  const hasMore = leaves.length > offset + INAT_OBS_PAGE;

  // Pass the ABSOLUTE index into `leaves` (offset + i) so the click handler's
  // `leaves[idx]` opens the right observation — and so paginated pages don't
  // all collide on data-idx. (Was obsCard(lf) → every card got the default
  // idx=0, which opened leaves[0] for every row.)
  const cards = page.map((lf, i) => obsCard(lf, offset + i)).join('');

  const photoCount = leaves.reduce((n, lf) => n + ((lf.properties.flags & F_PHOTO) ? 1 : 0), 0);
  const galleryBtn = photoCount > 0
    ? `<button class="gallery-open-btn" id="obs-gallery-btn">${BMG_ICONS.grid} Photo Gallery (${photoCount.toLocaleString()})</button>`
    : '';

  const content = `
    ${navBackBtnHtml()}
    <div class="inat-cluster-title" style="font-style:italic">${esc(inatNav.speciesName)}</div>
    <div class="inat-cluster-sub">${leaves.length} sightings in this area</div>
    ${galleryBtn}
    <div class="inat-obs-list" id="inat-obs-list">${cards}</div>
    ${hasMore ? `<button class="inat-load-more" id="inat-load-more" data-offset="${offset + INAT_OBS_PAGE}">Load more (${leaves.length - offset - INAT_OBS_PAGE} remaining)</button>` : ''}
  `;

  if (offset === 0) {
    document.getElementById('panel-content').innerHTML = content;
    wireNavBackBtn();
    document.getElementById('obs-gallery-btn')?.addEventListener('click', () => {
      const title = inatNav.speciesName || 'Observations';
      openPhotoGallery(
        leaves.map(galleryDescFromFeature),
        title,
        { label: title, restore: () => renderInatObsList(leaves, 0) }
      );
    });
  } else {
    document.getElementById('inat-obs-list').insertAdjacentHTML('beforeend', cards);
    document.getElementById('inat-load-more')?.remove();
    if (hasMore) {
      document.getElementById('panel-scroll').insertAdjacentHTML('beforeend',
        `<button class="inat-load-more" id="inat-load-more" data-offset="${offset + INAT_OBS_PAGE}">Load more (${leaves.length - offset - INAT_OBS_PAGE} remaining)</button>`);
    }
  }

  // Wire events. Guard against double-binding: on "Load more" this block runs
  // again over the full list, so skip cards that already have a handler.
  document.querySelectorAll('.inat-obs-card').forEach(card => {
    if (card._wired) return;
    card._wired = true;
    card.addEventListener('click', () => {
      const idx = parseInt(card.dataset.idx);
      inatNav.obsFeature = leaves[idx];
      // Push the obs list as the back target so the obs detail can come
      // back here. Capture leaves + offset to preserve scroll context.
      navPush({
        label:   `Sightings of ${inatNav.speciesName}`,
        restore: () => renderInatObsList(leaves, 0),
      });
      openInatObsPanel(leaves[idx]);
    });
  });
  document.getElementById('inat-load-more')?.addEventListener('click', e => {
    const nextOffset = parseInt(e.target.dataset.offset);
    renderInatObsList(leaves, nextOffset);
  });
}

function obsCard(lf, idx = 0) {
  const p       = lf.properties;
  const hasPhoto = !!(p.flags & F_PHOTO);
  const photoEl  = hasPhoto && p.photo_id
    ? inatThumbImg(p.photo_id, 'inat-obs-thumb')
    : `<div class="inat-obs-thumb-placeholder">🌿</div>`;
  const qBadge   = (p.flags & F_NEEDSID)
    ? `<span class="inat-badge inat-badge-nid">Needs ID</span>`
    : `<span class="inat-badge inat-badge-rg">Research</span>`;
  const obsBadge = (p.flags & F_OBSCURED) ? `<span class="inat-badge inat-badge-obs">Approx.</span>` : '';
  return `<div class="inat-obs-card" data-idx="${idx}">
    ${photoEl}
    <div class="inat-obs-meta">
      <div class="inat-obs-taxon">${esc(p.taxon_name)}</div>
      <div class="inat-obs-date">${p.date || '—'}</div>
      <div class="inat-obs-badges">${qBadge}${obsBadge}</div>
    </div>
  </div>`;
}

async function fetchInatObsDetail(obsId, gen) {
  try {
    const res  = await fetch(`${INAT_API_OBS}${obsId}?`);
    if (!res.ok || gen !== inatDetailGen) return;
    const data = await res.json();
    if (gen !== inatDetailGen) return;   // navigated away while waiting for JSON parse
    const obs  = data.results?.[0];
    if (!obs) return;

    // Photos
    const gallery = document.getElementById('inat-photo-gallery');
    if (gallery && obs.photos?.length) {
      gallery.innerHTML = obs.photos.map(ph => {
        const src = ph.url?.replace('square', 'medium') || '';
        return `<img class="inat-detail-photo" src="${src}" loading="lazy" onerror="this.style.display='none'" title="${esc(ph.attribution || '')}">`;
      }).join('');
    } else if (gallery) {
      gallery.remove();
    }

    // Detail body
    const body = document.getElementById('inat-detail-body');
    if (!body) return;

    let html = '';

    // Observer
    if (obs.user?.login) {
      html += `<div class="inat-detail-label">Observer</div>
        <div style="font-size:12px;color:var(--text-primary);margin-bottom:10px">
          ${esc(obs.user.name || obs.user.login)}
          <span style="color:var(--text-muted)"> @${esc(obs.user.login)}</span>

    if (obs.description?.trim()) {
      html += `<div class="inat-detail-label">Notes</div>
        <div class="inat-detail-notes">${esc(obs.description)}</div>`;
    }

    // Identifications
    const ids = (obs.identifications || []).filter(id => id.current);
    if (ids.length) {
      html += `<div class="inat-detail-label">Identifications</div>
        <div style="margin-bottom:12px">${ids.map(id => `
          <div class="inat-detail-id-row">
            <div>
              <div class="inat-detail-id-taxon">${esc(id.taxon?.name || '—')}</div>
              <div class="inat-detail-id-user">@${esc(id.user?.login || '?')}${id.body ? ` · ${esc(id.body.slice(0, 80))}` : ''}</div>

  }
}

// ── Nepenthes species elevation bands (from the curated spreadsheet) ──────────
// For an obscured Nepenthes sighting we can narrow the plausible elevation —
// and therefore the temperature estimate — by intersecting the cell's terrain
// range with the species' published elevation band.
let _nepElev = null, _nepElevPromise = null;
function loadNepenthesElev() {
  if (_nepElev) return Promise.resolve(_nepElev);
  if (!_nepElevPromise) {
    _nepElevPromise = fetch('./inat/nepenthes-elevation.json')
      .then(r => r.ok ? r.json() : null)
      .then(d => { _nepElev = d?.species || {}; return _nepElev; })
      .catch(() => { _nepElevPromise = null; return null; });
  }
  return _nepElevPromise;
}
function lookupNepenthesBand(taxonName) {
  if (!_nepElev || !taxonName) return null;
  const words = taxonName.toLowerCase().replace(/×/g, ' ').replace(/\bx\b/g, ' ')
    .split(/\s+/).filter(Boolean);
  if (words.length < 2 || words[0] !== 'nepenthes') return null;
  return _nepElev[`${words[0]} ${words[1]}`] || null;   // [minM, maxM]
}

// ── Inline climate section for obs detail ─────────────────

async function loadInatClimateSection(lat, lng, obscured, taxonName) {
  const body = document.getElementById('inat-climate-body');
  if (!body) return;
  body.innerHTML = `<div class="climate-pending">Loading climate data${obscured ? ' (sampling area elevation…)' : '…'}</div>`;

  if (climateChart) { climateChart.destroy(); climateChart = null; }
  if (lightChart)   { lightChart.destroy();   lightChart   = null; }

  // Elevation: exact sightings use the precise point; obscured sightings get a
  // min/max/median across the ~0.2° (~22 km) cell so we can show a range.
  const swLat = Math.floor(lat / 0.2) * 0.2, swLng = Math.floor(lng / 0.2) * 0.2;
  const isNepenthes = /^nepenthes\b/i.test(taxonName || '');
  const elevTask = obscured
    ? sampleCellElevationRange(swLat, swLng).catch(() => null)
    : fetchTerrainElevation(lat, lng)
        .then(e => e == null ? null : { min: Math.round(e), max: Math.round(e), median: Math.round(e) })
        .catch(() => null);

  let [normals, elev] = await Promise.all([
    fetchSearchClimateNormals(lat, lng).catch(() => null),
    elevTask,
    (obscured && isNepenthes) ? loadNepenthesElev().catch(() => null) : Promise.resolve(null),
  ]);

  const b = document.getElementById('inat-climate-body');
  if (!b) return; // navigated away

  if (!normals?.tempMax) {
    b.innerHTML = '<div class="climate-pending">Climate data unavailable for this location</div>';
    return;
  }

  // Refine the obscured cell's elevation range using the species' published band.
  // The observation is physically in this cell, so terrain is the hard constraint:
  // the band can only NARROW within the cell's terrain, never override it.
  let nepBand = null;   // { spMin, spMax, terrainMin, terrainMax, kind } when relevant
  if (obscured && elev && isNepenthes) {
    const band = lookupNepenthesBand(taxonName);
    if (band) {
      const [spMin, spMax] = band;
      const ovMin = Math.max(elev.min, spMin);
      const ovMax = Math.min(elev.max, spMax);
      const base  = { spMin, spMax, terrainMin: elev.min, terrainMax: elev.max };
      if (ovMin > ovMax) {
        // Band and terrain don't overlap — keep terrain, flag the mismatch
        // (likely a cultivated plant or one outside its typical range).
        nepBand = { ...base, kind: 'no-overlap' };
      } else if (ovMin > elev.min || ovMax < elev.max) {
        // Band genuinely tightens the plausible elevation → use the overlap.
        elev = { min: ovMin, max: ovMax, median: Math.round((ovMin + ovMax) / 2) };
        nepBand = { ...base, kind: 'narrowed' };
      }
      // else band already contains the whole terrain range → no change, plain note.
    }
  }

  // Build humidity-aware, per-month elevation corrections. For obscured cells
  // with real relief we keep three versions — at the cell's min (warmest),
  // median, and max (coldest) elevation — so the boxes can show a range and the
  // chart can switch between them. Exact sightings use the single point.
  const raw       = normals;                       // uncorrected (rhMean included)
  const canCorrect = elev && raw.modelElev != null;
  const useRange   = obscured && canCorrect && (elev.max - elev.min) >= 25;
  const cMed  = canCorrect ? applyHumidityLapse(raw, elev.median) : raw;
  const cLow  = useRange   ? applyHumidityLapse(raw, elev.min)    : cMed;  // lowest → warmest
  const cHigh = useRange   ? applyHumidityLapse(raw, elev.max)    : cMed;  // highest → coldest
  const corrected = { low: cLow, med: cMed, high: cHigh };
  const elevByKey = { low: elev?.min, med: elev?.median, high: elev?.max };

  const metricsOf = cn => {
    const vMax = cn.tempMax.filter(x => x != null);
    const vMin = cn.tempMin.filter(x => x != null);
    const ex = extremeBoxVals(cn);
    return {
      avgHigh: vMax.length ? Math.max(...vMax) : null,
      avgLow:  vMin.length ? Math.min(...vMin) : null,
      extHigh: ex.extHigh, extLow: ex.extLow,
    };
  };
  const mMed = metricsOf(cMed), warm = metricsOf(cLow), cold = metricsOf(cHigh);

  // Precip / RH are not elevation-dependent.
  const annPrec = Math.round(raw.precipMm.reduce((a, v) => a + (v || 0), 0));
  const validRH = raw.rhMean ? raw.rhMean.filter(v => v != null) : [];
  const annRH   = validRH.length ? validRH.reduce((a, v) => a + v, 0) / validRH.length : null;

  // Temperature stat box — a range (cold→warm across the elevation span) for
  // obscured cells, otherwise a single value.
  const tBox = (label, title, single, loC, hiC) => {
    if (single == null && !(useRange && loC != null)) return '';
    return useRange
      ? `<div class="climate-stat" title="${title} — range across the cell's elevation span">
           <div class="climate-stat-label">${label}</div>
           <div class="climate-stat-value" style="font-size:15px" data-celsius-range="${loC},${hiC}">${toDisplayRange(loC, hiC, tempUnit)}</div></div>`
      : `<div class="climate-stat" title="${title}">
           <div class="climate-stat-label">${label}</div>
           <div class="climate-stat-value" data-celsius="${single}">${toDisplay(single, tempUnit)}</div></div>`;
  };

  const elevBox = elev
    ? (useRange
        ? `<div class="climate-stat" title="Elevation range across the obscured ~22 km cell"><div class="climate-stat-label">Elevation</div>
            <div class="climate-stat-value" style="font-size:13px">${elev.min.toLocaleString()}–${elev.max.toLocaleString()}<span class="climate-stat-unit">m</span></div></div>`
        : `<div class="climate-stat"><div class="climate-stat-label">Elevation</div>
            <div class="climate-stat-value">${elev.median.toLocaleString()}<span class="climate-stat-unit">m</span></div></div>`)
    : '';

  // Explanatory lead-in describing how the elevation range was derived.
  const bandLead = (nepBand && nepBand.kind === 'narrowed')
    ? `<strong>Approximate location, refined by species.</strong> Within this ~22 km cell (terrain ${nepBand.terrainMin.toLocaleString()}–${nepBand.terrainMax.toLocaleString()} m), the plausible elevation narrows to the overlap with <em>${esc(taxonName)}</em>’s published band (${nepBand.spMin.toLocaleString()}–${nepBand.spMax.toLocaleString()} m) → <strong>${elev.min.toLocaleString()}–${elev.max.toLocaleString()} m</strong>.`
    : (nepBand && nepBand.kind === 'no-overlap')
    ? `<strong>Approximate location.</strong> This cell's terrain (${nepBand.terrainMin.toLocaleString()}–${nepBand.terrainMax.toLocaleString()} m) doesn't reach <em>${esc(taxonName)}</em>’s published band (${nepBand.spMin.toLocaleString()}–${nepBand.spMax.toLocaleString()} m) — the species refinement doesn't apply (possibly cultivated or atypical), so the cell's terrain range is used.`
    : `<strong>Approximate location.</strong> The true site is unknown within this ~22 km cell, where elevation ranges <strong>${elev.min.toLocaleString()}–${elev.max.toLocaleString()} m</strong>.`;

  // Note + (for obscured ranges) a Low/Mid/High elevation switcher.
  let controlsHtml = '';
  if (useRange) {
    const rate = Math.round(meanLapseRate(cMed, elev.median) * 10) / 10;
    controlsHtml = `
      <div class="sp-chart-note">${bandLead} Boxes show the range across that span (humidity-aware lapse ~${rate}°C/1000 m). Pick an elevation for the chart &amp; table:</div>
      <div class="elev-switch">
        <button class="elev-btn" data-elev="low">Low<span>${elev.min.toLocaleString()} m</span></button>
        <button class="elev-btn active" data-elev="med">Mid<span>${elev.median.toLocaleString()} m</span></button>
        <button class="elev-btn" data-elev="high">High<span>${elev.max.toLocaleString()} m</span></button>
      </div>
      <div class="sp-chart-note" id="elev-sel-note"></div>`;
  } else if (canCorrect) {
    const rate = Math.round(meanLapseRate(cMed, elev.median) * 10) / 10;
    controlsHtml = nepBand
      ? `<div class="sp-chart-note">${bandLead} Temperatures corrected to ${elev.median.toLocaleString()} m (humidity-aware lapse ~${rate}°C/1000 m).</div>`
      : obscured
      ? `<div class="sp-chart-note"><strong>Approximate location</strong> (~22 km cell, little elevation variation). Temperatures corrected to ${elev.median.toLocaleString()} m (humidity-aware lapse ~${rate}°C/1000 m).</div>`
      : `<div class="sp-chart-note">Temperatures corrected for elevation (${elev.median.toLocaleString()} m) using a humidity-aware lapse rate (~${rate}°C/1000 m, applied per month).</div>`;
  }

  b.innerHTML = `
    <div class="climate-grid" style="margin-top:4px">
      ${tBox('Avg High', "Hottest month's average daily high", mMed.avgHigh, cold.avgHigh, warm.avgHigh)}
      ${tBox('Avg Low',  "Coldest month's average daily low",  mMed.avgLow,  cold.avgLow,  warm.avgLow)}
      ${tBox('Extreme High', "Hottest month's p90 daily high", mMed.extHigh, cold.extHigh, warm.extHigh)}
      ${tBox('Extreme Low',  "Coldest month's p10 daily low",  mMed.extLow,  cold.extLow,  warm.extLow)}
      <div class="climate-stat"><div class="climate-stat-label">Annual Precip</div>
        <div class="climate-stat-value">${annPrec}<span class="climate-stat-unit">mm</span></div></div>
      ${annRH != null ? `<div class="climate-stat"><div class="climate-stat-label">Avg RH</div>
        <div class="climate-stat-value">${Math.round(annRH)}<span class="climate-stat-unit">%</span></div></div>` : ''}
      ${elevBox}
    </div>
    ${controlsHtml}
    <div class="section-label" style="margin-top:12px">Temperature &amp; Precipitation</div>
    <div id="inat-temp-dynamic"></div>
    ${raw.daylightHrs ? `
      <div class="section-divider"></div>
      <div class="section-label">Light &amp; Atmosphere</div>
      <div class="chart-wrap"><canvas id="light-chart"></canvas></div>
      ${buildLightTable(cMed)}
    ` : ''}
    ${climateMethodologyHtml()}
  `;

  // Render the temperature chart + table for a chosen elevation version.
  const renderTempElev = (sel) => {
    const dyn = document.getElementById('inat-temp-dynamic');
    if (!dyn) return;
    if (climateChart) { climateChart.destroy(); climateChart = null; }
    const cn = corrected[sel] || cMed;
    dyn.innerHTML = `<div class="chart-wrap"><canvas id="climate-chart"></canvas></div>${buildClimateTable(cn)}`;
    buildClimateChart(cn);
    if (useRange) {
      document.querySelectorAll('.elev-btn').forEach(bt => bt.classList.toggle('active', bt.dataset.elev === sel));
      const noteEl = document.getElementById('elev-sel-note');
      if (noteEl) noteEl.textContent = `Chart & table shown for ${sel === 'low' ? 'low' : sel === 'high' ? 'high' : 'mid'} elevation (${(elevByKey[sel] ?? 0).toLocaleString()} m).`;
    }
  };

  renderTempElev('med');
  if (useRange) {
    document.querySelectorAll('.elev-btn').forEach(bt => {
      bt.addEventListener('click', () => renderTempElev(bt.dataset.elev));
    });
  }
  if (raw.daylightHrs) buildLightChart(cMed);
}


// ── Filter panel UI ───────────────────────────────────────

function buildInatFilterPanel() {
  // Genera checkboxes
  const genChecks = document.getElementById('inat-genera-checks');
  genChecks.innerHTML = INAT_GENERA.map(g => `
    <label class="inat-check-label">
      <input type="checkbox" class="inat-genus-cb" data-genus="${g}" checked>
      <span class="inat-genus-dot" style="background:${INAT_GENUS_COLORS[g]}"></span>
      ${g}
    </label>`).join('');

  // Koppen checkboxes (grouped + collapsible)
  const kopChecks = document.getElementById('inat-koppen-checks');
  kopChecks.innerHTML = INAT_KOPPEN_GROUPS.map(grp => `
    <div style="margin-bottom:6px">
      <div style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;margin-bottom:3px;letter-spacing:0.05em">${grp.label}</div>
      ${grp.zones.map(z => `
        <label class="inat-check-label" style="padding-left:8px">
          <input type="checkbox" class="inat-koppen-cb" data-kv="${z.v}" checked>
          ${z.c}
        </label>`).join('')}
    </div>`).join('');

  // Collapsible sections
  document.querySelectorAll('.inat-section-head').forEach(head => {
    head.addEventListener('click', () => {
      const target = document.getElementById(head.dataset.target);
      target.classList.toggle('hidden');
      head.classList.toggle('collapsed');
    });
  });

  // Genus checkboxes → filter + load data
  document.getElementById('inat-genera-all').addEventListener('click', () => {
    document.querySelectorAll('.inat-genus-cb').forEach(cb => { cb.checked = true; });
    applyInatFilters();
  });
  document.getElementById('inat-genera-none').addEventListener('click', () => {
    document.querySelectorAll('.inat-genus-cb').forEach(cb => { cb.checked = false; });
    applyInatFilters();
  });
  document.querySelectorAll('.inat-genus-cb').forEach(cb => {
    cb.addEventListener('change', applyInatFilters);
  });

  // Quality
  document.getElementById('inat-rg').addEventListener('change',  applyInatFilters);
  document.getElementById('inat-nid').addEventListener('change', applyInatFilters);

  // Köppen
  document.getElementById('inat-koppen-all').addEventListener('click', () => {
    document.querySelectorAll('.inat-koppen-cb').forEach(cb => { cb.checked = true; });
    applyInatFilters();
  });
  document.querySelectorAll('.inat-koppen-cb').forEach(cb => {
    cb.addEventListener('change', applyInatFilters);
  });

  // Visible toggle
  document.getElementById('inat-visible-toggle').addEventListener('change', e => {
    inatVisible = e.target.checked;
    if (inatVisible) {
      enableInatLayer();
    } else {
      disableInatLayer();
    }
  });

  // ── Date Observed ──
  const monthOpts = '<option value="">—</option>' +
    MONTHS.map((m, i) => `<option value="${i + 1}">${m}</option>`).join('');
  document.getElementById('inat-day-start-m').innerHTML = monthOpts;
  document.getElementById('inat-day-end-m').innerHTML   = monthOpts;
  const curYear = new Date().getFullYear();
  document.getElementById('inat-year-start').value = curYear;
  document.getElementById('inat-year-end').value   = curYear;

  // Manual edits to any day/year control clear the active quick-button highlight.
  document.querySelectorAll('#inat-date-body .inat-date-mon, #inat-date-body .inat-date-day, #inat-date-body .inat-date-year')
    .forEach(el => el.addEventListener('change', () => { clearDateQuickActive(); applyInatFilters(); }));

  document.getElementById('inat-year-all').addEventListener('change', e => {
    document.getElementById('inat-year-row').classList.toggle('disabled', e.target.checked);
    applyInatFilters();
  });

  document.querySelectorAll('.inat-date-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.days;
      if (v === 'clear') { clearDateControls(); applyInatFilters(); return; }
      // "Past N days" → day window ending today, current year only.
      const today = new Date();
      const start = new Date(); start.setDate(today.getDate() - (parseInt(v) - 1));
      setDayControl('start', start.getMonth() + 1, start.getDate());
      setDayControl('end',   today.getMonth() + 1, today.getDate());
      const allYears = document.getElementById('inat-year-all');
      allYears.checked = false;
      document.getElementById('inat-year-row').classList.remove('disabled');
      document.getElementById('inat-year-start').value = today.getFullYear();
      document.getElementById('inat-year-end').value   = today.getFullYear();
      document.querySelectorAll('.inat-date-btn').forEach(b => b.classList.toggle('active', b === btn));
      applyInatFilters();
    });
  });
}

function setDayControl(which, month, day) {
  document.getElementById(`inat-day-${which}-m`).value = month;
  document.getElementById(`inat-day-${which}-d`).value = day;
}
function clearDateQuickActive() {
  document.querySelectorAll('.inat-date-btn.active').forEach(b => b.classList.remove('active'));
}
function clearDateControls() {
  ['start', 'end'].forEach(w => {
    document.getElementById(`inat-day-${w}-m`).value = '';
    document.getElementById(`inat-day-${w}-d`).value = '';
  });
  const curYear = new Date().getFullYear();
  document.getElementById('inat-year-all').checked = false;
  document.getElementById('inat-year-row').classList.remove('disabled');
  document.getElementById('inat-year-start').value = curYear;
  document.getElementById('inat-year-end').value   = curYear;
  clearDateQuickActive();
}

function applyInatFilters() {
  // Genera
  inatFilters.genera = new Set(
    [...document.querySelectorAll('.inat-genus-cb:checked')].map(cb => cb.dataset.genus)
  );
  // Quality
  inatFilters.needsId = document.getElementById('inat-nid').checked;
  // Koppen
  inatFilters.koppen  = new Set(
    [...document.querySelectorAll('.inat-koppen-cb:checked')].map(cb => parseInt(cb.dataset.kv))
  );
  // Date Observed — day window (MM-DD) only activates when both ends are set.
  const pad = n => String(n).padStart(2, '0');
  const dsM = document.getElementById('inat-day-start-m').value;
  const dsD = document.getElementById('inat-day-start-d').value;
  const deM = document.getElementById('inat-day-end-m').value;
  const deD = document.getElementById('inat-day-end-d').value;
  inatFilters.dayStart = (dsM && dsD) ? `${pad(dsM)}-${pad(dsD)}` : null;
  inatFilters.dayEnd   = (deM && deD) ? `${pad(deM)}-${pad(deD)}` : null;
  inatFilters.allYears = document.getElementById('inat-year-all').checked;
  inatFilters.yearStart = parseInt(document.getElementById('inat-year-start').value) || null;
  inatFilters.yearEnd   = parseInt(document.getElementById('inat-year-end').value)   || null;

  if (!inatVisible) return;

  // On mobile: load needed genus files; on desktop: all.json already loaded
  if (window.innerWidth < 1024 && !inatAllLoaded) {
    Promise.all([...inatFilters.genera].filter(g => !inatLoadedGenera.has(g)).map(loadInatGenus))
      .then(() => { rebuildInatIndex(); refreshRegionChipCount(); });
  } else {
    rebuildInatIndex();
    refreshRegionChipCount();
  }
}

// Keep the region chip's observation count in sync after a genus/quality change.
function refreshRegionChipCount() {
  if (inatRegionFilter) setRegionChip(inatRegionFilter.name, countRegionObs(), false);
}

// ── Layer enable/disable ──────────────────────────────────

async function enableInatLayer() {
  if (!inatClusterGroup) {
    inatClusterGroup = L.layerGroup().addTo(map);
    inatRectGroup    = L.layerGroup().addTo(map);
  } else {
    if (!map.hasLayer(inatClusterGroup)) inatClusterGroup.addTo(map);
    if (!map.hasLayer(inatRectGroup))    inatRectGroup.addTo(map);
  }
  initInatWorker();

  const isMobile = window.innerWidth < 1024;
  if (!isMobile && !inatAllLoaded) {
    await loadInatAll();
  } else if (isMobile && !inatAllLoaded) {
    const toLoad = [...inatFilters.genera].filter(g => !inatLoadedGenera.has(g));
    if (toLoad.length) {
      await Promise.all(toLoad.map(loadInatGenus));
    } else {
      rebuildInatIndex();
    }
  } else {
    rebuildInatIndex();
  }

  map.on('moveend', renderInatClusters);
  map.on('zoomend', renderInatClusters);
}

function disableInatLayer() {
  if (inatClusterGroup) inatClusterGroup.clearLayers();
  if (inatRectGroup)    inatRectGroup.clearLayers();
  map.off('moveend', renderInatClusters);
  map.off('zoomend', renderInatClusters);
}

function setInatStatus(msg, loading = false) {
  const el  = document.getElementById('inat-status');
  const bar = document.getElementById('inat-loading-bar');
  if (msg) { el.textContent = msg; el.style.display = 'block'; } else { el.style.display = 'none'; }
  bar.style.display = loading ? 'block' : 'none';
}

// Turn on the iNat observation layer by default (desktop + mobile). Reflects
// the "Show pins" toggle state and kicks off the data load. Kept separate from
// the toggle's change handler so init can call it without synthesising events.
function enableInatDefault() {
  const toggle = document.getElementById('inat-visible-toggle');
  if (toggle) toggle.checked = true;
  inatVisible = true;
  enableInatLayer();
}

        Species envelopes use a 5-year window (2019–2023); live point queries use 10 years (2014–2023).
      </div>
    </div>
    <div class="bmg-source-row">
      <div class="bmg-source-label">Elevation</div>
      <div class="bmg-source-value">
        ASTER GDEM 30 m via
        <a href="https://www.opentopodata.org/" target="_blank" rel="noopener">OpenTopoData</a>.
        Covers 83°N–83°S (better than SRTM for sub-arctic species).
      </div>
    </div>
    <div class="bmg-source-row">
      <div class="bmg-source-label">Köppen zones</div>
      <div class="bmg-source-value">
        <a href="https://www.nature.com/articles/sdata2018214" target="_blank" rel="noopener">Beck et al. 2018</a>
        — 1991–2020 climatology at 0.1° resolution.
      </div>
    </div>
    <div class="bmg-source-row">
      <div class="bmg-source-label">Daylight hours</div>
      <div class="bmg-source-value">
        Computed astronomically from latitude (standard solar-declination formula,
        evaluated at the 15th of each month).
      </div>
    </div>

    <h3>Methodology</h3>
    <ul>
      <li><strong>Grid</strong> — Observations are aggregated into 0.5° cells (~55 km north-south). One representative GPS point per cell is chosen as the densest local cluster.</li>
      <li><strong>Lapse-rate correction</strong> — Temperatures are adjusted by 6.5 °C per 1000 m for the difference between the MERRA-2 model grid surface and actual terrain elevation at the sample point.</li>
      <li><strong>Species filter</strong> — Only species with at least 3 occupied cells are summarized. Sparser species are listed under "Unmapped Taxa".</li>
      <li><strong>Statistics</strong> — Annual values use p10/p25/p50/p75/p90 percentiles across all occupied cells. Monthly charts split Northern and Southern Hemisphere observations to show the correct seasonal cycle for each.</li>
    </ul>

    <div class="bmg-modal-actions">
      <button class="bmg-modal-link" id="bmg-show-welcome-from-info">Show welcome guide</button>
      <button class="bmg-modal-primary" id="bmg-info-dismiss">Close</button>
    </div>
  `;
}

let bmgModalMode = null;  // 'welcome' | 'info' — tracks which dialog is open
function bmgOpenWelcome() {
  bmgModalMode = 'welcome';
  document.getElementById('bmg-modal-body').innerHTML = getWelcomeHtml();
  document.getElementById('bmg-modal-overlay').classList.remove('hidden');
  // Wire dismiss buttons (re-bind each open since innerHTML replaces the nodes)
  document.getElementById('bmg-welcome-dismiss')?.addEventListener('click', bmgCloseModal);
  document.getElementById('bmg-show-info-from-welcome')?.addEventListener('click', bmgOpenInfo);
  // Draw connector arrows after layout settles (rAF lets the modal size first).
  requestAnimationFrame(drawOnboardingArrows);
}
function bmgOpenInfo() {
  clearOnboardingArrows();   // info dialog has no onboarding overlay
  bmgModalMode = 'info';
  document.getElementById('bmg-modal-body').innerHTML = getInfoHtml();
  document.getElementById('bmg-modal-overlay').classList.remove('hidden');
  document.getElementById('bmg-info-dismiss')?.addEventListener('click', bmgCloseModal);
  document.getElementById('bmg-show-welcome-from-info')?.addEventListener('click', bmgOpenWelcome);
}
function bmgCloseModal() {
  // Mark welcome as seen on ANY dismissal (button, ×, overlay click, ESC) so
  // it doesn't pop up next visit. Users can re-open it via the info dialog.
  if (bmgModalMode === 'welcome') {
    try { localStorage.setItem('bmg_welcome_seen', WELCOME_VERSION); } catch {}
  }
  clearOnboardingArrows();
  document.getElementById('bmg-modal-overlay').classList.add('hidden');
  bmgModalMode = null;
}

// ── Welcome onboarding arrows ──────────────────────────────
// Draw an accent arrow from each annotated bullet (data-arrow-target) to its
// real on-map control, and lift+highlight those controls above the overlay so
// they're visible through the dark blur. Desktop only: on narrow screens the
// modal fills the viewport and the controls sit under it, so arrows would be
// cramped and overlap — we skip the whole effect there.
const ONBOARD_ARROW_MIN_WIDTH = 1024;

function clearOnboardingArrows() {
  document.getElementById('bmg-arrow-svg')?.remove();
  document.body.classList.remove('bmg-onboarding');
  document.querySelectorAll('.bmg-onboard-target')
    .forEach(el => el.classList.remove('bmg-onboard-target'));
}

function drawOnboardingArrows() {
  clearOnboardingArrows();
  if (bmgModalMode !== 'welcome') return;
  if (window.innerWidth < ONBOARD_ARROW_MIN_WIDTH) return;

  const overlay = document.getElementById('bmg-modal-overlay');
  const modal   = overlay?.querySelector('.bmg-modal');
  if (!modal) return;

  // Gather (bullet → control) pairs that actually resolve to a visible element.
  const pairs = [...document.querySelectorAll('#bmg-modal-body li[data-arrow-target]')]
    .map(li => ({ li, target: document.getElementById(li.dataset.arrowTarget) }))
    .filter(p => p.target && p.target.getBoundingClientRect().width > 0);
  if (!pairs.length) return;

  document.body.classList.add('bmg-onboarding');

  const mr    = modal.getBoundingClientRect();
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  let paths = '';

  pairs.forEach(({ li, target }) => {
    target.classList.add('bmg-onboard-target');
    const tr  = target.getBoundingClientRect();
    const tcx = tr.left + tr.width / 2;
    const tcy = tr.top  + tr.height / 2;
    const lr  = li.getBoundingClientRect();

    // Start on the modal edge facing the target, aligned to the bullet's row
    // (for left/right exits) or to the target column (for top/bottom exits).
    const dx = tcx - (mr.left + mr.width / 2);
    const dy = tcy - (mr.top  + mr.height / 2);
    let sx, sy;
    if (Math.abs(dx) >= Math.abs(dy)) {
      sx = dx > 0 ? mr.right : mr.left;
      sy = clamp(lr.top + lr.height / 2, mr.top + 14, mr.bottom - 14);
    } else {
      sy = dy > 0 ? mr.bottom : mr.top;
      sx = clamp(tcx, mr.left + 14, mr.right - 14);
    }

    // End just outside the target edge facing the start. Ray-cast from the
    // target centre toward the start and find where it crosses the target's
    // bounding box, then step out a small gap. Using the box edge (not a
    // radius) keeps the arrow correct for wide targets like the search bar.
    const dirx = sx - tcx, diry = sy - tcy;
    const dl   = Math.hypot(dirx, diry) || 1;
    const ux   = dirx / dl, uy = diry / dl;
    const tX   = ux !== 0 ? (tr.width  / 2) / Math.abs(ux) : Infinity;
    const tY   = uy !== 0 ? (tr.height / 2) / Math.abs(uy) : Infinity;
    const edge = Math.min(tX, tY);
    const gap  = 12;
    const ex   = tcx + ux * (edge + gap);
    const ey   = tcy + uy * (edge + gap);

    // Gentle perpendicular bow on the control point.
    const mx = (sx + ex) / 2, my = (sy + ey) / 2;
    const segLen = Math.hypot(ex - sx, ey - sy) || 1;
    const nx = -(ey - sy) / segLen, ny = (ex - sx) / segLen;
    const bow = Math.min(60, segLen * 0.18);
    const cx = mx + nx * bow, cy = my + ny * bow;

    paths += `<path class="bmg-arrow-path" d="M ${sx.toFixed(1)} ${sy.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}" marker-end="url(#bmg-arrowhead)"/>`;
  });

  const svg = `<svg id="bmg-arrow-svg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="bmg-arrowhead" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
      </marker>
    </defs>${paths}</svg>`;
  overlay.insertAdjacentHTML('afterbegin', svg);
}

function bmgSetupModalHandlers() {
  // The info dialog is opened from the top-right toolbar "About" button
  // (InfoCtrl, wired in buildMapControls). The old bottom-right floating "i"
  // button was removed — it got covered by the side panel and zoom controls.
  document.getElementById('bmg-modal-close')?.addEventListener('click', bmgCloseModal);

  // Click on overlay (outside the inner modal box) closes
  document.getElementById('bmg-modal-overlay')?.addEventListener('click', (e) => {
    if (e.target.id === 'bmg-modal-overlay') bmgCloseModal();
  });

  // ESC key closes
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !document.getElementById('bmg-modal-overlay')?.classList.contains('hidden')) {
      bmgCloseModal();
    }
  });

  // Keep onboarding arrows aligned when the viewport changes while the welcome
  // modal is open (debounced to coalesce resize bursts).
  let _onboardResizeT = null;
  window.addEventListener('resize', () => {
    if (bmgModalMode !== 'welcome') return;
    clearTimeout(_onboardResizeT);
    _onboardResizeT = setTimeout(drawOnboardingArrows, 120);
  });

  // First-visit auto-show: tiny delay so the map renders behind it first
  const seen = (() => { try { return localStorage.getItem('bmg_welcome_seen'); } catch { return null; } })();
  if (seen !== WELCOME_VERSION) {
    setTimeout(bmgOpenWelcome, 600);
  }
}

// ═══════════════════════════════════════════════════════════

init();
bmgSetupModalHandlers();
</script>
</body>
</html>
