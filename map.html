    document.getElementById('panel-content').innerHTML = `
      ${navBackBtnHtml()}
      <div class="p-species-name" style="font-style:italic">${esc(taxonName)}</div>
      <div style="color:var(--text-muted);font-size:12px;margin-top:16px">Species climate data not yet available. Run the monthly data refresh workflow to generate it.</div>
    `;
    wireNavBackBtn();
    return;
  }
  const entry = data[taxonId];
  if (!entry) {
    document.getElementById('panel-content').innerHTML = `
      ${navBackBtnHtml()}
      <div class="p-species-name" style="font-style:italic">${esc(taxonName)}</div>
      <div style="color:var(--text-muted);font-size:12px;margin-top:16px">No precomputed climate data for this species yet (no observations with usable coordinates, or the data needs a refresh).</div>
    `;
    wireNavBackBtn();
    return;
  }
  if (inatSpeciesSidebarId !== taxonId) return;
  buildSpeciesSidebarContent(entry);
}

function buildSpeciesSidebarContent(entry) {
  if (speciesClimateChart) { speciesClimateChart.destroy(); speciesClimateChart = null; }
  if (speciesPhenoChart)   { speciesPhenoChart.destroy();   speciesPhenoChart   = null; }

  const photoHtml = entry.photo_url
    ? `<img class="sp-photo" src="${esc(entry.photo_url)}" loading="lazy" onerror="this.style.display='none'">`
    : `<div class="sp-photo-placeholder">🌿</div>`;

  // Headline climate stats
  const s       = entry.stats || {};
  const precMed = s.precip?.p50;
  const rhLo    = s.rhMean?.p25;
  const rhHi    = s.rhMean?.p75;
  const elev    = s.elev;
  // v4 data has daily-extreme tiers; older data (pre-refresh) does not.
  const hasTiers = s.hotLimit != null || s.coldLimit != null || s.avgHigh != null;

  // Temperature stat card (data-celsius lets the °F/°C toggle update it live).
  const tcard = (label, c, sub) => `
    <div class="sp-stat-card">
      <div class="sp-stat-label">${label}</div>
      <div class="sp-stat-value"${c != null ? ` data-celsius="${c}"` : ''}>${c != null ? toDisplay(c, tempUnit) : '—'}</div>
      <div class="sp-stat-sub">${sub}</div>
    </div>`;
  const rainCard = `<div class="sp-stat-card">
      <div class="sp-stat-label">Annual Rainfall</div>
      <div class="sp-stat-value">${precMed != null ? precMed + 'mm' : '—'}</div>
      <div class="sp-stat-sub">median across range</div></div>`;
  const humidCard = `<div class="sp-stat-card">
      <div class="sp-stat-label">Humidity</div>
      <div class="sp-stat-value">${rhLo != null && rhHi != null ? rhLo + '–' + rhHi + '%' : '—'}</div>
      <div class="sp-stat-sub">typical midrange</div></div>`;
  const elevCard = elev ? `<div class="sp-stat-card" style="grid-column:1/-1">
      <div class="sp-stat-label">Elevation range</div>
      <div class="sp-stat-value" style="font-size:16px">${elev.p10.toLocaleString()}–${elev.p90.toLocaleString()}<span class="climate-stat-unit"> m</span></div>
      <div class="sp-stat-sub">10th–90th pct across sites · full ${elev.min.toLocaleString()}–${elev.max.toLocaleString()} m</div></div>` : '';

  let statsHtml;
  if (hasTiers) {
    statsHtml = `<div class="sp-stats-grid">
      ${tcard('Avg Low',  s.avgLow,      'mean coldest-month low')}
      ${tcard('Avg High', s.avgHigh,     'mean hottest-month high')}
      ${tcard('Typical Cold Ext', s.coldTypical, 'avg of sites’ p10 daily low')}
      ${tcard('Typical Hot Ext',  s.hotTypical,  'avg of sites’ p90 daily high')}
      ${tcard('Cold Limit', s.coldLimit, 'p10 daily low, p10 across sites')}
      ${tcard('Heat Limit', s.hotLimit,  'p90 daily high, p90 across sites')}
      ${rainCard}
      ${humidCard}
      ${elevCard}
    </div>`;
  } else {
    // Legacy layout for data generated before the v4 refresh.
    statsHtml = `<div class="sp-stats-grid">
      ${tcard('Cold limit', s.tempMin?.p10, '10th pct annual min')}
      ${tcard('Heat limit', s.tempMax?.p90, '90th pct annual max')}
      ${rainCard}
      ${humidCard}
    </div>`;
  }

  // Chart section — hemisphere availability for this species.
  // The data file may contain monthly_nh, monthly_sh, or both. Toggle is only
  // shown when both exist; otherwise we force-display whichever hemisphere has
  // data so SH-only species (e.g. most Australian Drosera) don't render blank
  // when speciesHemi defaults to 'nh' from a prior species's selection.
  const hasNH   = !!entry.monthly_nh;
  const hasSH   = !!entry.monthly_sh;
  const hasBoth = hasNH && hasSH;
  if (!hasNH)      speciesHemi = 'sh';   // SH-only → force SH
  else if (!hasSH) speciesHemi = 'nh';   // NH-only → force NH
  // (when both exist, preserve the user's previous selection)

  // Helpers below close over `entry`, `hasBoth`, and `isTropical` from the
  // surrounding render scope. State (speciesHemi, speciesShiftSH) is module-
  // level so it persists across species navigations.
  const isTropical = isSpeciesTropical(entry.scientific_name);

  const rotateMonthsBy6 = (monthly) => {
    // Rotate each 12-element monthly array by +6 positions. Symmetric: for SH
    // source data this puts SH-July (winter) at the Jan slot (NH-aligned view);
    // for NH source data it puts NH-July (summer) at the Jan slot (SH calendar
    // view). The button below is offered for both because users may want either
    // direction depending on their own location.
    if (!monthly) return monthly;
    const out = {};
    for (const k of Object.keys(monthly)) {
      const arr = monthly[k];
      out[k] = (Array.isArray(arr) && arr.length === 12)
        ? arr.map((_, i) => arr[(i + 6) % 12])
        : arr;
    }
    return out;
  };
  const getDisplayMonthly = () => {
    const base = speciesHemi === 'sh' ? entry.monthly_sh : entry.monthly_nh;
    return speciesShiftSH ? rotateMonthsBy6(base) : base;
  };
  const getChartTitle = () => {
    const hemiLabel = speciesHemi === 'sh' ? 'Southern hemisphere' : null;
    const shiftLabel = speciesShiftSH
      ? (speciesHemi === 'sh' ? 'NH-aligned' : 'SH-aligned')
      : null;
    const parts = [hemiLabel, shiftLabel].filter(Boolean);
    return parts.length ? `Monthly climate (${parts.join(', ')})` : 'Monthly climate';
  };
  const baseNote = 'Temperatures corrected for elevation (6.5°C/1000m lapse rate). Precipitation and humidity are uncorrected.';
  const getChartNote = () => speciesShiftSH
    ? baseNote + ` Months shifted by +6 to view in the ${speciesHemi === 'sh' ? 'Northern' : 'Southern'} Hemisphere calendar.`
    : baseNote;

  const buildActionsHtml = () => {
    // Seasonal-shift toggle: shown for any non-tropical species (median
    // |lat| > 23.5°), regardless of which hemisphere is displayed. The button
    // simply rotates the chart by +6 months; what that means depends on the
    // hemisphere being viewed:
    //   - SH data shifted → NH-aligned (cultivator's calendar)
    //   - NH data shifted → SH-aligned (opposite-hemisphere view)
    // Hidden for tropical species since the seasonal cycle is weak and
    // shifting produces a near-identical chart.
    const shiftTitle = speciesHemi === 'sh'
      ? 'Shift Southern hemisphere months by +6 to align with the Northern hemisphere calendar (useful for NH-based cultivators planning a growing cycle).'
      : 'Shift Northern hemisphere months by +6 to view in the Southern hemisphere calendar.';
    const shiftBtn = !isTropical
      ? `<button class="sp-hemi-btn${speciesShiftSH ? ' active-sh' : ''}" id="sp-shift-toggle" title="${shiftTitle}">Hemisphere Swap ⇄</button>`
      : '';
    // Hemisphere toggle only present when both hemispheres have data.
    const hemiBtn = hasBoth
      ? `<button class="sp-hemi-btn${speciesHemi === 'sh' ? ' active-sh' : ''}" id="sp-hemi-toggle">${speciesHemi === 'sh' ? 'Northern ⇄' : 'Southern ⇄'}</button>`
      : '';
    return shiftBtn + hemiBtn;
  };

  const chartHtml = `
    <div class="sp-chart-section">
      <div class="sp-chart-header">
        <span class="sp-chart-title" id="sp-chart-title-text">${getChartTitle()}</span>
        <div class="sp-chart-actions" id="sp-chart-actions">${buildActionsHtml()}</div>
      </div>
      <div id="sp-chart-container"><canvas id="sp-climate-chart"></canvas></div>
      <div class="sp-chart-note" id="sp-chart-note">${getChartNote()}</div>
    </div>`;

  // Köppen zone distribution
  const koppenEntries = entry.koppen || [];
  const koppenTotal   = koppenEntries.reduce((s, [, c]) => s + c, 0);
  const MAX_KP        = 8;

  const koppenRowsHtml = (arr) => arr.map(([zone, count]) => {
    const info = BECK_ZONES[zone] || {};
    const pct  = koppenTotal ? Math.round(count / koppenTotal * 100) : 0;
    const [r,g,b] = BECK_COLORS[zone] || [128,128,128];
    return `<div class="sp-koppen-row">
      <span class="badge badge-koppen" style="color:rgb(${r},${g},${b});border-color:rgba(${r},${g},${b},0.3);background:rgba(${r},${g},${b},0.1);min-width:32px;text-align:center;font-size:10px">${info.code || zone}</span>
      <span class="sp-koppen-name">${esc(info.desc || 'Unknown')} <span style="font-size:10px">${esc(info.group || '')}</span></span>
      <span class="sp-koppen-pct">${pct}%</span>
    </div>`;
  }).join('');

  const koppenHtml = `
    <details class="inat-section" open>
      <summary><span class="bmg-section-icon">${BMG_ICONS.globe}</span>Climate zones (${koppenEntries.length})</summary>
      <div class="inat-section-body">
        <div id="sp-koppen-body">${koppenRowsHtml(koppenEntries.slice(0, MAX_KP))}</div>
        ${koppenEntries.length > MAX_KP
          ? `<div id="sp-koppen-ctrl"><button class="sp-expand-btn" id="sp-koppen-btn">Show all ${koppenEntries.length} zones ↓</button></div>`
          : ''}
      </div>
    </details>`;

  // Wikipedia excerpt
  const wiki    = entry.wikipedia_summary || '';
  const wikiUrl = entry.inat_url || '';
  let wikiHtml  = '';
  if (wiki) {
    const sentences = wiki.match(/[^.!?]+[.!?]+\s*/g) || [];
    const preview   = sentences.slice(0, 2).join('').trim();
    const truncated = wiki.length > preview.length + 10;
    wikiHtml = `
      <details class="inat-section">
        <summary>📖 About this species</summary>
        <div class="inat-section-body">
          <div class="sp-wiki-text" id="sp-wiki-text">${esc(preview)}${truncated ? '…' : ''}</div>
          ${truncated ? `<button class="sp-expand-btn" id="sp-wiki-expand" style="margin-top:8px">Read more ↓</button>` : ''}
          ${wikiUrl ? `<a class="inat-view-link" href="${esc(wikiUrl)}" target="_blank" rel="noopener" style="display:inline-flex;margin-top:10px">View on iNaturalist →</a>` : ''}
        </div>
      </details>`;
  }

  const nCells = entry.sample_count || 0;
  const lowSample = nCells < 3;
  const sampleNote = `<div class="sp-sample-note">
    Climate envelope from ${nCells.toLocaleString()} representative location${nCells === 1 ? '' : 's'}
    (one per occupied 0.5° grid cell), drawn from ${entry.obs_count.toLocaleString()} total sighting${entry.obs_count === 1 ? '' : 's'}.
    ${lowSample ? `<span style="display:block;margin-top:4px;color:#d9a441">⚠ Small sample (${nCells} location${nCells === 1 ? '' : 's'}) — treat as indicative only. With so few sites the across-site limits collapse toward a single place.</span>` : ''}
  </div>`;

  // ── All Observations section (lazy-loaded list of iNat obs for this species) ──
  // Filtered from the already-loaded inatObs array. Lazy-rendered on first
  // expand of the <details>. Pagination via "Load more" — long-tail species
  // like Drosera have 160k+ obs and we can't dump them all into the DOM.
  const speciesObsAll = (inatObs?.length && inatTaxa?.length)
    ? inatObs.filter(o => inatTaxa[o[OBS_TI]]?.[1] === entry.scientific_name && obsPassesDate(o))
    : [];

  const obsSectionHtml = `
    <details class="inat-section" id="sp-obs-section" style="margin-top:8px">
      <summary><span class="bmg-section-icon">${BMG_ICONS.eye}</span>All Observations (${speciesObsAll.length.toLocaleString()})</summary>
      <div class="inat-section-body">
        ${speciesObsAll.length === 0 ? `
          <div class="sp-obs-empty">No observations loaded. Enable the iNaturalist layer (right-side panel) to load this data.</div>
        ` : `
          ${speciesObsAll.some(o => o[OBS_FLAGS] & F_PHOTO)
            ? `<button class="gallery-open-btn" id="sp-gallery-btn">${BMG_ICONS.grid} Photo Gallery (${speciesObsAll.filter(o => o[OBS_FLAGS] & F_PHOTO).length.toLocaleString()})</button>`
            : ''}
          <div class="sp-obs-controls">
            <label for="sp-obs-sort">Sort</label>
            <select id="sp-obs-sort">
              <option value="date-desc">Newest first</option>
              <option value="date-asc">Oldest first</option>
              <option value="photo">With photos first</option>
              <option value="quality">Research grade first</option>
              <option value="lat-n">Latitude (N → S)</option>
              <option value="lat-s">Latitude (S → N)</option>
            </select>
          </div>
          <div class="inat-obs-list" id="sp-obs-list"></div>
        `}
      </div>
    </details>`;

  // Assemble and inject
  const inatUrl = entry.inat_url || '';
  document.getElementById('panel-content').innerHTML = `
    ${navBackBtnHtml()}
    <div class="sp-header">
      ${photoHtml}
      <div class="sp-header-text">
        <div class="sp-scientific-name">${esc(entry.scientific_name)}</div>
        ${entry.common_name ? `<div class="sp-common-name">${esc(entry.common_name)}</div>` : ''}
        <div class="sp-meta">${entry.obs_count.toLocaleString()} sightings${inatUrl ? ` · <a href="${esc(inatUrl)}" target="_blank" rel="noopener">iNaturalist →</a>` : ''}</div>
      </div>
    </div>
    ${copyLinkBtnHtml('sp', entry.taxon_id, 'sp-copy-link')}
    ${statsHtml}
    ${chartHtml}
    ${speciesMethodologyHtml(entry)}
    ${buildSpeciesPhenologySection(entry)}
    ${koppenHtml}
    ${wikiHtml}
    ${sampleNote}
    ${obsSectionHtml}
  `;
  wireNavBackBtn();
  wireCopyLinkButtons(document.getElementById('panel-content'));
  if (entry.taxon_id != null) setDeepLink('sp', entry.taxon_id);

  // ── Wire All-Observations section ──
  // Lazy-render: filter the per-species obs (already computed above) and
  // sort+paginate on first expand. Sort changes re-render from offset 0.
  if (speciesObsAll.length > 0) {
    const SP_OBS_PAGE = 20;
    let sortedSpeciesObs = speciesObsAll;   // re-assigned by sortBy()
    let obsRendered = false;

    function sortSpeciesObsBy(mode) {
      const arr = [...speciesObsAll];
      if (mode === 'date-desc')      arr.sort((a, b) => (b[OBS_DATE] || '').localeCompare(a[OBS_DATE] || ''));
      else if (mode === 'date-asc')  arr.sort((a, b) => (a[OBS_DATE] || '').localeCompare(b[OBS_DATE] || ''));
      else if (mode === 'photo')     arr.sort((a, b) => ((b[OBS_FLAGS] & F_PHOTO) - (a[OBS_FLAGS] & F_PHOTO)) || (b[OBS_DATE] || '').localeCompare(a[OBS_DATE] || ''));
      else if (mode === 'quality')   arr.sort((a, b) => ((a[OBS_FLAGS] & F_NEEDSID) - (b[OBS_FLAGS] & F_NEEDSID)) || (b[OBS_DATE] || '').localeCompare(a[OBS_DATE] || ''));
      else if (mode === 'lat-n')     arr.sort((a, b) => b[OBS_LAT] - a[OBS_LAT]);
      else if (mode === 'lat-s')     arr.sort((a, b) => a[OBS_LAT] - b[OBS_LAT]);
      return arr;
    }

    // Card variant for the species view — shows location coords + Köppen
    // badge instead of taxon name (which is redundant on a single-species
    // list). Uses raw obs array directly (not a feature wrapper).
    function speciesObsCard(o, idx) {
      const hasPhoto = !!(o[OBS_FLAGS] & F_PHOTO);
      const photoEl  = hasPhoto && o[OBS_PHOTO]
        ? inatThumbImg(o[OBS_PHOTO], 'inat-obs-thumb')
        : `<div class="inat-obs-thumb-placeholder">🌿</div>`;
      const qBadge = (o[OBS_FLAGS] & F_NEEDSID)
        ? `<span class="inat-badge inat-badge-nid">Needs ID</span>`
        : `<span class="inat-badge inat-badge-rg">Research</span>`;
      const obscBadge = (o[OBS_FLAGS] & F_OBSCURED) ? `<span class="inat-badge inat-badge-obs">Approx.</span>` : '';
      const lat = o[OBS_LAT], lng = o[OBS_LNG];
      const locStr = `${Math.abs(lat).toFixed(2)}°${lat >= 0 ? 'N' : 'S'}, ${Math.abs(lng).toFixed(2)}°${lng >= 0 ? 'E' : 'W'}`;
      const kop = o[OBS_KOP];
      let kopBadge = '';
      if (kop >= 1 && kop <= 30) {
        const zone = BECK_ZONES[kop];
        const [r, g, b] = BECK_COLORS[kop] || [128, 128, 128];
        kopBadge = `<span class="inat-badge" style="color:rgb(${r},${g},${b});border:1px solid rgba(${r},${g},${b},0.35);background:rgba(${r},${g},${b},0.1)">${zone?.code || ''}</span>`;
      }
      return `<div class="inat-obs-card" data-idx="${idx}">
        ${photoEl}
        <div class="inat-obs-meta">
          <div class="inat-obs-date">${o[OBS_DATE] || '—'}</div>
          <div class="sp-obs-location">${locStr}</div>
          <div class="inat-obs-badges">${qBadge}${obscBadge}${kopBadge}</div>
        </div>
      </div>`;
    }

    function renderSpeciesObsCards(offset = 0) {
      const listEl = document.getElementById('sp-obs-list');
      if (!listEl) return;
      const page    = sortedSpeciesObs.slice(offset, offset + SP_OBS_PAGE);
      const hasMore = sortedSpeciesObs.length > offset + SP_OBS_PAGE;
      const cardsHtml = page.map((o, i) => speciesObsCard(o, offset + i)).join('');

      document.getElementById('sp-obs-load-more')?.remove();
      if (offset === 0) listEl.innerHTML = cardsHtml;
      else              listEl.insertAdjacentHTML('beforeend', cardsHtml);

      if (hasMore) {
        listEl.insertAdjacentHTML('afterend',
          `<button class="inat-load-more" id="sp-obs-load-more" data-offset="${offset + SP_OBS_PAGE}">Load more (${(sortedSpeciesObs.length - offset - SP_OBS_PAGE).toLocaleString()} remaining)</button>`);
        document.getElementById('sp-obs-load-more').addEventListener('click', e => {
          renderSpeciesObsCards(parseInt(e.target.dataset.offset));
        });
      }
    }

    // First-expand renders; sort changes re-render from offset 0
    document.getElementById('sp-obs-section')?.addEventListener('toggle', function () {
      if (!this.open || obsRendered) return;
      obsRendered = true;
      sortedSpeciesObs = sortSpeciesObsBy('date-desc');
      renderSpeciesObsCards(0);
    });
    document.getElementById('sp-obs-sort')?.addEventListener('change', e => {
      sortedSpeciesObs = sortSpeciesObsBy(e.target.value);
      renderSpeciesObsCards(0);
    });
    document.getElementById('sp-gallery-btn')?.addEventListener('click', () => {
      openPhotoGallery(
        speciesObsAll.map(galleryDescFromObs),
        entry.scientific_name,
        { label: esc(entry.scientific_name), restore: () => openSpeciesSidebar(entry.taxon_id, entry.scientific_name) }
      );
    });

    // Delegated click handler for opening the observation detail panel.
    // Converts raw obs back to the feature shape openInatObsPanel expects.
    // Pushes the species sidebar onto the nav stack so back returns here.
    document.getElementById('sp-obs-list')?.addEventListener('click', e => {
      const card = e.target.closest('.inat-obs-card');
      if (!card) return;
      const idx = parseInt(card.dataset.idx);
      const o   = sortedSpeciesObs[idx];
      if (!o) return;
      const taxon = inatTaxa[o[OBS_TI]] || [];
      const feature = {
        geometry: { coordinates: [o[OBS_LNG], o[OBS_LAT]] },
        properties: {
          obs_id:      o[OBS_ID],
          lat:         o[OBS_LAT],
          lng:         o[OBS_LNG],
          taxon_idx:   o[OBS_TI],
          taxon_name:  taxon[1] || entry.scientific_name,
          common_name: entry.common_name || null,
          date:        o[OBS_DATE],
          flags:       o[OBS_FLAGS],
          photo_id:    o[OBS_PHOTO],
          koppen:      o[OBS_KOP],
          genus:       taxon[2] || entry.genus,
        },
      };
      navPush({
        label:   esc(entry.scientific_name),
        restore: () => openSpeciesSidebar(entry.taxon_id, entry.scientific_name),
      });
      openInatObsPanel(feature);
    });
  }


  // Single re-render path used by both the hemisphere toggle and the SH-shift
  // toggle. Rebuilds the actions buttons (the shift toggle appears/disappears
  // with hemisphere changes), refreshes title + note text, and redraws the
  // chart with the appropriate monthly data.
  const rerenderChartUI = () => {
    const titleEl   = document.getElementById('sp-chart-title-text');
    const noteEl    = document.getElementById('sp-chart-note');
    const actionsEl = document.getElementById('sp-chart-actions');
    if (titleEl)   titleEl.textContent  = getChartTitle();
    if (noteEl)    noteEl.textContent   = getChartNote();
    if (actionsEl) actionsEl.innerHTML  = buildActionsHtml();
    bindChartActionHandlers();
    buildSpeciesClimateChart(getDisplayMonthly());
    // Phenology histogram shares the hemisphere/swap state, so redraw it too.
    if (document.getElementById('sp-pheno-chart')) buildSpeciesPhenoChart(entry);
  };

  function bindChartActionHandlers() {
    document.getElementById('sp-hemi-toggle')?.addEventListener('click', () => {
      speciesHemi = speciesHemi === 'nh' ? 'sh' : 'nh';
      rerenderChartUI();
    });
    document.getElementById('sp-shift-toggle')?.addEventListener('click', () => {
      speciesShiftSH = !speciesShiftSH;   // session-only; intentionally not persisted
      rerenderChartUI();
    });
  }

  // Initial render — actions are already in the DOM from chartHtml above; just
  // wire the handlers and draw the chart.
  bindChartActionHandlers();
  buildSpeciesClimateChart(getDisplayMonthly());

  // Phenology histogram + metric dropdown (present only when data exists).
  if (document.getElementById('sp-pheno-chart')) {
    buildSpeciesPhenoChart(entry);
    document.getElementById('sp-pheno-metric')?.addEventListener('change', e => {
      speciesPhenoMetric = e.target.value;
      buildSpeciesPhenoChart(entry);
    });
  }

  // Köppen expand/collapse
  let koppenExpanded = false;
  function renderKoppenItems() {
    const body = document.getElementById('sp-koppen-body');
    if (!body) return;
    body.innerHTML = koppenRowsHtml(koppenExpanded ? koppenEntries : koppenEntries.slice(0, MAX_KP));
    const ctrl = document.getElementById('sp-koppen-ctrl');
    if (ctrl) {
      const btn = ctrl.querySelector('#sp-koppen-btn');
      if (btn) {
        btn.textContent = koppenExpanded ? 'Show fewer ↑' : `Show all ${koppenEntries.length} zones ↓`;
        btn.onclick = () => { koppenExpanded = !koppenExpanded; renderKoppenItems(); };
      }
    }
  }
  if (koppenEntries.length > MAX_KP) {
    document.getElementById('sp-koppen-btn')?.addEventListener('click', () => {
      koppenExpanded = !koppenExpanded;
      renderKoppenItems();
    });
  }

  // Wikipedia expand
  if (wiki) {
    document.getElementById('sp-wiki-expand')?.addEventListener('click', () => {
      const el  = document.getElementById('sp-wiki-text');
      const btn = document.getElementById('sp-wiki-expand');
      if (el) el.textContent = wiki;
      if (btn) btn.remove();
    });
  }
}

// ── Species phenology (blooming period) histogram ────────────────────────────
const PHENO_META = {
  flowering: { label: 'Flowering',      color: 'rgba(232,62,140,0.65)',  border: 'rgba(232,62,140,0.9)'  },
  budding:   { label: 'Flower buds',    color: 'rgba(120,180,70,0.65)',  border: 'rgba(120,180,70,0.9)'  },

// Section markup — only emitted when the species has phenology data. Falls the
// active metric back to the first available one if flowering is absent.
function buildSpeciesPhenologySection(entry) {
  const ph = entry.phenology;
  if (!ph) return '';
  const order = ['flowering', 'budding', 'fruiting'];
  const available = order.filter(k => ph[k] && (ph[k].nh || ph[k].sh));
  if (!available.length) return '';
  if (!available.includes(speciesPhenoMetric)) speciesPhenoMetric = available[0];
  const options = available.map(k =>
    `<option value="${k}"${k === speciesPhenoMetric ? ' selected' : ''}>${PHENO_META[k].label}</option>`).join('');
  return `<details class="inat-section" open id="sp-pheno-section">
    <summary><span class="bmg-section-icon">${BMG_ICONS.leaf}</span>Phenology (iNat annotations)</summary>
    <div class="inat-section-body">
      <div class="sp-pheno-controls">
        <label class="sp-pheno-lbl">Show</label>
        <select id="sp-pheno-metric" class="sp-pheno-select">${options}</select>
      </div>
      <div class="sp-chart-section" style="margin-top:8px">
        <div id="sp-pheno-container" style="position:relative;height:150px"><canvas id="sp-pheno-chart"></canvas></div>
        <div class="sp-chart-note" id="sp-pheno-note"></div>
      </div>
    </div>
  </details>`;
}

function buildSpeciesPhenoChart(entry) {
  if (speciesPhenoChart) { speciesPhenoChart.destroy(); speciesPhenoChart = null; }
  const ctx = document.getElementById('sp-pheno-chart');
  const noteEl = document.getElementById('sp-pheno-note');
  if (!ctx) return;
  const meta = PHENO_META[speciesPhenoMetric] || PHENO_META.flowering;
  const series = entry.phenology?.[speciesPhenoMetric]?.[speciesHemi];

  if (!series) {
    if (noteEl) noteEl.textContent = `No wild ${meta.label.toLowerCase()} annotations in the ${speciesHemi === 'sh' ? 'Southern' : 'Northern'} hemisphere for this species.`;
    return;
  }

  // Align the month axis with the climate chart: apply the Hemisphere Swap and
  // the SH display rotation in the same order, and use the same month labels.
  let data = series.slice();
  if (speciesShiftSH)        data = [...data.slice(6), ...data.slice(0, 6)];
  if (speciesHemi === 'sh')  data = [...data.slice(6), ...data.slice(0, 6)];
  const SH_MONTHS = ['Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun'];
  const labels = speciesHemi === 'sh' ? SH_MONTHS : MONTHS;
  const total = series.reduce((a, b) => a + b, 0);

  speciesPhenoChart = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{
      label: meta.label, data,
      backgroundColor: meta.color, borderColor: meta.border, borderWidth: 1,
    }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#161b22', borderColor: '#30363d', borderWidth: 1,
          titleColor: '#e6edf3', bodyColor: '#8b949e',
          callbacks: { label: c => `${c.raw} obs annotated ${meta.label.toLowerCase()}` },
        },
      },
      scales: {
        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' },
             ticks: { color: 'rgba(255,255,255,0.45)', font: { size: 10 }, precision: 0 } },
        x: { grid: { display: false },
             ticks: { color: 'rgba(255,255,255,0.45)', font: { size: 10 } } },
      },
    },
  });

  if (noteEl) {
    noteEl.textContent = `${total.toLocaleString()} wild observations annotated “${meta.label}” on iNaturalist ` +
      `(${speciesHemi === 'sh' ? 'Southern' : 'Northern'} hemisphere). Community phenology annotations — ` +
      `reflects when people observe & record this stage, not an authoritative botanical record.`;
  }
}

function buildSpeciesClimateChart(monthly) {
  if (speciesClimateChart) { speciesClimateChart.destroy(); speciesClimateChart = null; }
  if (speciesPhenoChart)   { speciesPhenoChart.destroy();   speciesPhenoChart   = null; }
  const ctx = document.getElementById('sp-climate-chart');
  if (!ctx || !monthly) return;

  // p-index: 0=p25, 1=p50, 2=p75
  const pick = (arr, pi) => {
    if (!arr) return new Array(12).fill(null);
    let data = arr.map(v => v ? v[pi] : null);
    if (speciesHemi === 'sh') data = [...data.slice(6), ...data.slice(0, 6)];
    return data;
  };
  // Scalar per-month picker (for the new daily-extreme arrays, which are
  // single-value per month, not [p25,p50,p75] triples).
  const pickScalar = (arr) => {
    if (!arr) return new Array(12).fill(null);
    let data = arr.slice();
    if (speciesHemi === 'sh') data = [...data.slice(6), ...data.slice(0, 6)];
    return data;
  };

  const SH_MONTHS = ['Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun'];
  const labels = speciesHemi === 'sh' ? SH_MONTHS : MONTHS;

  // Prefer the daily-extreme band (median across cells of each cell's p90
  // daily-high and p10 daily-low) when available — that's a more meaningful
  // "what extremes does this plant deal with" signal than the cross-cell
  // p25/p75 spread. Falls back to the p25/p75 envelope for species generated
  // before climate-cache.json v3 OR mid-upgrade species where none of their
  // cells have been re-fetched yet (the per-cell upgrade is incremental, so
  // species are a mix of upgraded + not-yet cells during the rollout).
  const hasDailyExtremes = !!(
    monthly.tempMaxHi?.some(v => v != null) &&
    monthly.tempMinLo?.some(v => v != null)
  );
  const bandTopData = hasDailyExtremes ? pickScalar(monthly.tempMaxHi) : pick(monthly.tempMax, 2);
  const bandBotData = hasDailyExtremes ? pickScalar(monthly.tempMinLo) : pick(monthly.tempMin, 0);

  speciesClimateChart = new Chart(ctx, {
    data: {
      labels,
      datasets: [
        { // band top — invisible border, fills downward to dataset[1]
          type: 'line', label: hasDailyExtremes ? 'Typical hot extreme' : '_top',
          data: bandTopData,
          borderWidth: hasDailyExtremes ? 1 : 0,
          borderColor: hasDailyExtremes ? 'rgba(255,140,60,0.30)' : 'transparent',
          borderDash:  hasDailyExtremes ? [4, 3] : [],
          backgroundColor: hasDailyExtremes ? 'rgba(255,140,60,0.10)' : 'rgba(150,160,200,0.13)',
          fill: '+1', tension: 0.4, pointRadius: 0, yAxisID: 'yTemp',
        },
        { // band bottom — base of fill
          type: 'line', label: hasDailyExtremes ? 'Typical cold extreme' : '_bot',
          data: bandBotData,
          borderWidth: hasDailyExtremes ? 1 : 0,
          borderColor: hasDailyExtremes ? 'rgba(100,180,255,0.30)' : 'transparent',
          borderDash:  hasDailyExtremes ? [4, 3] : [],
          backgroundColor: 'transparent',
          fill: false, tension: 0.4, pointRadius: 0, yAxisID: 'yTemp',
        },
        {
          type: 'line', label: 'Avg High',
          data: pick(monthly.tempMax, 1),  // p50 of tempMax
          borderColor: 'rgba(255,140,60,0.85)', backgroundColor: 'transparent',
          fill: false, tension: 0.4, pointRadius: 2, pointHoverRadius: 5, yAxisID: 'yTemp',
        },
        {
          type: 'line', label: 'Avg Low',
          data: pick(monthly.tempMin, 1),  // p50 of tempMin
          borderColor: 'rgba(100,180,255,0.85)', backgroundColor: 'transparent',
          fill: false, tension: 0.4, pointRadius: 2, pointHoverRadius: 5, yAxisID: 'yTemp',
        },
        {
          type: 'bar', label: 'Precip',
          data: pick(monthly.precip, 1),   // p50 of precip
          backgroundColor: 'rgba(80,160,240,0.45)',
          borderColor: 'rgba(80,160,240,0.7)', borderWidth: 1, yAxisID: 'yPrecip',
        },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          labels: {
            color: 'rgba(255,255,255,0.55)', font: { size: 11 }, boxWidth: 12,
            filter: item => !item.text.startsWith('_'),
          }
        },
        tooltip: {
          backgroundColor: '#161b22', borderColor: '#30363d', borderWidth: 1,
          titleColor: '#e6edf3', bodyColor: '#8b949e',
          filter: item => !item.dataset.label.startsWith('_'),
          callbacks: {
            label(ctx) {
              // Nearest mm is plenty for cultivation guidance; decimals add
              // noise without information.
              if (ctx.dataset.label === 'Precip') return `Precip: ${ctx.raw != null ? Math.round(ctx.raw) + 'mm' : '—'}`;
              return `${ctx.dataset.label}: ${toDisplay(ctx.raw, tempUnit)}`;
            }
          }
        }
      },
      scales: {
        yTemp: {
          type: 'linear', position: 'left',
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: { color: 'rgba(255,255,255,0.45)', font: { size: 10 }, callback: v => toDisplay(v, tempUnit) }
        },
        yPrecip: {
          type: 'linear', position: 'right',
          grid: { drawOnChartArea: false },
          ticks: { color: 'rgba(80,160,240,0.65)', font: { size: 10 }, callback: v => Math.round(v) + 'mm' }
        },
        x: {
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: { color: 'rgba(255,255,255,0.45)', font: { size: 10 } }
        }
      }
    }
  });
}

function selectInatTaxon(result) {
  const { taxonName, count } = result;
  document.getElementById('search-input').value = taxonName;
  document.getElementById('search-clear').classList.add('visible');
  document.getElementById('search-suggestions').classList.remove('open');
  searchCurrentSuggestions = [];

  // Enable iNat layer if it's off
  if (!inatVisible) enableInatLayer();

  // Apply species filter and rebuild clusters
  inatSpeciesFilter = taxonName;
  searchInatTaxa._counts = null; // allow recount after filter change
  rebuildInatIndex();

  // Fit map to this species' observations
  const pts = [];
  const nameMatch = inatTaxa.findIndex(t => t[1] === taxonName);
  for (const o of inatObs) {
    if (inatTaxa[o[OBS_TI]]?.[1] === taxonName) pts.push([o[OBS_LAT], o[OBS_LNG]]);
  }
  if (pts.length) {
    map.fitBounds(L.latLngBounds(pts), { padding: [50, 50], maxZoom: 9, animate: true, duration: 1.0 });
  }

  // Open species sidebar (async — loads species-data.json lazily)

}

// ── Admin-region observation filter ───────────────────────────────────────
// Selecting a state/province/country etc. fetches its boundary polygon and
// restricts the visible observations to inside that border (precise PIP).

// Convert a GeoJSON Polygon/MultiPolygon geometry to a flat array of rings
// ([[ [lng,lat], ... ], ...]) for pointInRings.
function geomToRings(geom) {
  if (!geom) return null;
  if (geom.type === 'Polygon')      return geom.coordinates;                 // [ring, hole...]
  if (geom.type === 'MultiPolygon') return geom.coordinates.flat();          // each poly's rings
  return null;
}

async function selectRegionResult(result) {
  const name = result.display_name.split(',').slice(0, 2).map(s => s.trim()).join(', ');
  document.getElementById('search-input').value = result.display_name.split(',')[0];
  document.getElementById('search-clear').classList.add('visible');
  document.getElementById('search-suggestions').classList.remove('open');
  searchCurrentSuggestions = [];
  if (inatSpeciesFilter) { inatSpeciesFilter = null; searchInatTaxa._counts = null; }
  if (!inatVisible) enableInatLayer();
  setRegionChip(name, null, true);   // loading state

  // Fetch the boundary polygon via Nominatim lookup (osm_type+osm_id).
  const osmRef = `${(result.osm_type || '')[0].toUpperCase()}${result.osm_id}`;
  let rings = null, bbox = null;
  try {
    const url = `https://nominatim.openstreetmap.org/lookup?osm_ids=${osmRef}&format=json&polygon_geojson=1&polygon_threshold=0.005`;
    const r = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    const d = r.ok ? await r.json() : [];
    const hit = d && d[0];
    if (hit) {
      rings = geomToRings(hit.geojson);
      if (hit.boundingbox) {
        const bb = hit.boundingbox.map(Number);   // [south, north, west, east]
        bbox = [bb[0], bb[1], bb[2], bb[3]];
      }
    }
  } catch { /* fall through to bbox-only below */ }

  // Fallback to the search result's bbox if the polygon lookup failed.
  if (!bbox && result.boundingbox) {
    const bb = result.boundingbox.map(Number);
    bbox = [bb[0], bb[1], bb[2], bb[3]];
  }
  if (!bbox) { clearRegionFilter(); return; }

  inatRegionFilter = { name, bbox, rings, osmRef };
  rebuildInatIndex();
  const count = countRegionObs();
  setRegionChip(name, count, false);

  // Close any open side panel first (it clears deep-link params), THEN set the
  // region deep link so it isn't immediately clobbered.
  closeLocationPanel();
  setDeepLink('region', osmRef);

  // Frame the region.
  map.fitBounds(L.latLngBounds([[bbox[0], bbox[2]], [bbox[1], bbox[3]]]),
                { padding: [40, 40], animate: true });
}

// Re-create a region filter from a ?region=<osmRef> deep link.
async function applyRegionFromOsmRef(osmRef) {
  if (!inatVisible) enableInatLayer();
  setRegionChip('Loading region…', null, true);
  try {
    const url = `https://nominatim.openstreetmap.org/lookup?osm_ids=${osmRef}&format=json&polygon_geojson=1&polygon_threshold=0.005&addressdetails=1`;
    const r = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    const d = r.ok ? await r.json() : [];
    const hit = d && d[0];
    if (!hit) { clearRegionFilter(); return; }
    const name = hit.display_name.split(',').slice(0, 2).map(s => s.trim()).join(', ');
    const bb = hit.boundingbox.map(Number);
    inatRegionFilter = { name, bbox: [bb[0], bb[1], bb[2], bb[3]], rings: geomToRings(hit.geojson), osmRef };
    map.fitBounds(L.latLngBounds([[bb[0], bb[2]], [bb[1], bb[3]]]), { padding: [40, 40], animate: true });
    // On a fresh deep-link load the obs data may still be loading — wait for it
    // so the chip count and the rebuilt index reflect the full dataset.
    await whenInatObsReady();
    if (!inatRegionFilter || inatRegionFilter.osmRef !== osmRef) return;  // user changed it
    rebuildInatIndex();
    setRegionChip(name, countRegionObs(), false);
  } catch { clearRegionFilter(); }
}

// Resolve once the iNat observation array is populated (deep links can run
// before the data finishes loading). Polls briefly, then gives up gracefully.
function whenInatObsReady(timeoutMs = 20000) {
  return new Promise(resolve => {
    if (inatObs.length) return resolve(true);
    const t0 = Date.now();
    const iv = setInterval(() => {
      if (inatObs.length || Date.now() - t0 > timeoutMs) { clearInterval(iv); resolve(inatObs.length > 0); }
    }, 200);
  });
}

// Count observations passing the current region (+ genus/quality) filters.
function countRegionObs() {
  let n = 0;
  for (const o of inatObs) {
    const taxon = inatTaxa[o[OBS_TI]];
    if (!taxon) continue;
    if (!inatFilters.genera.has(taxon[2])) continue;
    if ((o[OBS_FLAGS] & F_NEEDSID) && !inatFilters.needsId) continue;
    if (passesRegionFilter(o[OBS_LAT], o[OBS_LNG])) n++;
  }
  return n;
}

function clearRegionFilter(rebuild = true) {
  inatRegionFilter = null;
  setRegionChip(null);
  if (rebuild) rebuildInatIndex();
  // Only drop the URL param if it's the active deep link.
  const p = new URLSearchParams(location.search);
  if (p.get('region')) setDeepLink(null);
}

function setRegionChip(name, count, loading) {
  const chip = document.getElementById('region-chip');
  if (!chip) return;
  if (!name) { chip.classList.remove('open'); chip.innerHTML = ''; return; }
  const countHtml = loading
    ? `<span class="region-chip-count">loading…</span>`
    : (count != null ? `<span class="region-chip-count">${count.toLocaleString()} observation${count === 1 ? '' : 's'}</span>` : '');
  chip.innerHTML = `<span>${BMG_ICONS.pin}</span><span>${esc(name)}</span>${countHtml}
    <button class="region-chip-close" id="region-chip-close" title="Clear region filter">×</button>`;
  chip.classList.add('open');
  document.getElementById('region-chip-close')?.addEventListener('click', () => clearRegionFilter());
}

function initSearch() {
  const container   = document.getElementById('search-container');
  const input       = document.getElementById('search-input');
  const clearBtn    = document.getElementById('search-clear');
  const suggestions = document.getElementById('search-suggestions');

  L.DomEvent.disableClickPropagation(container);
  L.DomEvent.disableScrollPropagation(container);

  const doSearch = debounce(async q => {
    if (q.length < 2) { suggestions.classList.remove('open'); return; }
    // Show iNat species matches instantly (in-memory), then append location results
    const taxonResults = searchInatTaxa(q);
    if (taxonResults.length && input.value.trim() === q) renderSuggestions(taxonResults);
    const locationResults = await fetchNominatim(q);
    if (input.value.trim() === q) renderSuggestions([...taxonResults, ...locationResults]);
  }, 300);

  input.addEventListener('input', () => {
    const q = input.value.trim();
    clearBtn.classList.toggle('visible', q.length > 0);
    if (!q) { suggestions.classList.remove('open'); return; }
    doSearch(q);
  });

  function updateHighlight() {
    document.querySelectorAll('.search-suggestion').forEach((el, i) => {
      el.classList.toggle('highlighted', i === searchHighlightedIdx);
    });
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      suggestions.classList.remove('open');
      input.blur();
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      searchHighlightedIdx = Math.min(searchHighlightedIdx + 1, searchCurrentSuggestions.length - 1);
      updateHighlight();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      searchHighlightedIdx = Math.max(searchHighlightedIdx - 1, -1);
      updateHighlight();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const idx = searchHighlightedIdx >= 0 ? searchHighlightedIdx : 0;
      if (searchCurrentSuggestions[idx]) selectSearchResult(searchCurrentSuggestions[idx]);
    }
  });

  suggestions.addEventListener('click', e => {
    const row = e.target.closest('.search-suggestion');
    if (!row) return;
    const idx = parseInt(row.dataset.idx);
    if (searchCurrentSuggestions[idx]) selectSearchResult(searchCurrentSuggestions[idx]);
  });

  clearBtn.addEventListener('click', () => {
    input.value = '';
    clearBtn.classList.remove('visible');
    suggestions.classList.remove('open');
    searchCurrentSuggestions = [];
    closeLocationPanel();
    if (inatRegionFilter) clearRegionFilter(false);
    if (inatSpeciesFilter) {
      inatSpeciesFilter = null;
      searchInatTaxa._counts = null;
    }
    rebuildInatIndex();
    inatSpeciesSidebarId     = null;
    inatNav.speciesTaxonId   = null;
    inatNav.speciesTaxonName = null;
    if (speciesClimateChart) { speciesClimateChart.destroy(); speciesClimateChart = null; }
  if (speciesPhenoChart)   { speciesPhenoChart.destroy();   speciesPhenoChart   = null; }
    input.focus();
  });

  document.addEventListener('click', e => {
    if (!container.contains(e.target)) suggestions.classList.remove('open');
  });
}

function buildFilterUI() {
  // Genus
  const genusEl = document.getElementById('filter-genus');
  genusEl.innerHTML = availableGenera.map(g => {
    const n = allMapTaxa.filter(t => t.genus === g).length;
    return `<label class="filter-label">
      <input type="checkbox" data-ftype="genus" data-val="${esc(g)}" checked>
      <span class="genus-dot" style="background:${genusColor(g)}"></span>
      ${esc(g)} <span class="filter-count">${n}</span>
    </label>`;
  }).join('');

  // Köppen groups
  const koppenEl = document.getElementById('filter-koppen');
  koppenEl.innerHTML = [
    ['A','Tropical'],['B','Arid'],['C','Temperate'],
    ['D','Continental'],['E','Polar / Highland'],['?','No zone data']
  ].map(([k, label]) => `<label class="filter-label">
    <input type="checkbox" data-ftype="koppen" data-val="${k}" checked>
    ${label}
  </label>`).join('');

  // Elevation bands
  const elevEl = document.getElementById('filter-elev');
  elevEl.innerHTML = [...ELEV_BANDS, '?'].map(b => `<label class="filter-label">
    <input type="checkbox" data-ftype="elev" data-val="${b}" checked>
    ${b === '?' ? 'Not set' : b.charAt(0).toUpperCase()+b.slice(1)}
  </label>`).join('');

  document.querySelectorAll('#filter-panel input[type=checkbox]').forEach(cb =>
    cb.addEventListener('change', applyFilters)
  );
  document.getElementById('filter-reset').addEventListener('click', resetFilters);
}

function applyFilters() {
  const checkedGenera  = new Set([...document.querySelectorAll('[data-ftype=genus]:checked')].map(el => el.dataset.val));
  const checkedKoppen  = new Set([...document.querySelectorAll('[data-ftype=koppen]:checked')].map(el => el.dataset.val));
  const checkedElev    = new Set([...document.querySelectorAll('[data-ftype=elev]:checked')].map(el => el.dataset.val));

  const allGenera  = availableGenera.length;
  const isDefault  = checkedGenera.size === allGenera && checkedKoppen.size === 6 && checkedElev.size === ELEV_BANDS.length + 1;
  // Optional chaining: the reset button only exists once buildFilterUI has
  // run; the gallery toggle (in buildMapControls, which runs first) can race
  // with that during a slow data load.
  const resetBtn = document.getElementById('filter-reset');
  if (resetBtn) resetBtn.style.display = isDefault ? 'none' : 'block';

  markerStore.forEach(({ marker, circle, taxon }) => {
    const genusOk  = checkedGenera.has(taxon.genus);
    const kg       = koppenGroup(taxon.koppenZone);
    const koppenOk = checkedKoppen.has(kg);
    const eb       = getElevBand(taxon) || '?';
    const elevOk   = checkedElev.has(eb) || (eb === '?' && checkedElev.has('?'));
    // Global gallery toggle wins: when off, all gallery pins hide regardless
    // of the filter checkbox state. The filter UI stays usable so users can
    // dial in their preferred filter before flipping the gallery back on.
    const show     = gallerySpeciesVisible && genusOk && koppenOk && elevOk;

    show ? marker.addTo(map) : map.removeLayer(marker);
    if (circle) show ? circle.addTo(map) : map.removeLayer(circle);
  });
}

// Flip the global gallery-species visibility flag, persist it, refresh the
// button's pressed state, and re-run filters so the markers actually update.
// Safe to call before #filter-panel exists: applyFilters tolerates that.
function setGallerySpeciesVisible(visible) {
  gallerySpeciesVisible = !!visible;
  try { localStorage.setItem('bmg_gallery_visible', String(gallerySpeciesVisible)); } catch {}
  const btn = document.getElementById('gallery-toggle');
  if (btn) btn.classList.toggle('active', gallerySpeciesVisible);
  applyFilters();
}

function resetFilters() {
  document.querySelectorAll('#filter-panel input[type=checkbox]').forEach(cb => { cb.checked = true; });
  applyFilters();
}

function buildUnmappedList() {
  const sorted = [...unmappedTaxa].sort((a, b) =>
    (a.genus + a.species + a.displayName).localeCompare(b.genus + b.species + b.displayName)
  );
  // Count badge was removed from the toggle button — the panel header below
  // already shows the items, so no badge update is needed here anymore.

  document.getElementById('unmapped-list').innerHTML = sorted.map(t => {
    const icons = [];
    if (!t.mapPin?.lat)     icons.push(`<span class="unmapped-icon" title="No coordinates">📍</span>`);
    if (!t.koppenZone)      icons.push(`<span class="unmapped-icon" title="No Köppen zone">🌡️</span>`);
    if (!t.mapPin?.elevationM) icons.push(`<span class="unmapped-icon" title="No elevation">↕</span>`);
    return `<div class="unmapped-row">
      <div class="unmapped-name" title="${esc(t.displayName)}">${esc(t.displayName)}</div>
      <div class="unmapped-country">${esc(t.country || '—')}</div>
      <div class="unmapped-icons">${icons.join('')}</div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════════
//  URL / DEEP LINK
// ═══════════════════════════════════════════════════════════

function setUrlParam(key, val) {
  const url = new URL(location.href);
  val ? url.searchParams.set(key, val) : url.searchParams.delete(key);
  history.replaceState(null, '', url);
}

// The deep-link params are mutually exclusive views. Setting one clears the
// others (and the legacy ?taxon / ?slug gallery params) so the address bar
// always reflects a single shareable state.
const DEEPLINK_KEYS = ['taxon', 'slug', 'sp', 'obs', 'at', 'region'];
function setDeepLink(key, val) {
  const url = new URL(location.href);
  for (const k of DEEPLINK_KEYS) url.searchParams.delete(k);
  if (key && val != null) url.searchParams.set(key, val);
  history.replaceState(null, '', url);
}

// Build a full shareable URL for a given deep-link param without touching the
// current address bar (used by the Copy-link buttons).
function buildShareUrl(key, val) {
  const url = new URL(location.href);
  for (const k of DEEPLINK_KEYS) url.searchParams.delete(k);
  url.searchParams.set(key, val);
  return url.toString();
}

// Small inline "Copy link" button. `id` must be unique within the panel.
function copyLinkBtnHtml(key, val, id) {
  return `<button class="copy-link-btn" id="${id}" data-key="${esc(String(key))}" data-val="${esc(String(val))}" title="Copy a shareable link to this view">${BMG_ICONS.link} Copy link</button>`;
}
// Delegated handler (wired once) — copies the link and shows a transient ✓.
function wireCopyLinkButtons(root) {
  (root || document).querySelectorAll('.copy-link-btn').forEach(btn => {
    if (btn._wired) return;
    btn._wired = true;
    btn.addEventListener('click', async () => {
      const url = buildShareUrl(btn.dataset.key, btn.dataset.val);
      try { await navigator.clipboard.writeText(url); }
      catch { /* clipboard blocked — fall back to prompt */ prompt('Copy this link:', url); return; }
      const prev = btn.innerHTML;
      btn.innerHTML = `${BMG_ICONS.check} Copied`;
      btn.classList.add('copied');
      setTimeout(() => { btn.innerHTML = prev; btn.classList.remove('copied'); }, 1600);
    });
  });
}

function handleUrlParams() {
  const p    = new URLSearchParams(location.search);

  // ?region=<osm_type><osm_id> e.g. "R165475" — admin region filter + fit.
  const region = p.get('region');
  if (region) { applyRegionFromOsmRef(region); return; }

  // ?obs=<obsId> — open a specific observation (resolved via iNat API).
  const obsId = p.get('obs');
  if (obsId) { openObsById(obsId); return; }

  // ?sp=<taxonId> — open a species sidebar + fit to its observations.
  const spId = p.get('sp');
  if (spId) {
    const ti = inatTaxa.findIndex(t => String(t[0]) === String(spId) || t[1] === spId);
    // taxonId in species-data is the iNat taxon id; our inatTaxa rows are
    // [taxonId?, name, genus, common] — match by name fallback below.
    const name = ti >= 0 ? inatTaxa[ti][1] : null;
    selectInatTaxonById(spId, name);
    return;
  }

  // ?at=lat,lng[,zoom] — open the clicked-location panel.
  const at = p.get('at');
  if (at) {
    const parts = at.split(',').map(Number);
    if (parts.length >= 2 && parts.every(n => isFinite(n))) {
      const [lat, lng, z] = parts;
      if (z) map.setView([lat, lng], z);
      window.openClimateAt(lat, lng);
      return;
    }
  }

  // Legacy gallery deep links.
  const txnId = p.get('taxon');
  const slug  = p.get('slug');
  let taxon = null;
  if (txnId)  taxon = allMapTaxa.find(t => t.id === txnId);
  if (!taxon && slug) taxon = allMapTaxa.find(t => t.slug === slug);
  if (taxon) { openPanel(taxon); flyToTaxon(taxon); }
}

// Resolve a ?sp= link. Species pages key on the iNat taxon id (string). We have
// that id in species-data.json; fit the map to the species' observations.
async function selectInatTaxonById(taxonId, taxonNameHint) {
  await loadSpeciesData().catch(() => null);
  const entry = inatSpeciesData && inatSpeciesData[taxonId];
  const taxonName = entry?.scientific_name || taxonNameHint;
  if (!taxonName) return;
  if (!inatVisible) enableInatLayer();
  inatSpeciesFilter = taxonName;
  searchInatTaxa._counts = null;
  rebuildInatIndex();
  const pts = [];
  for (const o of inatObs) if (inatTaxa[o[OBS_TI]]?.[1] === taxonName) pts.push([o[OBS_LAT], o[OBS_LNG]]);
  if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [50, 50], maxZoom: 9, animate: true });
  openSpeciesSidebar(taxonId, taxonName);
}

// Resolve a ?obs= link: fetch the single observation from iNat and open it.
async function openObsById(obsId) {
  try {
    const res = await fetch(`${INAT_API_OBS}${obsId}?`);
    if (!res.ok) return;
    const o = (await res.json()).results?.[0];
    if (!o) return;
    const geo = o.geojson?.coordinates;                       // [lng, lat], public (obscured) coords
    const lat = geo ? geo[1] : (o.latitude != null ? +o.latitude : null);
    const lng = geo ? geo[0] : (o.longitude != null ? +o.longitude : null);
    if (lat == null || lng == null) return;
    const obscured = o.geoprivacy === 'obscured' || o.taxon_geoprivacy === 'obscured';
    let flags = 0;
    if (obscured) flags |= F_OBSCURED;
    if (o.quality_grade !== 'research') flags |= F_NEEDSID;
    if (o.photos?.length) flags |= F_PHOTO;
    const kv = getKoppenAt(lat, lng);
    const feature = {
      geometry: { coordinates: [lng, lat] },
      properties: {
        obs_id:      o.id,
        lat, lng,
        taxon_name:  o.taxon?.name || 'Unknown',
        common_name: o.taxon?.preferred_common_name || null,
        genus:       (o.taxon?.name || '').split(' ')[0],
        date:        o.observed_on || null,
        flags,
        photo_id:    o.photos?.[0]?.id || null,
        koppen:      (kv >= 1 && kv <= 30) ? kv : 0,
      },
    };
    if (!inatVisible) enableInatLayer();
    map.setView([lat, lng], obscured ? 9 : 11, { animate: true });
    openInatObsPanel(feature);
  } catch { /* ignore */ }
}

// ═══════════════════════════════════════════════════════════
//  MOBILE SWIPE TO DISMISS
// ═══════════════════════════════════════════════════════════

function initMobileSwipe() {
  const panel  = document.getElementById('side-panel');
  const handle = document.getElementById('panel-drag-handle');
  const header = document.getElementById('panel-header');
  let startY = 0, dragging = false;

  function onStart(e) {
    startY   = e.touches[0].clientY;
    dragging = true;
    panel.style.transition = 'none';
  }
  function onMove(e) {
    if (!dragging) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0) panel.style.transform = `translateY(${dy}px)`;
  }
  function onEnd(e) {
    if (!dragging) return;
    dragging = false;
    panel.style.transition = '';
    const dy = e.changedTouches[0].clientY - startY;
    panel.style.transform = '';
    if (dy > 80) closePanel();
  }

  [handle, header].forEach(el => {
    el.addEventListener('touchstart', onStart, { passive: true });
  });
  window.addEventListener('touchmove', onMove, { passive: true });
  window.addEventListener('touchend',  onEnd);

  // Keep body.panel-open in sync with #side-panel.open (used by mobile CSS to
  // auto-hide the control stack while the bottom info panel is up). One observer
  // beats threading a class toggle through all five open/close call sites.
  const sync = () => {
    const open = panel.classList.contains('open');
    document.body.classList.toggle('panel-open', open);
    // Opening the panel collapses the control stack so they never overlap.
    if (open) document.body.classList.remove('controls-open');
  };
  new MutationObserver(sync).observe(panel, { attributes: true, attributeFilter: ['class'] });
  sync();

  // Horizontal swipe-back on the panel body (mobile). Swipe RIGHT to go back a
  // page (matches the system back gesture); at the root view it closes the
  // panel. Vertical drags are left to the drag-to-dismiss handler above.
  initPanelSwipeBack();
}

// Swipe-right-to-go-back on the bottom info panel. Tracks a touch on
// #panel-scroll; if it's a mostly-horizontal rightward swipe past a threshold,
// it triggers the same action as the back button (or closes at the root).
function initPanelSwipeBack() {
  const scroll = document.getElementById('panel-scroll');
  if (!scroll) return;
  let x0 = 0, y0 = 0, tracking = false;

  scroll.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { tracking = false; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; tracking = true;
  }, { passive: true });

  scroll.addEventListener('touchend', e => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    // Rightward, clearly horizontal, and a meaningful distance.
    if (dx > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) {
      if (navStack.length) navGoBack();   // go back one page
      else                 closePanel();  // root view → dismiss
    }
  }, { passive: true });
}

// Mobile: the hamburger button toggles the top-right control stack open/closed
// (via body.controls-open). Tapping the map or opening a panel collapses it.
function initMobileControlsToggle() {
  const btn = document.getElementById('mobile-controls-toggle');
  if (!btn) return;
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const open = document.body.classList.toggle('controls-open');
    btn.classList.toggle('active', open);
  });
  // Tapping the map closes the stack.
  map.on('click', () => {
    document.body.classList.remove('controls-open');
    btn.classList.remove('active');
  });
}

//  ELIGIBILITY
// ═══════════════════════════════════════════════════════════

function isEligible(t) {
  if (t.mapPin?.override === true && t.mapPin?.includedOnMap === true) return true;
  return t.entryType === 'species' || t.entryType === 'location';
}

function hasCoords(t) {
  return t.mapPin?.lat != null && t.mapPin?.lng != null;
}

//  MAIN INIT
// ═══════════════════════════════════════════════════════════

async function init() {
  setProgress(10);
  initMap();
  buildMapControls();
  initMobileSwipe();
  initMobileControlsToggle();
  initGalleryLightbox();
  initSearch();

  // UI wiring
  document.getElementById('panel-close').addEventListener('click', closePanel);
  document.getElementById('unit-f').addEventListener('click', () => setTempUnit('F'));
  document.getElementById('unit-c').addEventListener('click', () => setTempUnit('C'));
  document.getElementById('unit-f').classList.toggle('active', tempUnit === 'F');
  document.getElementById('unit-c').classList.toggle('active', tempUnit === 'C');

  // Filter / unmapped buttons are Leaflet controls now (FilterCtrl / UnmappedCtrl
   // in buildMapControls), so their click handlers live there. We still need to
   // close any open sightings panels when the user clicks an empty spot on the
   // map — done here so it stays consistent with the existing "click map to
   // close" UX. iNat panel is intentionally excluded because clicking the map
   // shouldn't dismiss the iNat layer toggle (a heavier interaction).
  map.on('click', () => {
    document.getElementById('filter-panel')?.classList.remove('open');
    document.getElementById('filter-toggle')?.classList.remove('active');
    document.getElementById('unmapped-panel')?.classList.remove('open');
    document.getElementById('unmapped-toggle')?.classList.remove('active');
  });

  document.getElementById('copy-csv').addEventListener('click', () => {
    const lines = ['id,slug,displayName,country,entryType'];
    unmappedTaxa.forEach(t =>
      lines.push(`${t.id},${t.slug},"${(t.displayName||'').replace(/"/g,'""')}",${t.country||''},${t.entryType}`)
    );
    navigator.clipboard?.writeText(lines.join('\n')).then(() => {
      const btn = document.getElementById('copy-csv');
      btn.textContent = '✓ Copied';
      setTimeout(() => { btn.textContent = 'Copy CSV'; }, 1600);
    });
  });

  setProgress(22);

  // Load species data
  try {
    // This map has no curated "gallery species" layer (that was the Bogman
    // shop's product taxa). Start with empty curated data — all map content
    // comes from the iNaturalist observation layer enabled further below.
    const data = { taxa: [], habitats: [] };
    setProgress(60);

    // Habitats lookup
    if (Array.isArray(data.habitats)) {
      data.habitats.forEach(h => { habitatsMap[h.id] = h.name; });
    }

    const eligible  = (data.taxa || []).filter(isEligible);
    allMapTaxa      = eligible.filter(hasCoords);
    unmappedTaxa    = eligible.filter(t => !hasCoords(t));

    // Collect genera present on map
    const genSet = new Set(allMapTaxa.map(t => t.genus));
    availableGenera = [...genSet].sort();
    availableGenera.forEach(g => activeFilters.genera.add(g));

    setProgress(75);
    renderPins(allMapTaxa);   // honours gallerySpeciesVisible — no second pass needed
    buildFilterUI();
    buildUnmappedList();
    setProgress(88);

    await loadKoppen();

    // Ensure pins sit above Köppen layer
    markerStore.forEach(({ marker }) => marker.bringToFront?.());

    setProgress(100);
    handleUrlParams();
    buildInatFilterPanel();
    // Observations are the map's primary utility — show them on load instead
    // of waiting for the user to flip the "Show pins" toggle. enableInatLayer
    // loads the data (all.json on desktop, per-genus on mobile), so the older
    // desktop-only prefetch warm-up is no longer needed.
    enableInatDefault();


    // Close iNat panel on map click
    map.on('click', () => {
      document.getElementById('inat-panel').classList.remove('open');
    });

  } catch (err) {
    console.error('Data load failed:', err);
    setProgress(100);
    // (Count badge on #unmapped-toggle was removed; failure is now visible
    // only via the dev console — the welcome modal stays put.)
  }
}

const INAT_GENERA = [
  'Calochortus',
];

const INAT_GENUS_COLORS = {
